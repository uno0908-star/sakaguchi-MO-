.sec-note{font-size:11.5px;color:#666;font-weight:400;margin-left:6px}

.kpi .l{font-size:11px;color:#666}

.kpi .n{font-size:11px;color:#888}

.split{background:#fff;border-radius:10px;padding:13px 14px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-top:10px}
.sbar{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:8px 0 6px;background:#eee}
.sbar i{display:block;height:100%}
.sbar .w{background:#e53935}.sbar .s{background:#8e24aa}.sbar .p{background:#2e7d32}

.slegend b{font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

.top3 ol{margin:0;padding-left:20px}
.top3 li{margin-bottom:9px;font-size:13.5px}
.top3 li:last-child{margin-bottom:0}
.top3 .amt{color:#c62828;font-weight:800}

.ghead{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:700;margin:16px 0 8px}
.gcount{font-size:11.5px;color:#666;font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:11px}
.store{background:#fff;border-radius:11px;box-shadow:0 1px 5px rgba(0,0,0,.09);overflow:hidden;border-top:4px solid #999}

.todo b{color:#c62828}

.cut .h{font-weight:800;color:#e65100;margin-bottom:5px}

.gain{margin-top:10px;background:#e8f5e9;border-radius:7px;padding:8px 10px;font-size:12.5px;color:#1b5e20;font-weight:700}

table{border-collapse:collapse;width:100%;font-size:12px;min-width:640px}

  ff:    {label:'ファストフード（FF）',             act:'時間帯別の陳列本数の基準に戻す。ピーク後の作り置きをやめる'},
  kitch: {label:'まちかど厨房',                     act:'仕込み量を前日実績ベースに。18時以降の追加仕込みを止める'},
  dry:   {label:'ドライ（定番）',                   act:'期限接近品の前出し・値引きを日次で回す。定番在庫を圧縮'},
};

function calc(s) {
  const gp   = GROSS_PROFIT[s.name] || {};
  const fjD  = (s.fjIncome != null && s.fjBudget != null) ? s.fjIncome - s.fjBudget : 0;
  const sup  = (s.hqSupport||0) + (s.kitchenSupportMonth||0) + (s.miscExtra||0) + (s.miscExtraMin||0);
  const mdO  = s.markdownActual - s.markdownBudget;        // ＋＝見切超過
  const w    = WMAP[s.name] || null;
  const wSum = w ? ['aico','op','ff','kitch','dry'].reduce((a,k)=>a+(w[k]?w[k].diff:0),0) : 0;
  const prev = PREV && PREV.stores[s.name] ? PREV.stores[s.name] : null;

  // 主因の判定：赤字要因だけを比べる
  const lossSales = fjD < 0 ? -fjD : 0;
  const lossWaste = mdO > 0 ?  mdO : 0;
  let type = 'ok';
  if (s.diff < 0) {
    if (lossWaste <= 0 && lossSales <= 0)                 type = 'mix';
    else if (lossWaste >= lossSales * 1.5)                type = 'waste';
    else if (lossSales >= lossWaste * 1.5)                type = 'sales';
    else                                                  type = 'mix';
  }
  return {
    s, gpa:gp.gpa ?? null, gpb:gp.gpb ?? null, fjD, sup, mdO, w, wSum, prev, type,
    lossSales, lossWaste,
    sc: SC_MAP[s.name] || '—',
    dLanding: prev ? s.landing - prev.landing : null,
    gpRate: (gp.gpa != null && s.sales) ? gp.gpa / s.sales * 100 : null,
  };
}
const ALL = PROFIT.map(calc);
const GP_RATE_AVG = (() => {
  const v = ALL.filter(x => x.gpRate != null).map(x => x.gpRate);
  return v.length ? v.reduce((a,b)=>a+b,0) / v.length : 0;
})();

/* 残り日数（いまの時点から月末まで）。経費は残りの日数でしか削れない */
const DAYS_IN_MONTH = (() => {
  const y = 2000 + parseInt(CUR_LABEL.month.match(/(\d\d)年/)[1], 10);
  const m = parseInt(CUR_LABEL.month.match(/年(\d+)月度/)[1], 10);
  return new Date(y, m, 0).getDate();
})();
const DAY_NOW = parseInt(CUR_LABEL.date.match(/\/(\d+)/)[1], 10);
const REMAIN  = Math.max(1, DAYS_IN_MONTH - DAY_NOW);
const HOURLY  = 1.3;   // 人件費 1時間あたり（千円）＝時給＋社会保険等の目安。変える時はここ

/* 未達額を経費で取り返す目安
   ① 廃棄：基準（または見切予算）を超えている分を、残り日数で基準まで戻す
   ② 残りを 人件費 と その他経費（消耗品・水道光熱など）に予算の比率で割り振る */
function costPlan(x) {
  const s = x.s;
  if (s.diff >= 0) return null;
  const gap = -s.diff;
  const benchOver = x.w ? ['aico','op','ff','kitch','dry']
    .reduce((a,k) => a + Math.max(0, x.w[k] ? x.w[k].diff : 0), 0) : 0;   // 千円/日
  const mdOverDay = Math.max(0, x.mdO) / DAYS_IN_MONTH;                     // 千円/日
  const wasteDay  = Math.max(benchOver, mdOverDay);
  const waste     = Math.min(gap, wasteDay * REMAIN);
  const rest      = gap - waste;
  const L = s.laborBudget || 0, O = s.otherExp || 0;
  const labor = (L + O) ? rest * L / (L + O) : 0;
  const other = rest - labor;
  const lRemain = L * REMAIN / DAYS_IN_MONTH, oRemain = O * REMAIN / DAYS_IN_MONTH;
  return {
    gap, salesLoss: Math.max(0, -x.fjD), waste, wasteDay: waste / REMAIN,
    labor, laborHours: labor / REMAIN / HOURLY, laborPct: lRemain ? labor / lRemain * 100 : 0,
    other, otherDay: other / REMAIN, otherPct: oRemain ? other / oRemain * 100 : 0,
  };
}

/* 値引・AICO（profit.html の「値引・AICO対策」タブと同じ定数） */
const NEBIKI_TGT_RATE = 0.026, COST_RATE = 0.7, MONTH_DAYS = 31;
const AICO_UNIT_YEN = {'米飯':450,'調理パン':250,'調理麺':480,'デリカ':350,'デザート':280,'ベーカリー':160,'生鮮品':250};
function nebikiCut(s) { return Math.max(0, (s.nebiki || 0) - s.nisshu * NEBIKI_TGT_RATE); }   // 千円/日(売価)
function aicoTopDept(x) {
  const ds = AICO_DEPT[x.s.name]; if (!ds || !x.w) return '';
  const r = x.w.aico.rate || 0.10;
  const top = Object.entries(ds).map(([d, v]) => ({d, over: v[1] - v[0] * r}))
    .filter(o => o.over > 0.1).sort((a, b) => b.over - a.over).slice(0, 2);
  return top.length ? '（多いのは ' + top.map(o => `${o.d} 約${Math.round(o.over * 1000 / (AICO_UNIT_YEN[o.d] || 300))}個/日`).join('・') + '）' : '';
}

let curSC = 'all';
function view() { return curSC === 'all' ? ALL : ALL.filter(x => x.sc === curSC); }
const yen = n => Math.round(n).toLocaleString();
const sg  = n => (n >= 0 ? '+' : '−') + yen(Math.abs(n));

/* ================================================================
   打ち手の自動生成
   ================================================================ */
function wasteTodos(x) {
  if (!x.w) return [];
  const cats = ['aico','op','ff','kitch','dry']
    .map(k => ({k, d: x.w[k] ? x.w[k].diff : 0, a: x.w[k] ? x.w[k].actual : 0, b: x.w[k] ? x.w[k].bench : 0}))
    .filter(c => c.d > 0.3).sort((a,b) => b.d - a.d).slice(0, 2);
  return cats.map(c => {
    const perMonth = c.d * 30;
    return `<b>${WCAT[c.k].label}</b>${c.k === 'aico' ? aicoTopDept(x) : ''} が基準より <b>${c.d.toFixed(1)}千円/日（月 約${yen(perMonth)}千円）</b>多い。`
         + `<br>→ ${WCAT[c.k].act}。<span style="color:#777">（実績 ${c.a.toFixed(1)} / 基準 ${c.b.toFixed(1)} 千円/日）</span>`;
  });
}

function salesTodos(x) {
  const t = [];
  const s = x.s;
  if (x.fjD < 0 && s.fjIncome && s.sales) {
    const rate = s.fjIncome / s.sales;                 // 売上1千円あたりのFC収入
    const needSales = (-x.fjD) / rate;                 // 月に必要な売上（千円）
    const perDay    = needSales / 30;
    const pct = s.nisshu ? perDay / s.nisshu * 100 : 0;
    t.push(`FC収入が予算に <b>${yen(-x.fjD)}千円</b> 足りない。`
         + `<br>→ 取り戻すには <b>日販を +${yen(perDay)}千円/日</b>（月 +${yen(needSales)}千円・日販の${pct.toFixed(0)}%）必要。`
         + (pct > 10 ? `<br><span style="color:#c62828">※ 日販の${pct.toFixed(0)}%増は今月中には戻せない水準。<b>戻らない分は廃棄・人件費・経費で取り返す</b>（下のオレンジ枠の目安）。</span>` : ''));
  }
  const yoyGap = s.yoy - s.yoyBudget;
  if (yoyGap < 0) {
    t.push(`売上前年比が予算に <b>${Math.abs(yoyGap).toFixed(1)}pt</b> 届いていない（実績${s.yoy.toFixed(1)}% / 予算${s.yoyBudget.toFixed(1)}%）。`
         + `<br>→ 品切れロス（欠品）と、棚替え実施の遅れを先に潰す。`);
  }
  if (x.gpRate != null && x.gpRate < GP_RATE_AVG - 0.5) {
    t.push(`荒利率が全店平均より低い（<b>${x.gpRate.toFixed(1)}%</b> / 平均 ${GP_RATE_AVG.toFixed(1)}%）。`
         + `<br>→ 値引き販売の比率と、粗利の高いカテゴリ（FF・厨房・カウンター）の品揃えを確認。`);
  }
  if (x.gpa != null && x.gpb != null && x.gpa < x.gpb) {
    t.push(`総荒利益が予算に <b>${yen(x.gpb - x.gpa)}千円</b> 足りない（実績${yen(x.gpa)} / 予算${yen(x.gpb)}）。`
         + `<br>→ 週次で荒利の積み上げを追う。売価変更（値下げ）の乱発を止める。`);
  }
  return t;
}

function nebikiTodo(x) {
  const c = nebikiCut(x.s);
  if (c < 0.5) return [];
  return [`<b>値引</b>が1日 ${(x.s.nebiki).toFixed(1)}千円（日販比${(x.s.nebiki / x.s.nisshu * 100).toFixed(1)}%）。目標${(NEBIKI_TGT_RATE * 100).toFixed(1)}%まで <b>1日 −${c.toFixed(1)}千円（月 約${yen(c * MONTH_DAYS * COST_RATE)}千円）</b>。`
    + `<br>→ 値引の開始時刻と値引率を店で1つに決める。毎日値引が出る品目は<b>発注を減らす</b>（<a href="profit.html#nebiki">行動計画</a>）`];
}
function supportTodo(x) {
  const h = x.s.hqSupport || 0;
  if (h <= 0) return [];
  return [`11月からAICOの本部支援 <b>${yen(h)}千円/月</b> がなくなる想定。AICO廃棄は5%・値引は日販比${(NEBIKI_TGT_RATE * 100).toFixed(1)}%まで下げて埋める。`];
}

function todosOf(x) {
  let t = [];
  if (x.type === 'waste')      t = wasteTodos(x).concat(salesTodos(x).slice(0, 1));
  else if (x.type === 'sales') t = salesTodos(x).concat(wasteTodos(x).slice(0, 1));
  else                         t = wasteTodos(x).slice(0, 2).concat(salesTodos(x).slice(0, 2));
  t = t.slice(0, 2).concat(nebikiTodo(x), supportTodo(x), t.slice(2));
  if (x.s.type === 'TS' && x.sup < 50)
    t.push(`TS契約のため支援金がほぼ無い。<b>荒利と廃棄がそのまま店利益に出る</b>ので、上の2点の効果が他店より大きい。`);
  if (x.s.fjIncome != null && x.s.fjIncome < 1900)
    t.push(`FC収入が最低保証ライン（1,900千円）付近。<b>売上を戻さないと保証頼みが続く</b>。`);
  return t.slice(0, 5);
}

function whyText(x) {
  const d = x.s.diff;
  if (d >= 0) return `予算を <b>${yen(d)}千円</b> 上回っています。この形を崩さないこと。`;
  const parts = [];
  if (x.lossWaste > 0) parts.push(`見切・廃棄の超過が <b>${yen(x.lossWaste)}千円</b>`);
  if (x.lossSales > 0) parts.push(`FC収入（売上・荒利）の不足が <b>${yen(x.lossSales)}千円</b>`);
  const head = parts.length ? parts.join('、') : '経費・その他の差';
  const supTxt = x.sup > 0 ? `支援金 +${yen(x.sup)}千円で埋めてなお` : '';
  return `${head}。${supTxt} <b>${yen(-d)}千円</b> の未達です。`;
}

/* 回収見込み：見切超過を残りの日数で予算ペースまで戻した額（過ぎた日の分は戻らない） */
function recover(x) { return Math.max(0, x.lossWaste) * REMAIN / DAYS_IN_MONTH; }

/* ================================================================
   描画
   ================================================================ */
function renderSC() {
  const list = [...new Set(ALL.map(x => x.sc))].sort();
  document.getElementById('scRow').innerHTML =
    [`<button class="sc-btn ${curSC==='all'?'active':''}" onclick="setSC('all')">全店</button>`]
    .concat(list.map(sc => `<button class="sc-btn ${curSC===sc?'active':''}" onclick="setSC('${sc}')">${sc}</button>`))
    .join('');
}
function setSC(sc) { curSC = sc; render(); }

function renderKpis(v) {
  const miss  = v.filter(x => x.s.diff < 0);
  const dSum  = v.reduce((a,x)=>a+x.s.diff, 0);
  const wSum  = v.reduce((a,x)=>a+recover(x), 0);
  const worse = v.filter(x => x.dLanding != null && x.dLanding < 0).length;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi red"><div class="l">予算未達の店</div><div class="v">${miss.length}<span style="font-size:13px">/${v.length}店</span></div>
      <div class="n">前週より着地が落ちた店 ${worse}店</div></div>
    <div class="kpi red"><div class="l">予算差 合計</div><div class="v">${sg(dSum)}</div><div class="n">千円／月</div></div>
    <div class="kpi amber"><div class="l">残り${REMAIN}日で回収できる額<br><span style="font-size:10px">（見切超過を予算ペースまで戻す）</span></div>
      <div class="v">${yen(wSum)}</div><div class="n">千円／月</div></div>
    <div class="kpi amber"><div class="l">値引を目標まで下げると<br><span style="font-size:10px">（日販比${(NEBIKI_TGT_RATE * 100).toFixed(1)}%・<a href="profit.html#nebiki">行動計画</a>）</span></div>
      <div class="v">+${yen(v.reduce((a,x)=>a+nebikiCut(x.s),0) * MONTH_DAYS * COST_RATE)}</div><div class="n">千円／月</div></div>
    <div class="kpi green"><div class="l">支援金（予算外の上乗せ）</div>
      <div class="v">${yen(v.reduce((a,x)=>a+x.sup,0))}</div><div class="n">千円／月</div></div>`;
}

function renderSplit(v) {
  const wLoss = v.reduce((a,x)=>a+Math.max(0,x.mdO), 0);
  const sLoss = v.reduce((a,x)=>a+Math.max(0,-x.fjD), 0);
  const sup   = v.reduce((a,x)=>a+x.sup, 0);
  const tot   = wLoss + sLoss + sup || 1;
  document.getElementById('split').innerHTML = `
    <div style="font-size:13px;font-weight:700">予算差はこの3つでほぼ説明できます</div>
    <div class="sbar">
      <i class="w" style="width:${wLoss/tot*100}%"></i>
      <i class="s" style="width:${sLoss/tot*100}%"></i>
      <i class="p" style="width:${sup/tot*100}%"></i></div>
    <div class="slegend">
      <span><i class="dot" style="background:#e53935"></i>見切・廃棄の超過 <b>−${yen(wLoss)}</b>千円</span>
      <span><i class="dot" style="background:#8e24aa"></i>FC収入の不足 <b>−${yen(sLoss)}</b>千円</span>
      <span><i class="dot" style="background:#2e7d32"></i>支援金 <b>+${yen(sup)}</b>千円</span>
    </div>`;
}

function renderTop3(v) {
  const now = [], later = [];
  v.filter(x => x.s.diff < 0).forEach(x => {
    if (x.w) ['aico','op','ff','kitch','dry'].forEach(k => {
      const d = x.w[k] ? x.w[k].diff : 0;
      if (d > 0.5) now.push({store:x.s.name, sc:x.sc, amt:d*30,
        txt:`${WCAT[k].label}の廃棄を基準まで戻す`, how:WCAT[k].act});
    });
    const nc = nebikiCut(x.s);
    if (nc > 0.5) now.push({store:x.s.name, sc:x.sc, amt:nc*MONTH_DAYS*COST_RATE,
      txt:`値引を1日 −${nc.toFixed(1)}千円（日販比${(NEBIKI_TGT_RATE*100).toFixed(1)}%まで）`,
      how:'値引の開始時刻と値引率を店で1つに決める。毎日値引が出る品目は発注を減らす'});
    if (x.lossSales > 100) {
      const rate = (x.s.fjIncome && x.s.sales) ? x.s.fjIncome / x.s.sales : 0;
      const perDay = rate ? x.lossSales / rate / 30 : 0;
      const pct = x.s.nisshu ? perDay / x.s.nisshu * 100 : 0;
      later.push({store:x.s.name, sc:x.sc, amt:x.lossSales,
        txt:'売上・荒利の不足を詰める',
        how:`日販を +${yen(perDay)}千円/日 戻す（日販の${pct.toFixed(0)}%・前年比 ${x.s.yoy.toFixed(1)}% → 予算 ${x.s.yoyBudget.toFixed(1)}%）。`
           + (pct > 10 ? '<b style="color:#c62828">今月中に売上だけで戻すのは無理</b>。欠品ゼロ・棚替え徹底で下げ止めつつ、<b>届かない分は廃棄と人件費で取り返す</b>（②-2）'
                       : '欠品ゼロと棚替えの実施徹底から')});
    }
  });
  now.sort((a,b)=>b.amt-a.amt); later.sort((a,b)=>b.amt-a.amt);
  const ol = (list) => '<ol>' + list.slice(0,3).map(c =>
      `<li><b>${c.store}</b>（${c.sc}）：${c.txt} → <span class="amt">月 約${yen(c.amt)}千円</span><br>
       <span style="font-size:12px;color:#555">やること：${c.how}</span></li>`).join('') + '</ol>';
  document.getElementById('top3').innerHTML =
    (now.length || later.length)
    ? `<div style="font-size:13px;font-weight:800;color:#c62828;margin-bottom:6px">🔥 今週すぐ効く（発注・値引きの運用）</div>
       ${now.length ? ol(now) : '<div style="font-size:13px;margin-bottom:10px">廃棄の超過はありません。</div>'}
       <div style="font-size:13px;font-weight:800;color:#1565c0;margin:12px 0 6px">🐢 じっくり効かせる（売場・品揃え）</div>
       ${later.length ? ol(later) : '<div style="font-size:13px">売上起因の大きな不足はありません。</div>'}`
    : '<div style="font-size:13px">未達の店はありません。</div>';
}

function storeCard(x) {
  const s = x.s;
  const badge = {waste:['b-waste','🍱 廃棄・見切が主因'], sales:['b-sales','📉 売上・荒利が主因'],
                 mix:['b-mix','🔀 複合（両方）'], ok:['b-ok','✅ 予算達成']}[x.type];
  const wk = x.dLanding == null ? ''
           : `<div class="w">前週比 <span style="color:${x.dLanding<0?'#c62828':'#2e7d32'};font-weight:700">${sg(x.dLanding)}</span></div>`;
  const todos = todosOf(x);
  const rec = recover(x);
  return `<div class="store ${x.type}">
    <div class="shead">
      <div class="sdiff"><div class="d ${s.diff>=0?'pos':''}">${sg(s.diff)}</div>${wk}</div>
      <div class="sname">${s.name}</div>
      <div class="smeta">${x.sc}／${s.type}／日販 ${s.nisshu.toFixed(0)}千円・前年比 ${s.yoy.toFixed(1)}%</div>
      <span class="badge ${badge[0]}">${badge[1]}</span>
      ${s.fjIncome != null && s.fjIncome < 1900 ? '<span class="badge b-min">最低保証ライン</span>' : ''}
    </div>
    <div class="sbody">
      <div class="why">${whyText(x)}</div>
      <div class="brk">
        <div><div class="bl">FC収入 差</div><div class="bv ${x.fjD<0?'neg':'pos'}">${sg(x.fjD)}</div></div>
        <div><div class="bl">支援金</div><div class="bv pos">+${yen(x.sup)}</div></div>
        <div><div class="bl">見切 超過</div><div class="bv ${x.mdO>0?'neg':'pos'}">${x.mdO>0?'−'+yen(x.mdO):'+'+yen(-x.mdO)}</div></div>
      </div>
      ${todos.length ? `<ul class="todo">${todos.map((t,i)=>
        `<li><span class="num">${i+1}</span><span>${t}</span></li>`).join('')}</ul>` : ''}
      ${cutBox(x)}
      ${rec > 0 ? `<div class="gain">💰 見切・廃棄を残り${REMAIN}日で予算ペースまで戻すと 約${yen(rec)}千円 の回収。
        ${s.diff<0 ? (rec >= -s.diff ? 'これだけで未達 ' + yen(-s.diff) + '千円 を<u>全部カバーできます</u>'
                                     : '未達 ' + yen(-s.diff) + '千円 の ' + Math.round(rec/(-s.diff)*100) + '% が埋まります')
                   : '予算達成をさらに上積みできます'}</div>` : ''}
    </div>
  </div>`;
}

function cutBox(x) {
  const c = costPlan(x);
  if (!c) return '';
  const head = c.salesLoss > 0
    ? `売上不足で店利益が <b>−${yen(c.salesLoss)}千円</b>。売上が戻らない前提で、未達 <b>${yen(c.gap)}千円</b> を残り${REMAIN}日の経費で取り返す目安：`
    : `未達 <b>${yen(c.gap)}千円</b> を残り${REMAIN}日の経費で取り返す目安：`;
  const row = (label, amt, sub) => amt < 0.5 ? '' :
    `<tr><td>${label}<div class="sub">${sub}</div></td><td class="r">−${yen(amt)}千円</td></tr>`;
  const warn = c.laborPct > 15
    ? `<div style="color:#c62828;font-weight:700;margin-top:4px">人件費を残り期間の${c.laborPct.toFixed(0)}%削る水準。経費だけでは厳しいので、売上の下げ止めと両方で詰める。</div>` : '';
  return `<div class="cut"><div class="h">✂️ 経費で取り返す目安</div>${head}
    <table>
      ${row('🍱 廃棄（最優先・今日から）', c.waste, `1日 −${c.wasteDay.toFixed(1)}千円。基準を超えているカテゴリの発注を落とす`)}
      ${row('👥 人件費（最優先・今週のシフトから）', c.labor, `1日 約${c.laborHours.toFixed(1)}時間減（残り期間の人件費予算の${c.laborPct.toFixed(1)}%）`)}
      ${row('🧾 消耗品・その他経費', c.other, `1日 −${(c.otherDay*1000).toFixed(0)}円（残り期間のその他経費予算の${c.otherPct.toFixed(1)}%）`)}
    </table>${warn}</div>`;
}

function renderCutPlan(v) {
  const list = v.map(x => ({x, c: costPlan(x)})).filter(o => o.c).sort((a,b) => b.c.gap - a.c.gap);
  if (!list.length) { document.getElementById('cutPlan').innerHTML = '<div style="font-size:13px">未達の店はありません。</div>'; return; }
  const sum = k => list.reduce((a,o) => a + o.c[k], 0);
  document.getElementById('cutPlan').innerHTML = `
    <div class="cut" style="margin-top:0">
      <div style="margin-bottom:6px">売上で戻せない分は、そのまま店利益が減ります。<b>廃棄と人件費は額が大きいので、今週中に手を入れてください。</b>
        残り<b>${REMAIN}日</b>で、未達の合計 <b>${yen(sum('gap'))}千円</b> を取り返す目安です。<br>
        内訳：廃棄 −${yen(sum('waste'))}千円／人件費 −${yen(sum('labor'))}千円（全店で1日 約${sum('laborHours').toFixed(0)}時間）／その他経費 −${yen(sum('other'))}千円</div>
      <div class="tbl-wrap"><table id="cutTbl">
        <thead><tr><th>店名</th><th>SC</th><th>未達</th><th>売上不足の影響</th><th>廃棄<br>1日あたり</th><th>人件費<br>1日あたり</th><th>その他経費<br>月</th></tr></thead>
        <tbody>${list.map(({x,c}) => `<tr class="miss">
          <td>${x.s.name}</td><td>${x.sc}</td>
          <td style="font-weight:700;color:#c62828">−${yen(c.gap)}</td>
          <td>${c.salesLoss ? '−' + yen(c.salesLoss) : '—'}</td>
          <td>${c.waste >= 0.5 ? '−' + c.wasteDay.toFixed(1) + '千円' : '—'}</td>
          <td>${c.labor >= 0.5 ? '約' + c.laborHours.toFixed(1) + '時間' : '—'}</td>
          <td>${c.other >= 0.5 ? '−' + yen(c.other) + '千円' : '—'}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>`;
}

function renderGroups(v) {
  const order = [
    ['waste','🍱 廃棄・見切が主因', '発注と値引きの運用で今週から戻せます'],
    ['sales','📉 売上・荒利が主因', '売場と品揃え。効くまで時間がかかるので早く着手'],
    ['mix',  '🔀 複合（両方）',     'まず廃棄から。効果が早い'],
    ['ok',   '✅ 予算達成',         'この形を崩さない'],
  ];
  document.getElementById('groups').innerHTML = order.map(([t,label,note]) => {
    const list = v.filter(x => x.type === t).sort((a,b) => a.s.diff - b.s.diff);
    if (!list.length) return '';
    return `<div class="group">
      <div class="ghead">${label}<span class="gcount">${list.length}店 ／ ${note}</span></div>
      <div class="cards">${list.map(storeCard).join('')}</div></div>`;
  }).join('');
}

function renderTable(v) {
  const rows = [...v].sort((a,b) => a.s.diff - b.s.diff);
  document.getElementById('tbl').innerHTML =
    `<thead><tr><th>店名</th><th>SC</th><th>着地</th><th>予算</th><th>予算差</th>
      <th>前週比</th><th>FC収入差</th><th>支援金</th><th>見切超過</th><th>主因</th></tr></thead><tbody>` +
    rows.map(x => `<tr class="${x.s.diff<0?'miss':''}">
      <td>${x.s.name}</td><td>${x.sc}</td>
      <td>${yen(x.s.landing)}</td><td>${yen(x.s.budget)}</td>
      <td style="font-weight:700;color:${x.s.diff<0?'#c62828':'#2e7d32'}">${sg(x.s.diff)}</td>
      <td style="color:${(x.dLanding||0)<0?'#c62828':'#2e7d32'}">${x.dLanding==null?'—':sg(x.dLanding)}</td>
      <td style="color:${x.fjD<0?'#c62828':'#2e7d32'}">${sg(x.fjD)}</td>
      <td>${yen(x.sup)}</td>
      <td style="color:${x.mdO>0?'#c62828':'#2e7d32'}">${x.mdO>0?'−'+yen(x.mdO):'+'+yen(-x.mdO)}</td>
      <td style="text-align:left">${{waste:'廃棄',sales:'売上',mix:'複合',ok:'達成'}[x.type]}</td></tr>`).join('') +
    '</tbody>';
}

function render() {
  const v = view();
  document.getElementById('subLabel').textContent =
    `${CUR_LABEL.month} ${CUR_LABEL.date}　${PREV ? '前週＝' + PREV.date : ''}　（自動生成 2026-10-16 11:54）`;
  renderSC(); renderKpis(v); renderSplit(v); renderTop3(v); renderCutPlan(v); renderGroups(v); renderTable(v);
  document.getElementById('howto').innerHTML =
    `<b>この画面の読み方</b><br>
     予算差は <code>FC収入差 ＋ 支援金 − 見切超過</code> でほぼ説明できます（実データで誤差1千円以内）。<br>
     ・<b>FC収入差</b>＝売上と荒利の結果。戻すのに時間がかかる。<br>
     ・<b>見切超過</b>＝見切処分の予算オーバー。発注と値引きの運用で<b>今週から</b>戻せる。<br>
     ・<b>支援金</b>＝本部支援・厨房支援・雑益追加分。予算に入っていない上乗せ。<br>
     <b>経費で取り返す目安</b>＝未達額を、①廃棄（基準または見切予算を超えている分を残り日数で戻す）→②残りを人件費とその他経費に予算の比率で割り振ったもの。人件費の時間は1時間${HOURLY*1000}円（時給＋社会保険等）で換算。<br>
     廃棄のカテゴリ別の基準（ベンチ）は AICO 売上の7%（本部支援あり）／5%（支援なし）、OP 5%、FF 8%、厨房 15%、ドライ 0.3%。AICOは通常10%だが収支改善のため引き下げ中。<br>
     <b>値引</b>＝営業速報 売変高Ⅲ − DEPT速報 売変高（売価）。目標は日販比${(NEBIKI_TGT_RATE * 100).toFixed(1)}%。店ごとの行動計画は <a href="profit.html#nebiki">値引・AICO対策</a>。<br>
     データは「店利益着地シュミレーション.xlsx」から毎週自動で作り直しています。`;
}
render();
</script>
</body>
</html>

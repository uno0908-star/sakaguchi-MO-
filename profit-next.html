<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>店利益ダッシュボード</title>
<link rel="icon" href="data:,">
<!--
  店利益ダッシュボード（新しい画面）2026-11-18
  ・数字は持たない。同じ場所の profit.html を見えない iframe で読み、その中の定数と計算関数（nwRow / nwPath / bdPlan / kpRow など）を使う。
  ・毎週の更新スクリプトは profit.html だけを書き換えればよい（このファイルは触らなくても最新になる）。
  ・入力は「売変の宣言」だけ（2026-11-20〜 この画面で入れる）。GASへの書き込みは setBaihenDecl の1つだけ。
  ・?shot=1 で、動きなし・全部表示（スクリーンショット用）。
-->
<style>
/* ================= tokens ================= */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic UI","Noto Sans JP","Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --s-light:#ffffff; --s-alt:#f5f5f7; --s-dark:#000000;
  --c-light:#f5f5f7; --c-alt:#ffffff; --c-dark:#1d1d1f;
  --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --line:rgba(0,0,0,.09);
  --accent:#0071e3; --good:#1a7f37; --warn:#b25000; --bad:#d70015;
  --good-bg:#e7f6ea; --warn-bg:#fff2df; --bad-bg:#ffebee;
  --h-g:#e3f4e6; --h-y:#fff1b8; --h-o:#ffd3a1; --h-r:#ffb0ad;
  --ghost:rgba(0,0,0,.12);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --s-light:#000000; --s-alt:#0e0e10; --s-dark:#161617;
    --c-light:#1c1c1e; --c-alt:#1c1c1e; --c-dark:#232325;
    --fg:#f5f5f7; --fg2:#a1a1a6; --fg3:#8e8e93; --line:rgba(255,255,255,.12);
    --accent:#2997ff; --good:#30d158; --warn:#ff9f0a; --bad:#ff453a;
    --good-bg:rgba(48,209,88,.16); --warn-bg:rgba(255,159,10,.16); --bad-bg:rgba(255,69,58,.18);
    --h-g:rgba(48,209,88,.18); --h-y:rgba(255,214,10,.22); --h-o:rgba(255,159,10,.32); --h-r:rgba(255,69,58,.42);
    --ghost:rgba(255,255,255,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --s-light:#000000; --s-alt:#0e0e10; --s-dark:#161617;
  --c-light:#1c1c1e; --c-alt:#1c1c1e; --c-dark:#232325;
  --fg:#f5f5f7; --fg2:#a1a1a6; --fg3:#8e8e93; --line:rgba(255,255,255,.12);
  --accent:#2997ff; --good:#30d158; --warn:#ff9f0a; --bad:#ff453a;
  --good-bg:rgba(48,209,88,.16); --warn-bg:rgba(255,159,10,.16); --bad-bg:rgba(255,69,58,.18);
  --h-g:rgba(48,209,88,.18); --h-y:rgba(255,214,10,.22); --h-o:rgba(255,159,10,.32); --h-r:rgba(255,69,58,.42);
  --ghost:rgba(255,255,255,.16);
  color-scheme:dark;
}
/* 暗いセクション（ヒーローなど）はいつも暗い色 */
.dark{
  --fg:#f5f5f7; --fg2:#a1a1a6; --fg3:#8e8e93; --line:rgba(255,255,255,.13);
  --accent:#2997ff; --good:#30d158; --warn:#ff9f0a; --bad:#ff453a;
  --good-bg:rgba(48,209,88,.16); --warn-bg:rgba(255,159,10,.16); --bad-bg:rgba(255,69,58,.2);
  --h-g:rgba(48,209,88,.18); --h-y:rgba(255,214,10,.22); --h-o:rgba(255,159,10,.32); --h-r:rgba(255,69,58,.42);
  --ghost:rgba(255,255,255,.16);
  --card:var(--c-dark);
  background:var(--s-dark); color:var(--fg);
}
.light{--card:var(--c-light);background:var(--s-light);color:var(--fg)}
.alt{--card:var(--c-alt);background:var(--s-alt);color:var(--fg)}

/* ================= base ================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--s-light)}
body{font-family:var(--font);font-size:17px;line-height:1.55;color:var(--fg);background:var(--s-light);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent);text-decoration:none}
.num,.tab{font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding:0 16px}
@media (min-width:740px){.wrap{padding:0 28px}}
@media (min-width:1100px){.wrap{padding:0 44px}}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .mut{color:var(--fg2)}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= nav ================= */
.gnav{position:fixed;inset:0 0 auto 0;z-index:50;color:#f5f5f7;
  background:rgba(22,22,23,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);transition:background .4s var(--ease)}
.gnav.small{background:rgba(22,22,23,.86)}
.gnav-in{max-width:1360px;margin:0 auto;padding:0 8px 0 16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  grid-template-areas:"brand . act" "pills pills pills";transition:padding .4s var(--ease)}
.brand{grid-area:brand;font-weight:700;font-size:17px;letter-spacing:-.01em;height:48px;display:flex;align-items:center;gap:8px;white-space:nowrap;
  transition:height .4s var(--ease)}
.brand i{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#2997ff,#30d158);display:inline-block}
.gnav.small .brand{height:40px}
.nav-act{grid-area:act;display:flex;gap:6px;align-items:center}
.nbtn{min-height:44px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:600;color:#f5f5f7;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nbtn.sc{background:rgba(255,255,255,.12)}
.nbtn.sc:active{transform:scale(.97)}
.nbtn.old{color:#2997ff}
.pills{grid-area:pills;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -8px 0 -16px;padding:0 10px 4px;scroll-padding:0 24px}
.pills::-webkit-scrollbar{display:none}
.pills a{flex:0 0 auto;min-height:40px;padding:0 13px;border-radius:999px;display:flex;align-items:center;color:rgba(245,245,247,.72);
  font-size:14px;font-weight:600;transition:color .3s,background .3s}
.pills a.on{color:#000;background:#f5f5f7}
@media (min-width:1100px){
  .gnav-in{grid-template-areas:"brand pills act";grid-template-columns:auto 1fr auto;column-gap:16px;padding:0 20px}
  .pills{margin:0;padding:0;justify-content:flex-start}
  .pills a:first-child{margin-left:auto}.pills a:last-child{margin-right:auto}  /* 入る時は中央・あふれる時は左から（先頭が隠れない） */
  .pills a{min-height:36px;font-size:13.5px;padding:0 12px}
  .brand{height:56px}.gnav.small .brand{height:46px}
}

/* ================= sections ================= */
.sec{position:relative;padding:88px 0 92px;scroll-margin-top:92px}
@media (min-width:1100px){.sec{padding:128px 0 132px;scroll-margin-top:46px}}
.eyebrow{font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.02em;margin-bottom:10px}
.h2{font-size:clamp(32px,6.6vw,64px);line-height:1.08;font-weight:700;letter-spacing:-.03em;margin-bottom:16px;text-wrap:balance}
.lead{font-size:clamp(17px,2.1vw,22px);color:var(--fg2);max-width:46em;line-height:1.5;margin-bottom:36px;text-wrap:pretty}
.lead b{color:var(--fg)}
.lead b.bad{color:var(--bad)} .lead b.good{color:var(--good)}
.h2,.lead,.h3{word-break:auto-phrase}
.h3{font-size:clamp(21px,2.6vw,28px);font-weight:700;letter-spacing:-.02em;margin:48px 0 14px;line-height:1.25}
.h3 small{display:block;font-size:14px;font-weight:500;color:var(--fg2);letter-spacing:0;margin-top:4px}
.note{font-size:14px;color:var(--fg2);margin-top:14px;line-height:1.6}

/* ================= hero ================= */
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;overflow:hidden;padding:150px 0 90px;isolation:isolate;background:#000}
.aurora{position:absolute;inset:-20%;z-index:-1;pointer-events:none;filter:blur(70px) saturate(140%);opacity:.85}
.aurora span{position:absolute;border-radius:50%;will-change:transform}
.aurora .a1{width:60vmax;height:60vmax;left:-10%;top:-15%;background:radial-gradient(circle,rgba(41,151,255,.55),transparent 62%);animation:au1 22s ease-in-out infinite alternate}
.aurora .a2{width:55vmax;height:55vmax;right:-15%;top:5%;background:radial-gradient(circle,rgba(191,90,242,.42),transparent 62%);animation:au2 26s ease-in-out infinite alternate}
.aurora .a3{width:50vmax;height:50vmax;left:20%;bottom:-25%;background:radial-gradient(circle,rgba(48,209,88,.32),transparent 62%);animation:au3 30s ease-in-out infinite alternate}
@keyframes au1{to{transform:translate3d(18%,12%,0) rotate(30deg) scale(1.15)}}
@keyframes au2{to{transform:translate3d(-20%,18%,0) rotate(-25deg) scale(.9)}}
@keyframes au3{to{transform:translate3d(10%,-22%,0) rotate(20deg) scale(1.2)}}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:140px;background:linear-gradient(transparent,#000);z-index:-1}
.hero-in{width:100%;text-align:center;will-change:transform,opacity}
.hero .eyebrow{color:#a1a1a6;font-weight:600;font-size:15px}
.hero-k{font-size:clamp(20px,3vw,28px);font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.hero-big{font-size:clamp(76px,22vw,216px);font-weight:700;letter-spacing:-.055em;line-height:.98;
  background:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.62));-webkit-background-clip:text;background-clip:text;color:transparent;
  display:inline-flex;align-items:baseline;gap:.08em;padding:0 .04em}
.hero-big small{font-size:.24em;letter-spacing:0;font-weight:700;-webkit-text-fill-color:#f5f5f7;color:#f5f5f7}
.hero-sub{margin:18px auto 0;font-size:clamp(17px,2.2vw,22px);color:#d2d2d7;display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92em;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.mute{background:var(--ghost);color:var(--fg)}
.hero-need{margin-top:10px;font-size:15px;color:#a1a1a6}
.hero-need b{color:#f5f5f7}
.seg-wrap{margin:40px auto 0;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.seg-l{font-size:14px;color:#a1a1a6}
.seg{position:relative;display:flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:rgba(255,255,255,.1);border-radius:999px;padding:4px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.seg::-webkit-scrollbar{display:none}
.seg-in{position:relative;display:flex}
.seg button{position:relative;z-index:1;flex:0 0 auto;min-height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;color:#f5f5f7;white-space:nowrap;transition:color .35s var(--ease)}
.seg button.on{color:#000}
.seg .ind{position:absolute;z-index:0;top:0;bottom:0;left:0;border-radius:999px;background:#f5f5f7;transition:transform .5s var(--ease),width .5s var(--ease);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.cue{margin-top:44px;font-size:13px;color:#86868b;display:flex;flex-direction:column;align-items:center;gap:6px}
.cue i{width:12px;height:12px;border-right:2px solid #86868b;border-bottom:2px solid #86868b;transform:rotate(45deg);animation:cue 2.2s var(--ease) infinite}
@keyframes cue{0%,100%{transform:translateY(0) rotate(45deg);opacity:.5}50%{transform:translateY(6px) rotate(45deg);opacity:1}}

/* ================= cards / bento ================= */
.bento{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:740px){.bento{grid-template-columns:1fr 1fr;gap:18px}}
@media (min-width:1100px){.bento.b4{grid-template-columns:repeat(4,1fr)}.bento .span2{grid-column:span 2}.bento.b3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border-radius:24px;padding:24px 22px;position:relative;overflow:hidden}
@media (min-width:1100px){.card{padding:30px 28px;border-radius:28px}}
.card .k{font-size:15px;font-weight:600;color:var(--fg2);margin-bottom:8px}
.big{font-size:clamp(46px,8.5vw,76px);font-weight:700;letter-spacing:-.045em;line-height:1.02;font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font-size:.36em;letter-spacing:0;margin-left:4px;font-weight:700}
.big.m{font-size:clamp(38px,6vw,56px)}
.card .s{font-size:15px;color:var(--fg2);margin-top:10px;line-height:1.6}
.card .s b{color:var(--fg)}
.card .s b.good{color:var(--good)} .card .s b.bad{color:var(--bad)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:12px}
.tag.good{background:var(--good-bg);color:var(--good)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* gauge */
.gauge{position:relative;height:12px;border-radius:99px;background:var(--ghost);margin:22px 0 30px}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transform-origin:left center}
.gauge em{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg);border-radius:1px}
.gauge em b{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;white-space:nowrap;font-style:normal}
.gauge em b.up{bottom:calc(100% + 2px)} .gauge em b.dn{top:calc(100% + 2px)}
.gauge em.tg{background:var(--good)} .gauge em.tg b{color:var(--good)}

/* ring */
.ring{display:flex;align-items:center;gap:18px}
.ring svg{flex:0 0 auto}
.ring circle.trk{stroke:var(--ghost)}
.ring circle.val{transition:stroke-dashoffset 1.4s var(--ease)}

/* stacked */
.stack{display:flex;height:44px;border-radius:14px;overflow:hidden;gap:2px;margin:26px 0 14px;background:transparent}
.stack i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;transform-origin:left;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--fg2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend i.ln{height:3px;width:16px;border-radius:2px}

/* indicators */
.inds{display:grid;gap:14px;grid-template-columns:1fr;margin-top:18px}
@media (min-width:600px){.inds{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.inds{grid-template-columns:repeat(3,1fr);gap:18px}}
.ind{text-align:left;width:100%;background:var(--card);border-radius:22px;padding:20px 20px 18px;transition:transform .45s var(--ease),box-shadow .45s var(--ease);display:block}
.ind:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.ind:active{transform:scale(.98)}
.ind-t{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px;font-weight:700}
.ind-v{font-size:42px;font-weight:700;letter-spacing:-.04em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.ind-v small{font-size:15px;font-weight:600;color:var(--fg2);letter-spacing:0;margin-left:8px}
.bar1{position:relative;height:10px;border-radius:99px;background:var(--ghost);margin:14px 0 10px}
.bar1 i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transform-origin:left}
.bar1 em{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--fg);border-radius:1px}
.ind-f{font-size:14.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ind-f .go{color:var(--accent)}

/* sort / segmented small */
.tabs{display:inline-flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.tabs button{min-height:44px;padding:0 16px;border-radius:999px;background:var(--card);font-size:15px;font-weight:600;color:var(--fg);border:1px solid var(--line);transition:background .3s,color .3s,transform .2s}
.tabs button.on{background:var(--fg);color:var(--s-light);border-color:var(--fg)}
.dark .tabs button.on{color:#000}
.tabs button:active{transform:scale(.97)}

/* store grid */
.stores{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:600px){.stores{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.stores{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1280px){.stores{grid-template-columns:repeat(4,1fr);gap:18px}}
.st{position:relative;text-align:left;width:100%;background:var(--card);border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;
  transition:transform .45s var(--ease),box-shadow .45s var(--ease);box-shadow:0 1px 0 var(--line)}
.st::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--lv,transparent)}
.st.l2{--lv:var(--warn)} .st.l3{--lv:var(--bad)}
.st:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.12)}
.st:active{transform:scale(.98)}
.st-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.st-n{font-size:18px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.st-n small{display:block;font-size:13px;color:var(--fg2);font-weight:500;margin-top:2px}
.badge{flex:0 0 auto;text-align:right;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.badge small{display:block;font-size:12.5px;font-weight:600;color:var(--fg2)}
.st-m{font-size:15px;color:var(--fg2)}
.st-m b{font-size:17px}
.pl{display:flex;flex-wrap:wrap;gap:5px}
.pl span{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--ghost);color:var(--fg2);white-space:nowrap}
.pl span.x{background:var(--bad-bg);color:var(--bad)}
.st-d{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;font-size:15px}
.st-d b{font-size:16.5px}
.st-d span{font-size:14px;color:var(--fg2);white-space:nowrap}

/* rows with diverging bars */
.list{background:var(--card);border-radius:24px;padding:8px 18px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 5.6em;grid-template-areas:"l v" "b b";gap:6px 12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .l{grid-area:l;font-weight:700;font-size:16px;line-height:1.35;min-width:0}
.row .l small{font-weight:500;color:var(--fg2);font-size:13.5px}
.row .v{grid-area:v;text-align:right;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .b{grid-area:b}
button.row{cursor:pointer;transition:background .3s}
button.row:hover{background:rgba(127,127,127,.06)}
@media (min-width:740px){.row{grid-template-columns:minmax(9em,15em) 1fr 6.5em;grid-template-areas:"l b v"}}
.dv{position:relative;height:20px}
.dv::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--fg3)}
.dv i{position:absolute;top:0;bottom:0;border-radius:4px}
.dv i.p{left:50%;background:var(--good);transform-origin:left;border-radius:0 4px 4px 0}
.dv i.n{right:50%;background:var(--bad);transform-origin:right;border-radius:4px 0 0 4px}
.cchip{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:4px}
.cchip.bad{background:var(--bad-bg);color:var(--bad)} .cchip.good{background:var(--good-bg);color:var(--good)}

/* two columns */
.two{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:900px){.two{grid-template-columns:1fr 1fr}}

/* tables */

function boot() {
  const ifr = document.createElement('iframe');
  ifr.src = 'profit.html';
  ifr.title = 'engine';
  ifr.setAttribute('aria-hidden', 'true');
  ifr.tabIndex = -1;
  ifr.style.cssText = 'position:absolute;left:-10000px;top:0;width:1280px;height:800px;border:0;visibility:hidden;pointer-events:none';
  let done = false;
  const timer = setTimeout(() => { if (!done) { done = true; fail('時間内に読み込めませんでした'); } }, 25000);
  ifr.addEventListener('load', () => {
    if (done) return;
    done = true; clearTimeout(timer);
    try {
      W = ifr.contentWindow;
      E = W.eval(`({PROFIT, HISTORY, PLAN, CUR_LABEL, SC_MAP, SC_LIST, WASTE, NW_KEYS, NW_LAB, NW_DO,
        nwRow, nwPath, nwCap, nwMan, nwYen, nwSg, nwPct, nwStoreText, prevSnapshot,
        bdPlan, bdNow, bdWeeks, bdDecl, bdWeekActual, bdLoad, bdYen, bdWeekLab, BD, BD_GAS, bdAdd, bdYmd,
        KPI: typeof KPI !== 'undefined' ? KPI : null, kpRow, kpAgg, kpItemStat, kpGo, KP_DO, KP_ACT, kpDept,
        acList, AC, KITCHEN_START, KC_COVER: typeof KC_COVER !== 'undefined' ? KC_COVER : null})`);
      if (!E.PROFIT || !E.PROFIT.length) throw new Error('データが空です');
      if (!E.SC_LIST.includes(SC)) SC = 'all';
      renderAll(true);
      watchBaihen();
    } catch (e) {
      console.error(e);
      fail(e && e.message ? e.message : String(e));
    }
  });
  ifr.addEventListener('error', () => { if (!done) { done = true; clearTimeout(timer); fail('読み込めませんでした'); } });
  document.body.appendChild(ifr);
}

function fail(msg) {
  ROOT.classList.remove('anim');
  const local = location.protocol === 'file:';
  $('#app').innerHTML = `<header class="sec hero dark"><div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
    <div class="wrap err"><h2>読み込めませんでした</h2>
    <p>${local ? 'ファイルを直接開くと読み込めません。GitHub Pages のURLで開いてください。' : '電波のよい所で、もう一度開いてください。'}<br><small>${esc(msg)}</small></p>
    <a class="pbtn" href="profit.html">今のダッシュボードを開く</a></div></header>`;
}

// ===================================================================
// 2. 数字のまとめ（profit.html の関数をそのまま使う）
// ===================================================================
const man = (v, d) => E.nwMan(v, d);                 // 千円 → 万円（数字だけ）
const sgMan = v => E.nwSg(v / 10);                    // 千円 → ±万円（数字だけ）
const yen = v => E.nwYen(v).toLocaleString() + '円';  // 千円/日 → 円
const pc = (k, v) => E.nwPct(k, v);
const who = () => SC === 'all' ? '全社' : SC;

function allRows() { return E.PROFIT.map(p => E.nwRow(p)); }
function rowsSC() { const a = allRows(); return SC === 'all' ? a : a.filter(r => r.sc === SC); }

// renderNow（profit.html）の 上の部分と 同じ集計
function summary(rows) {
  const sum = f => rows.reduce((a, r) => a + f(r), 0);
  const N = sum(r => r.p.nisshu), V = sum(r => r.v), O = sum(r => r.o), VC = sum(r => r.vc), EF = sum(r => r.e);
  const land = sum(r => r.p.landing), bud = sum(r => r.p.budget), diff = land - bud;
  const rate = V / N * 100, after = (V - O) / N * 100;
  const budRate = sum(r => r.p.markdownBudget) / sum(r => r.p.sales) * 100 * V / VC;
  const need = bud - E.PLAN.surplus;
  const ok = rows.filter(r => r.p.diff >= 0).length;
  return {sum, N, V, O, VC, EF, land, bud, diff, rate, after, budRate, need, ok, n: rows.length};
}

// ===================================================================
// 3. 描画
// ===================================================================
let IO = null, NAVIO = null;
function renderAll(first) {
  const rows = rowsSC(), S = summary(rows), path = E.nwPath();
  const html = [heroHtml(S), nowHtml(S, path), cutHtml(rows, S), storesHtml(rows), pathHtml(path),
    profitHtml(rows, S), wasteHtml(rows, S), trendHtml(rows), baihenWrap(), kitchenHtml(), deliveryHtml(), kpiHtml(rows), footHtml()];
  $('#app').innerHTML = html.join('');
  try {
    renderBaihen();
    drawCharts(path);
    setupSeg();
    $('#scBtn').textContent = '担当：' + (SC === 'all' ? '全社' : SC);
    if (first) { buildPills(); bindGlobal(); }
    observe();
    if (first && location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) setTimeout(() => t.scrollIntoView(), 50); }
  } catch (e) {
    console.error(e);
    ROOT.classList.remove('anim');
  }
}

// ---------- ① 現在地 ----------
function ring(v, max, col, size = 96) {
  const r = size / 2 - 7, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, v / max));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="trk" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="10"/>
    <circle class="val ringv" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" data-off="${(c * (1 - f)).toFixed(2)}" stroke-dashoffset="${(c * (1 - f)).toFixed(2)}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
}
function gauge(now, cap, bud, max) {
  const pos = v => Math.min(100, Math.max(0, v / max * 100));
  return `<div class="gauge" role="img" aria-label="今 ${now.toFixed(1)}%・予算 ${bud.toFixed(1)}%・目標 ${cap.toFixed(1)}%"><i class="grow" style="width:${pos(now)}%;background:${now > bud ? 'var(--bad)' : 'var(--good)'}"></i>
    <em style="left:${pos(bud)}%"><b class="up">予算 ${bud.toFixed(1)}%</b></em><em class="tg" style="left:${pos(cap)}%"><b class="dn">目標 ${cap.toFixed(1)}%</b></em></div>`;
}

// ---------- ② 1日いくら減らすか・6つの指標 ----------
function cutHtml(rows, S) {
  const {sum, O, rate, after, EF} = S;
  let stack = '', leg = '';
  if (O > 0.05) {
    stack = `<div class="stack" role="img" aria-label="指標ごとの へらす額">` + E.NW_KEYS.map(k => {
      const o = sum(r => r.O[k]); return o / O > 0.004 ? `<i class="grow" style="width:${o / O * 100}%;background:${KCOL[k]}" data-tip="${E.NW_LAB[k]}\n1日 −${yen(o)}">${o / O > 0.12 ? E.NW_LAB[k] : ''}</i>` : '';
    }).join('') + `</div>`;
    leg = `<div class="legend">` + E.NW_KEYS.map(k => `<span><i style="background:${KCOL[k]}"></i>${E.NW_LAB[k]} −${yen(sum(r => r.O[k]))}</span>`).join('') + `</div>`;
  }
  const inds = E.NW_KEYS.map((k, i) => {
    const s = sum(r => r.S[k]), v = sum(r => r.V[k]), o = sum(r => r.O[k]);
    const r_ = s ? v / s * 100 : 0, cap = E.nwCap(k), n = rows.filter(r => r.O[k] * 1000 >= 50).length;
    const over = r_ > cap, mx = Math.max(cap * 1.8, r_ * 1.15);
    const st = over ? ['bad', '上限より上'] : n ? ['warn', '一部の店が上'] : ['good', '上限内'];
    return `<button type="button" class="ind rv" style="--d:${i * 70}ms" data-ind="${k}">
      <div class="ind-t"><span>${E.NW_LAB[k]}</span><span class="tag ${st[0]}" style="margin:0">${st[1]}</span></div>
      <div class="ind-v ${over ? 'bad' : 'good'}">${pc(k, r_)}<small>上限 ${pc(k, cap)}</small></div>
      <div class="bar1"><i class="grow" style="width:${Math.min(100, r_ / mx * 100)}%;background:${over ? 'var(--bad)' : 'var(--good)'}"></i><em style="left:${cap / mx * 100}%"></em></div>
      <div class="ind-f"><span class="${n ? 'bad' : 'good'}">${n ? `${n}店が超え　−${yen(o)}/日` : '全店 上限内'}</span><span class="go">店を見る</span></div></button>`;
  }).join('');
  return `<section class="sec dark" id="cut"><div class="wrap">
    <div class="eyebrow rv">② これから</div>
    <h2 class="h2 rv" style="--d:60ms">1日 いくら減らすか。</h2>
    <p class="lead rv" style="--d:120ms">売価・上限を超えている分だけ。${esc(who())}（${rows.length}店）。</p>
    <div class="card rv">
      <div class="k">上限まで、1日に減らす額</div>
      <div class="big ${O > 0.05 ? 'bad' : 'good'}">−<span class="cu" data-to="${O / 10}" data-dec="1">${man(O, 1)}</span><small>万円／日</small></div>
      <div class="s">売変率 <b>${rate.toFixed(1)}%</b> → <b class="good">${after.toFixed(1)}%</b>　／　店利益 月 <b class="good">+${man(EF)}万円</b></div>
      ${stack}${leg}
    </div>
    <h3 class="h3 rv">6つの指標<small>線＝上限。押すと、超えている店が出ます</small></h3>
    <div class="inds">${inds}</div>
  </div></section>`;
}

// ---------- ③ 店ごと ----------
function storeCard(r, i) {
  const lv = r.o * 1000 >= 10000 ? 'l3' : r.o * 1000 >= 3000 ? 'l2' : '';
  const top = E.NW_KEYS.slice().sort((a, b) => r.O[b] - r.O[a])[0];
  return `<button type="button" class="st ${lv} rv" style="--d:${Math.min(i, 8) * 45}ms" data-store="${esc(r.name)}">
    <div class="st-top"><div class="st-n">${esc(r.name)}<small>${esc(r.sc)}・${esc(r.p.type)}</small></div>
      <div class="badge ${r.p.diff < 0 ? 'bad' : 'good'}"><small>予算との差</small>${sgMan(r.p.diff)}万</div></div>
    <div class="st-m">売変率 <b class="${r.rate > r.bud ? 'bad' : 'good'}">${r.rate.toFixed(1)}%</b> → ${r.after.toFixed(1)}%</div>
    <div class="pl">${E.NW_KEYS.filter(k => r.S[k]).map(k => `<span class="${r.O[k] * 1000 >= 50 ? 'x' : ''}">${E.NW_LAB[k]} ${pc(k, r.R[k])}</span>`).join('')}</div>
    <div class="st-d">${r.o * 1000 >= 50 ? `<b class="bad">1日 −${yen(r.o)}</b><span>まず ${E.NW_LAB[top]}</span>` : `<b class="good">✓ 全部 上限内</b><span>今のまま</span>`}</div></button>`;
}
function storesHtml(rows) {
  const sorted = rows.slice().sort((a, b) => storeSort === 'cut' ? b.o - a.o : storeSort === 'diff' ? a.p.diff - b.p.diff : storeSort === 'good' ? b.p.diff - a.p.diff : b.rate - a.rate);
  const opts = [['cut', '減らす額が大きい順'], ['diff', '予算に遠い順（悪い順）'], ['good', '予算をこえた順（良い順）'], ['rate', '売変率が高い順']];
  return `<section class="sec alt" id="stores"><div class="wrap">
    <div class="eyebrow rv">③ 店ごと</div>
    <h2 class="h2 rv" style="--d:60ms">何を、いくら。</h2>
    <p class="lead rv" style="--d:120ms">店を押すと、原因と「やること」が出ます。LINE用のコピーもできます。</p>
    <div class="tabs rv" role="group" aria-label="ならべかた">${opts.map(([k, t]) => `<button type="button" data-sort="${k}" class="${storeSort === k ? 'on' : ''}" aria-pressed="${storeSort === k}">${t}</button>`).join('')}</div>
    <div class="stores" id="storeGrid">${sorted.map(storeCard).join('')}</div>
  </div></section>`;
}

function drawCharts(path) {
  const c1 = $('#ch1'), c2 = $('#ch2');
  if (c1) c1.innerHTML = chartMonthly(path, c1.clientWidth || 340);
  if (c2) c2.innerHTML = chartCum(path, c2.clientWidth || 340);
  // グラフの数字を 表でも読めるように（スマホ・キーボード・読み上げ用）
  const host = c2 ? c2.closest('.wrap') : null;
  if (host) {
    let t = $('#chTbl'); const wasOpen = t ? t.open : SHOT;
    if (!t) { t = document.createElement('details'); t.id = 'chTbl'; t.className = 'fold'; t.style.marginTop = '18px'; host.appendChild(t); }
    const sg = v => (v > 0 ? '+' : v < 0 ? '−' : '') + man(Math.abs(v));
    const sig = JSON.stringify(path.rows.map(x => [x.m, x.kind, x.bud, x.base, x.plan, x.need, x.cb, x.cp]));
    if (t.dataset.sig === sig) return;          // 中身が同じ（幅が変わっただけ）なら 表は作り直さない
    t.dataset.sig = sig;

function chartMonthly(path, Wd) {

function chartCum(path, Wd) {

  return s + `</svg>`;
}

  const by = ok.slice().sort((a, b) => (b.dN + b.dW) - (a.dN + a.dW));
  const item = x => { const d = x.dN + x.dW; return `<button type="button" class="row" data-store="${esc(x.r.name)}" style="grid-template-columns:minmax(0,1fr) 7.5em;grid-template-areas:'l v'"><div class="l">${esc(x.r.name)}<br><small>値引 ${sgY(x.dN)}円・廃棄 ${sgY(x.dW)}円</small></div><div class="v ${d > 0 ? 'bad' : 'good'}">${d > 0 ? '▲' : '▼'} ${sgY(d)}円</div></button>`; };

// 宣言の読み込み（GETだけ）は、この画面が自分で1本だけ行う。profit.html の bdLoad には頼らない
//   （bdLoad の fetch には時間切れが無く、止まった古い応答があとから届いて内容を書き換えることがあるため）。
//   ・いちばん新しく送った読み込みの結果だけを使う（BDS.seq）。20秒で時間切れ → 「もう一度 読み込む」。
//   ・profit.html 側の計算（bdDecl など）は BD.rows を読むので、BD.rows を「この画面が読んだ行」に固定する。
//     宣言の保存も この画面が行い、BDS.rows を自分で書き換える。profit.html 側からの代入は受けつけない。
const BDS = {rows: [], loaded: false, loading: false, err: '', seq: 0, hooked: false};
function watchBaihen() {
  if (!BDS.hooked) {
    BDS.hooked = true;
    try { E.BD.tried = true; Object.defineProperty(E.BD, 'rows', {get: () => BDS.rows, set: () => {}, configurable: true, enumerable: true}); } catch (e) {}
  }
  // 裏の profit.html も最初の表示で宣言を1回読む（GET・結果は使わない）。止めるには profit.html の変更が必要なので そのまま。
  if (!BDS.loaded && !BDS.loading) bdFetch();
}
async function bdFetch() {
  const my = ++BDS.seq, t0 = Date.now();
  BDS.loading = true; BDS.err = '';
  renderBaihen();
  const ac = 'AbortController' in window ? new AbortController() : null, to = setTimeout(() => ac && ac.abort(), 20000);
  try {
    const r = await fetch(`${E.BD_GAS}?action=getBaihenDecl&from=${E.bdAdd(E.bdYmd(new Date()), -120)}`, {redirect: 'follow', signal: ac ? ac.signal : undefined});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '読み込めません');
    if (!Array.isArray(d.rows)) throw new Error('返事の形がちがいます');
    if (my !== BDS.seq) return;                       // もっと新しい読み込みがある → この結果は使わない
    // 読み込み中に保存がおわった宣言は、古い読み込み結果で消さない
    const kept = BDS.rows.filter(x => x.savedAt && x.savedAt >= t0), key = x => x.weekStart + '|' + x.store;
    BDS.rows = d.rows.filter(x => !kept.some(k => key(k) === key(x))).concat(kept); BDS.loaded = true; BDS.err = '';
  } catch (e) {
    if (my !== BDS.seq) return;
    BDS.err = e && e.name === 'AbortError' ? '時間切れ' : /不明なアクション/.test(String(e && e.message)) ? 'サーバーの準備がまだです' : '電波のよい所で もう一度';
  } finally {
    clearTimeout(to);
    if (my === BDS.seq) { BDS.loading = false; renderBaihen(); declRefresh(); }
  }
}
function bdRetry() { bdFetch(); }

      <div class="v ${ov ? 'bad' : 'good'}" style="font-size:15px">${pc(k, r.R[k])}${ov ? `<br><small style="font-size:13px">−${yen(r.O[k])}</small>` : ''}</div>
      <div class="b"><div class="bar1" style="margin:4px 0"><i style="width:${r.R[k] / mx * 100}%;background:${ov ? 'var(--bad)' : 'var(--good)'};opacity:${ov ? 1 : .55}"></i><em style="left:${cap / mx * 100}%"></em></div></div></button>`;
  });
  openSheet(E.NW_LAB[k] + '：店ごとの今と上限', who(), h + `</div>`);
}
function openSCPicker() {
  const list = ['all', ...E.SC_LIST];
  openSheet('担当SCをえらぶ', '全部の数字が かわります', `<div class="sc-list">${list.map(s => {
    const n = s === 'all' ? E.PROFIT.length : E.PROFIT.filter(p => E.SC_MAP[p.name] === s).length;
    return `<button type="button" data-sc="${esc(s)}" class="${s === SC ? 'on' : ''}"><span>${s === 'all' ? '全体（全社）' : esc(s)}</span><span>${n}店</span></button>`; }).join('')}</div>`);
}
function copyText(t) {
  const done = () => toast('コピーしました。LINEに貼りつけてください');
  const ng = () => toast('コピーできませんでした');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => fallback());
  else fallback();
  function fallback() {   // execCommand が false を返した時・例外の時は「できませんでした」
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    ($('#sheet').classList.contains('show') ? $('#sheet') : document.body).appendChild(ta);   // 背景が inert の間は シートの中で選ぶ
    ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    ok ? done() : ng();
  }
}
let toastT = 0;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2000); }

// ===================================================================
// 5. 操作・モーション
// ===================================================================
function setSC(s) {
  if (s === SC) { closeSheet(); return; }
  SC = s;
  try { localStorage.setItem('pn_sc', s); } catch (e) {}
  const y = window.scrollY, fromSheet = sheetOpen(), inSeg = !!(document.activeElement && document.activeElement.closest && document.activeElement.closest('#seg'));
  // 今 見ているセクションを覚えて、作り直した後も 同じセクションの同じあたりを出す（店の数が変わるとページの長さが変わるため）
  let secId = '', secOff = 0;
  const ae0 = document.activeElement, own = !sheetOpen() && ae0 && ae0.closest ? ae0.closest('section[id]') : null;   // 押したボタンがあるセクションを優先
  if (own) { secId = own.id; secOff = own.getBoundingClientRect().top; }
  else document.querySelectorAll('section[id]').forEach(sc => { const t = sc.getBoundingClientRect().top; if (t <= 90) { secId = sc.id; secOff = t; } });
  closeSheet(false);
  renderAll(false);
  const ns2 = secId ? document.getElementById(secId) : null;
  if (ns2) { const off = secOff < 0 && -secOff > ns2.offsetHeight - 200 ? 60 : secOff; window.scrollTo(0, Math.max(0, ns2.getBoundingClientRect().top + window.scrollY - off)); }
  else window.scrollTo(0, y);
  // 作り直しで 元のボタンが消えるので、同じ役目のボタンへ フォーカスを戻す
  // （店利益の SC別ボタンなど、作り直しで消える所から押した時は 上の担当ボタンへ）
  const lost = !document.activeElement || document.activeElement === document.body || !document.contains(document.activeElement);
  const f = fromSheet ? $('#scBtn') : inSeg ? $(`#seg button[data-sc="${CSS.escape(s)}"]`) : lost ? $('#scBtn') : null;
  if (f) f.focus({preventScroll: true});
  lastFocus = null;
  toast(s === 'all' ? '全社の数字にしました' : s + ' の店だけにしました');
}
function bindGlobal() {
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-decl],[data-store],[data-ind],[data-sc],[data-sort],[data-ws],[data-copy]');
    if (!t) return;
    if (t.dataset.decl) { openDecl(t.dataset.decl, t.dataset.week); return; }
    if (t.dataset.copy) { const p = E.PROFIT.find(s => s.name === t.dataset.copy); copyText(E.nwStoreText(E.nwRow(p))); return; }
    if (t.dataset.sc) { setSC(t.dataset.sc); return; }
    if (t.dataset.store) { openStore(t.dataset.store); return; }
    if (t.dataset.ind) { openInd(t.dataset.ind); return; }
    if (t.dataset.sort) {
      storeSort = t.dataset.sort;
      const rows = rowsSC();
      const sec = $('#stores'); const tmp = document.createElement('div'); tmp.innerHTML = storesHtml(rows);
      const ns = tmp.firstElementChild; sec.replaceWith(ns);
      if (!ANIM) ns.querySelectorAll('.rv').forEach(x => x.classList.add('in'));
      else ns.querySelectorAll('.tabs, .tabs .rv').forEach(x => x.classList.add('in'));   // 押したボタンの列は 見えたまま
      observe(); const nb = ns.querySelector(`[data-sort="${storeSort}"]`); if (nb) nb.focus({preventScroll: true}); return;
    }
    if (t.dataset.ws) {
      wsMode = t.dataset.ws; const rows = rowsSC();
      $('#wsTable').innerHTML = wasteTable(rows, summary(rows));
      document.querySelectorAll('[data-ws]').forEach(b => { b.classList.toggle('on', b.dataset.ws === wsMode); b.setAttribute('aria-pressed', b.dataset.ws === wsMode); });
    }
  });
  $('#back').addEventListener('click', closeSheet);
  $('#sheetX').addEventListener('click', closeSheet);
  $('#scBtn').addEventListener('click', openSCPicker);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sheetOpen()) { e.preventDefault(); closeSheet(); return; }
    trapTab(e);
  });
  // シートを下へ引っぱって閉じる（スマホ）
  let sy = null;
  $('#sheet').addEventListener('touchstart', e => { sy = $('#sheetB').scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive: true});
  $('#sheet').addEventListener('touchend', e => { if (sy != null && e.changedTouches[0].clientY - sy > 90 && innerWidth < 900 && !$('#dfForm')) closeSheet(); sy = null; }, {passive: true});
  // スクロール：ナビを縮める・ヒーローのパララックス
  let ticking = false;
  const onScroll = () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const y = window.scrollY;
      $('#gnav').classList.toggle('small', y > 40);
      if (ANIM) { const hi = $('#heroIn'); if (hi && y < innerHeight * 1.2) { hi.style.transform = `translate3d(0,${(y * 0.28).toFixed(1)}px,0)`; hi.style.opacity = Math.max(0, 1 - y / (innerHeight * 0.85)).toFixed(3); } }
    });
  };
  addEventListener('scroll', onScroll, {passive: true});
  let swT = 0;
  addEventListener('scroll', () => { clearTimeout(swT); swT = setTimeout(sweep, 160); }, {passive: true});
  document.addEventListener('toggle', e => { if (e.target.tagName === 'DETAILS' && e.target.open) requestAnimationFrame(sweep); }, true);
  // 画面の幅が変わったらグラフを描き直す
  let rt = 0, lastW = innerWidth;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (Math.abs(innerWidth - lastW) < 2) return; lastW = innerWidth; drawCharts(E.nwPath()); document.querySelectorAll('#path .rv').forEach(x => x.classList.add('in')); setupSeg(); }, 180); });
  // ツールチップ
  const tip = $('#tip');
  const showTip = (el, x, y) => { tip.innerHTML = esc(el.getAttribute('data-tip')).replace(/\n/g, '<br>'); tip.classList.add('show');
    const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.min(innerWidth - w - 8, Math.max(8, x - w / 2)) + 'px'; tip.style.top = Math.max(8, y - h - 14) + 'px'; };
  document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.classList.remove('show'); }, {passive: true});
  document.addEventListener('pointerdown', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.classList.remove('show'); }, {passive: true});
  addEventListener('scroll', () => tip.classList.remove('show'), {passive: true});
}
function buildPills() {
  const el = $('#pills');
  el.innerHTML = SECTIONS.map(([id, t]) => `<a href="#${id}" data-pill="${id}">${t}</a>`).join('');
}
function setupSeg() {
  const seg = $('#seg'), ind = $('#segInd'); if (!seg || !ind) return;
  const on = seg.querySelector('button.on'); if (!on) return;
  ind.style.width = on.offsetWidth + 'px';
  ind.style.transform = `translateX(${on.offsetLeft}px)`;
  const l = on.offsetLeft - (seg.clientWidth - on.offsetWidth) / 2;
  seg.scrollLeft = Math.max(0, l);
}
function countUp(el) {
  if (el.dataset.done) return; el.dataset.done = '1';
  const to = parseFloat(el.dataset.to), dec = +el.dataset.dec || 0, sg = el.dataset.sg === '1', fin = el.textContent;
  if (!isFinite(to)) return;
  const t0 = performance.now(), dur = 1500;
  const f = v => { const s = Math.abs(v).toLocaleString('ja-JP', {minimumFractionDigits: dec, maximumFractionDigits: dec}); return (sg ? (v > 0 ? '+' : v < 0 ? '−' : '') : (v < 0 ? '−' : '')) + s; };
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(2, -10 * k);
    el.textContent = k >= 1 ? fin : f(to * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function ringIn(root) {
  root.querySelectorAll('.ringv').forEach(c => { if (c.dataset.done) return; c.dataset.done = '1'; const full = c.getAttribute('stroke-dasharray');
    c.style.transition = 'none'; c.setAttribute('stroke-dashoffset', full); c.getBoundingClientRect(); c.style.transition = ''; requestAnimationFrame(() => c.setAttribute('stroke-dashoffset', c.dataset.off)); });
}
function observe() {
  const rvs = document.querySelectorAll('.rv:not(.in)');
  if (!ANIM) { rvs.forEach(x => x.classList.add('in')); }
  else {
    if (IO) IO.disconnect();
    IO = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target; el.classList.add('in'); IO.unobserve(el);
      el.querySelectorAll('.cu').forEach(countUp);
      if (el.classList.contains('cu')) countUp(el);
      ringIn(el);
    }), {rootMargin: '0px 0px -8% 0px', threshold: 0.12});
    rvs.forEach(x => IO.observe(x));
  }
  setTimeout(sweep, 700);   // ふつうは IO が先に表示する。これは 念のため
}
// 見落とし防止：スクロールが止まった時・<details> を開いた時に、画面内か もう通りすぎた .rv を 全部 表示にする
//   （速いスクロールで IntersectionObserver が拾えなかった所が 透明のまま残らないように）
function revealEl(el) {
  if (el.classList.contains('in')) return;
  el.classList.add('in'); if (IO) IO.unobserve(el);
  el.querySelectorAll('.cu').forEach(countUp); if (el.classList.contains('cu')) countUp(el); ringIn(el);
}
function sweep() {
  // 動きを切っている時（ANIM=false）も、下の「今いるセクションのハイライト」は動かす
  if (ANIM) {
    const vh = innerHeight;
    document.querySelectorAll('.rv:not(.in)').forEach(el => {
      if (el.closest('details:not([open])')) return;
      const r = el.getBoundingClientRect();
      if (r.top < vh * 0.95) revealEl(el);   // 画面に入っている／もう上へ通りすぎた
    });
  }
  // 今いるセクションのハイライト
  if (NAVIO) NAVIO.disconnect();
  if ('IntersectionObserver' in window) {
    NAVIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) setPill(e.target.id); }), {rootMargin: `-${Math.round(innerHeight * 0.45)}px 0px -${Math.round(innerHeight * 0.5)}px 0px`});
    SECTIONS.forEach(([id]) => { const s = document.getElementById(id); if (s) NAVIO.observe(s); });
    const h = $('#hero'); if (h) NAVIO.observe(h);
  }
}
let curPill = '';
function setPill(id) {
  if (id === curPill) return; curPill = id;
  const box = $('#pills');
  box.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.pill === id));
  const a = box.querySelector(`a[data-pill="${id}"]`);
  if (a) box.scrollTo({left: a.offsetLeft - (box.clientWidth - a.offsetWidth) / 2, behavior: ANIM ? 'smooth' : 'auto'});
}

boot();
})();
</script>

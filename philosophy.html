<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企業理念・心得 | 有限会社阪口商店</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --navy:#16304F; --navy-light:#2C4A6E; --gold:#B8892B; --gold-soft:#F3E7CE;
    --paper:#F4F6F9; --card:#FFFFFF; --line:#D5DCE6; --text:#1C242F; --muted:#6B7686;
    --ok:#2E7D32; --warn:#E08A1E; --bad:#C0392B;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
    background:var(--paper); color:var(--text); line-height:1.7; -webkit-text-size-adjust:100%;
  }
  header{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#fff;padding:16px 14px 12px;text-align:center;}
  header h1{font-size:16.5px;font-weight:700;letter-spacing:.04em;}
  header p{font-size:11.5px;opacity:.8;margin-top:3px;}
  .langbar{display:flex;gap:5px;margin-top:11px;justify-content:center;flex-wrap:wrap;}
  .langbar button{
    flex:1;min-width:72px;max-width:120px;padding:7px 4px;font-size:12.5px;font-weight:700;
    border:2px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:8px;
    cursor:pointer;font-family:inherit;
  }
  .langbar button.on{background:#fff;color:var(--navy);border-color:#fff;}

  .tabs{
    display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;-webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--muted);
    border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:700;
    font-family:inherit;cursor:pointer;white-space:nowrap;
  }
  .tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  main{max-width:720px;margin:0 auto;padding:16px 14px 70px;}
  .panel{display:none;}
  .panel.show{display:block;}

  .sheet{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:20px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(20,30,50,.06);
  }
  .sheet-head{text-align:center;border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:16px;}
  .sheet-head h2{font-size:16px;font-weight:700;color:var(--navy);letter-spacing:.06em;}
  .sheet-head .sub{font-size:12px;color:var(--gold);margin-top:5px;font-weight:600;}

  .creed-main{text-align:center;padding:22px 10px;background:var(--gold-soft);border-radius:10px;}
  .creed-main .t{font-size:11.5px;color:var(--gold);font-weight:700;letter-spacing:.12em;margin-bottom:8px;}
  .creed-main .v{font-size:19px;font-weight:700;color:var(--navy);line-height:1.6;}

  .mg-item{padding:12px 0;border-bottom:1px dashed var(--line);}
  .mg-item:last-child{border-bottom:none;}
  .mg-item .t{font-size:14.5px;font-weight:700;color:var(--navy);margin-bottom:3px;}
  .mg-item .b{font-size:13px;color:#3B4655;}

  .dec-item{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line);}
  .dec-item:last-child{border-bottom:none;}
  .dec-mark{
    flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--gold);
    border:1px solid var(--gold);border-radius:4px;padding:2px 7px;margin-top:3px;white-space:nowrap;
  }
  .dec-item .b{font-size:14px;font-weight:600;}

  .art{padding:13px 0;border-bottom:1px dashed var(--line);}
  .art:last-child{border-bottom:none;}
  .art-t{display:flex;gap:9px;align-items:flex-start;}
  .art-no{
    flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;
  }
  .art-main{font-size:14px;font-weight:700;flex:1;}
  .art-note{font-size:12px;color:var(--muted);margin-top:5px;padding-left:33px;}

  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .btn{font-family:inherit;border:none;border-radius:9px;padding:11px 14px;font-size:12.5px;font-weight:700;cursor:pointer;flex:1;min-width:120px;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-line{background:#fff;color:var(--navy);border:1px solid var(--line);}
  .hint{font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.6;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .field input,.field select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
    font-size:16px;font-family:inherit;background:#fff;color:var(--text);
  }
  .id-row{display:flex;gap:8px;}
  .id-row input{flex:1;}
  .id-row button{flex:0 0 auto;padding:11px 16px;}
  .who{
    background:#EAF3EA;border:1px solid #BFD9BF;border-radius:9px;padding:10px 12px;
    font-size:13px;margin-bottom:12px;
  }
  .who b{color:var(--ok);}
  .who.err{background:#FDECEA;border-color:#F0BDB6;}
  .who.err b{color:var(--bad);}

  .chk-item{padding:14px 0;border-bottom:1px solid var(--line);}
  .chk-q{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px;}
  .chk-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding-left:33px;}
  .chk-opts button{
    font-family:inherit;border:1px solid var(--line);background:#fff;color:var(--muted);
    border-radius:8px;padding:9px 2px;font-size:10.5px;font-weight:700;cursor:pointer;line-height:1.35;
  }
  .chk-opts button.on{color:#fff;border-color:transparent;}
  .chk-opts button.on[data-v="10"]{background:var(--ok);}
  .chk-opts button.on[data-v="7"]{background:#7CB342;}
  .chk-opts button.on[data-v="3"]{background:var(--warn);}
  .chk-opts button.on[data-v="0"]{background:var(--bad);}

  .score-box{background:var(--navy);color:#fff;border-radius:12px;padding:18px 16px;text-align:center;margin-bottom:14px;}
  .score-box .n{font-size:38px;font-weight:700;line-height:1.1;}
  .score-box .n small{font-size:15px;font-weight:600;opacity:.75;}
  .score-box .lbl{font-size:11.5px;opacity:.8;margin-bottom:4px;}
  .score-bar{height:8px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:12px;overflow:hidden;}
  .score-bar span{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .4s;}
  .score-note{font-size:12px;margin-top:10px;opacity:.92;}
  .weak-list .w{background:#fff;border-left:4px solid var(--bad);border-radius:7px;padding:9px 11px;margin-bottom:7px;font-size:12.5px;}
  .weak-list .w b{color:var(--bad);font-size:11px;}
  .prev-note{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:12px;}
  .sent-note{
    background:#EAF3EA;border:1px solid #BFD9BF;border-radius:9px;padding:10px 12px;
    font-size:12px;color:#2E7D32;font-weight:700;text-align:center;margin-bottom:12px;
  }
  .sent-note.pending{background:#FFF6E5;border-color:#F0D9A8;color:#9A6B10;}

  footer{text-align:center;font-size:11px;color:var(--muted);padding:0 20px 26px;}

  .overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(15,20,30,.88);padding:18px;overflow-y:auto;}
  .overlay.show{display:block;}
  .ov-inner{max-width:520px;margin:6px auto 0;background:#fff;border-radius:10px;padding:10px;}
  .ov-img{width:100%;border-radius:5px;display:block;}
  .ov-hint{color:#fff;text-align:center;font-size:13px;padding:12px 10px 0;line-height:1.6;}
  .ov-hint b{color:#F0C46A;}
  .ov-loading{color:#fff;text-align:center;padding:70px 20px;font-size:14px;}
  .ov-close{display:block;margin:16px auto 30px;background:rgba(255,255,255,.15);color:#fff;border:none;padding:11px 26px;border-radius:20px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}

  @media print{
    body{background:#fff;line-height:1.45;}
    header,.tabs,.actions,.hint,footer,.overlay,.no-print{display:none !important;}
    main{max-width:none;padding:0;margin:0;}
    .panel{display:block !important;}
    .panel.print-skip{display:none !important;}

    /* 1種類＝A4縦1枚。理念→店長→SC→SI の順に改ページし、
       最後のSIだけ改ページしない（末尾に空白ページを出さないため） */
    .sheet{border:none;box-shadow:none;border-radius:0;padding:5mm 8mm;margin:0;}
    #panel-creed .sheet,
    #panel-tencho .sheet,
    #panel-sc .sheet{page-break-after:always;break-after:page;}
    #panel-si .sheet{page-break-after:auto;break-after:auto;}

    /* 10項目＋注釈が1枚に収まるよう、文字と余白を圧縮 */
    .sheet-head{padding-bottom:4px;margin-bottom:7px;}
    .sheet-head h2{font-size:15pt;}
    .sheet-head .sub{font-size:9pt;margin-top:2px;}

    .creed-main{padding:9mm 6mm;}
    .creed-main .t{font-size:8pt;margin-bottom:4px;}
    .creed-main .v{font-size:15pt;}
    .mg-item{padding:3mm 0;}
    .mg-item .t{font-size:11pt;margin-bottom:1px;}
    .dec-item{padding:3mm 0;}
    .dec-mark{font-size:8.5pt;padding:1px 5px;}

    .art{padding:2.6mm 0;}
    .art-no{width:18px;height:18px;font-size:9pt;margin-top:1px;}
    .art-main,.dec-item .b{font-size:10pt;}
    .art-note,.mg-item .b{font-size:8.5pt;}
    .art-note{margin-top:2px;padding-left:27px;}

    /* 1項目が途中で切れて次ページにまたぐのを防ぐ */
    .art,.dec-item,.mg-item{page-break-inside:avoid;break-inside:avoid;}
  }
  @page{size:A4 portrait;margin:9mm;}
</style>
</head>
<body>

<header>
  <h1 id="hTitle">有限会社阪口商店</h1>
  <p id="hSub">企業理念・経営理念・5宣言・心得</p>
  <div class="langbar" id="langbar">
    <button data-lang="ja" class="on" onclick="setLang('ja')">日本語</button>
    <button data-lang="en" onclick="setLang('en')">English</button>
    <button data-lang="ne" onclick="setLang('ne')">नेपाली</button>
    <button data-lang="vi" onclick="setLang('vi')">Tiếng Việt</button>
  </div>
</header>

<div class="tabs no-print" id="tabs"></div>

<main>
  <div class="actions no-print" id="viewActions">
    <button class="btn btn-navy" onclick="window.print()" id="btnPrint"></button>
    <button class="btn btn-gold" onclick="exportPng()" id="btnPng"></button>
  </div>
  <div class="hint no-print" id="viewHint"></div>

  <div class="panel show" id="panel-creed"></div>
  <div class="panel" id="panel-tencho"></div>
  <div class="panel" id="panel-sc"></div>
  <div class="panel" id="panel-si"></div>
  <div class="panel print-skip" id="panel-check"></div>
</main>

<footer class="no-print">有限会社阪口商店</footer>

<div class="overlay" id="overlay">
  <div class="ov-loading" id="ovLoading">…</div>
  <div class="ov-inner" id="ovInner" style="display:none;"><img id="ovImg" class="ov-img"></div>
  <div class="ov-hint" id="ovHint" style="display:none;"></div>
  <button class="ov-close" onclick="closeOverlay()" id="ovClose"></button>
</div>

       n:{ja:'教えるだけではなく、一人ひとりの可能性を信じ、挑戦と成長を支えます。',en:"Not just teaching — believing in each person's potential and supporting their challenges and growth.",ne:'सिकाउने मात्र होइन, प्रत्येकको सम्भावनामा विश्वास गरी चुनौती र प्रगतिमा साथ दिने।',vi:'Không chỉ dạy, mà tin vào tiềm năng của mỗi người và hỗ trợ họ thử thách, trưởng thành.'}},
      {m:{ja:'店長は、清潔で魅力ある売場をつくり、お客様に感動を届けます。',en:'The store manager builds a clean, appealing sales floor and delivers delight to customers.',ne:'स्टोर म्यानेजर सफा र आकर्षक पसल बनाई ग्राहकलाई खुसी दिन्छ।',vi:'Cửa hàng trưởng tạo quầy hàng sạch đẹp và mang lại cảm xúc tốt cho khách.'},
       n:{ja:'清潔・品揃え・接客の積み重ねが、お客様から選ばれるお店をつくります。',en:'Cleanliness, assortment, and service — layered day after day — make the store customers choose.',ne:'सफाइ, सामान व्यवस्थापन र ग्राहक सेवाको निरन्तरताले ग्राहकले रोज्ने पसल बनाउँछ।',vi:'Sự tích lũy của sạch sẽ, hàng hóa đầy đủ và phục vụ tốt tạo nên cửa hàng được chọn.'}},
      {m:{ja:'店長は、売上と利益を理解し、健全な利益をつくります。',en:'The store manager understands sales and profit, and creates healthy profit.',ne:'स्टोर म्यानेजर बिक्री र नाफा बुझ्छ, र स्वस्थ नाफा सिर्जना गर्छ।',vi:'Cửa hàng trưởng hiểu doanh thu và lợi nhuận, tạo ra lợi nhuận lành mạnh.'},
       n:{ja:'数字は日々の行動の結果です。正しい方法で売上と利益をつくります。',en:'Numbers are the result of daily actions. Build sales and profit the right way.',ne:'अंक भनेको दैनिक कामको नतिजा हो। सही तरिकाले बिक्री र नाफा बनाउने।',vi:'Con số là kết quả của hành động hằng ngày. Hãy tạo doanh thu và lợi nhuận bằng cách đúng đắn.'}},
      {m:{ja:'店長は、仲間を尊重し、誰も一人で悩ませません。',en:'The store manager respects colleagues and never lets anyone struggle alone.',ne:'स्टोर म्यानेजर सहकर्मीको सम्मान गर्छ र कसैलाई एक्लै चिन्तित हुन दिँदैन।',vi:'Cửa hàng trưởng tôn trọng đồng nghiệp và không để ai một mình lo lắng.'},
       n:{ja:'仲間を支え、声を掛け合い、相談しやすい職場をつくることも店長の責任です。',en:"Supporting each other, speaking up, and creating a workplace where it's easy to ask for help is also the manager's responsibility.",ne:'सहकर्मीलाई साथ दिने, बोलाउने र सजिलै सल्लाह गर्न सकिने कार्यस्थल बनाउनु पनि म्यानेजरको जिम्मेवारी हो।',vi:'Hỗ trợ đồng nghiệp, chủ động hỏi han và tạo nơi làm việc dễ trao đổi cũng là trách nhiệm của cửa hàng trưởng.'}},
      {m:{ja:'店長は、問題から逃げず、現場で考え、現場で解決します。',en:'The store manager does not run from problems — thinking and solving them on the floor.',ne:'स्टोर म्यानेजर समस्याबाट भाग्दैन, कार्यस्थलमै सोचेर समाधान गर्छ।',vi:'Cửa hàng trưởng không né tránh vấn đề, suy nghĩ và giải quyết ngay tại hiện trường.'},
       n:{ja:'問題を隠したり先送りしたりせず、分からないことは一人で抱えず、すぐに相談します。',en:'Never hide or postpone problems; never carry uncertainty alone — consult right away.',ne:'समस्या लुकाउने वा पछि सार्ने होइन; नबुझेको कुरा एक्लै नबोकी तुरुन्तै सल्लाह लिने।',vi:'Không giấu giếm hay trì hoãn vấn đề; không ôm một mình điều chưa rõ mà hãy trao đổi ngay.'}},
      {m:{ja:'店長は、自ら学び、自ら行動し、自ら手本になります。',en:'The store manager learns, acts, and sets the example.',ne:'स्टोर म्यानेजर आफैं सिक्छ, आफैं काम गर्छ र आफैं उदाहरण बन्छ।',vi:'Cửa hàng trưởng tự học, tự hành động và tự làm gương.'},
       n:{ja:'店長の声が、お店の空気をつくります。店長の行動が、仲間の行動を変えていきます。',en:"The manager's voice sets the store's atmosphere. The manager's actions change the team's actions.",ne:'म्यानेजरको आवाजले पसलको वातावरण बनाउँछ। म्यानेजरको व्यवहारले टोलीको व्यवहार बदल्छ।',vi:'Lời nói của cửa hàng trưởng tạo nên bầu không khí cửa hàng. Hành động của cửa hàng trưởng thay đổi hành động của cả nhóm.'}},
      {m:{ja:'店長は、地域に必要とされる店づくりを目指します。',en:'The store manager aims to build a store the community needs.',ne:'स्टोर म्यानेजर समुदायलाई आवश्यक पर्ने पसल बनाउन लक्ष्य राख्छ।',vi:'Cửa hàng trưởng hướng tới cửa hàng mà địa phương cần đến.'},
       n:{ja:'地域のお客様とのつながりを大切にし、信頼され、「この店があって良かった」と思っていただける店をつくります。',en:'Valuing ties with local customers, earning trust, and building a store that makes people say, "I\'m glad this store is here."',ne:'स्थानीय ग्राहकसँगको सम्बन्धलाई महत्त्व दिई, विश्वास कमाएर, "यो पसल भएर राम्रो भयो" भन्न सकिने पसल बनाउने।',vi:'Trân trọng mối gắn kết với khách hàng địa phương, được tin tưởng và tạo nên cửa hàng khiến mọi người nghĩ "May mà có cửa hàng này."'}},
      {m:{ja:'店長は、常に学び、常に挑戦し、会社の未来をつくります。',en:"The store manager keeps learning, keeps taking on challenges, and builds the company's future.",ne:'स्टोर म्यानेजर सधैं सिक्छ, सधैं चुनौती लिन्छ र कम्पनीको भविष्य बनाउँछ।',vi:'Cửa hàng trưởng luôn học hỏi, luôn thử thách và tạo dựng tương lai công ty.'},
       n:{ja:'昨日より今日、今日より明日へ。一歩ずつ成長し続けることが、店長自身と会社の未来につながります。',en:'Better today than yesterday, better tomorrow than today. Growing step by step leads to the future of both the manager and the company.',ne:'हिजोभन्दा आज, आजभन्दा भोलि। पाइलैपिच्छे प्रगति गर्नुले म्यानेजर र कम्पनी दुवैको भविष्य बनाउँछ।',vi:'Hôm nay hơn hôm qua, ngày mai hơn hôm nay. Tiến bộ từng bước sẽ dẫn tới tương lai của chính cửa hàng trưởng và công ty.'}}
    ]
  },
  sc: {
    title:{ja:'SCの心得',en:'The SC Code',ne:'SC को आचारसंहिता',vi:'Phương châm của SC'},
    sub:{ja:'— 店舗経営を支え、健全な利益をつくる —',en:'— Supporting store management, creating healthy profit —',ne:'— पसल सञ्चालनलाई साथ दिँदै, स्वस्थ नाफा सिर्जना गर्ने —',vi:'— Hỗ trợ vận hành cửa hàng, tạo ra lợi nhuận lành mạnh —'},
    items:[
      {m:{ja:'SCは、会社の理念を理解し、自ら実践します。',en:"The SC understands the company's philosophy and practices it personally.",ne:'SC ले कम्पनीको सिद्धान्त बुझ्छ र आफैं व्यवहारमा उतार्छ।',vi:'SC hiểu triết lý công ty và tự mình thực hành.'},
       n:{ja:'店長へ伝える前に、まず自分自身が企業理念・経営理念・5宣言を判断と行動の基準にします。',en:'Before teaching store managers, make the corporate philosophy, management principles, and 5 Declarations your own standard for judgment and action.',ne:'स्टोर म्यानेजरलाई भन्नुअघि, आफैंले कम्पनीको सिद्धान्त, व्यवस्थापन सिद्धान्त र ५ घोषणालाई निर्णय र व्यवहारको आधार बनाउने।',vi:'Trước khi truyền đạt cho cửa hàng trưởng, hãy lấy triết lý doanh nghiệp, triết lý kinh doanh và 5 tuyên ngôn làm tiêu chuẩn cho phán đoán và hành động của chính mình.'}},
      {m:{ja:'SCは、数字と現場の両方を見ます。',en:'The SC looks at both the numbers and the floor.',ne:'SC ले अंक र कार्यस्थल दुवै हेर्छ।',vi:'SC nhìn cả con số lẫn hiện trường.'},
       n:{ja:'売上・利益などの数字だけで判断せず、売場・接客・人・お客様の状況を自分の目で確認します。',en:"Don't judge by sales and profit alone — check the sales floor, service, people, and customers with your own eyes.",ne:'बिक्री र नाफाजस्ता अंकबाट मात्र निर्णय नगरी, पसल, सेवा, कर्मचारी र ग्राहकको अवस्था आफ्नै आँखाले हेर्ने।',vi:'Không chỉ phán đoán bằng doanh thu, lợi nhuận mà tự mắt kiểm tra quầy hàng, phục vụ, con người và khách hàng.'}},
      {m:{ja:'SCは、売上と利益を理解し、健全な利益をつくります。',en:'The SC understands sales and profit, and creates healthy profit.',ne:'SC ले बिक्री र नाफा बुझ्छ, र स्वस्थ नाफा सिर्जना गर्छ।',vi:'SC hiểu doanh thu và lợi nhuận, tạo ra lợi nhuận lành mạnh.'},
       n:{ja:'利益だけを追うのではなく、ルールを守り、お客様から選ばれる正しい商売によって利益を生み出します。',en:'Not chasing profit alone — generating it through rule-abiding, honest business that customers choose.',ne:'नाफा मात्र पछ्याउने होइन, नियम पालना गरी ग्राहकले रोज्ने सही व्यापारबाट नाफा निकाल्ने।',vi:'Không chỉ chạy theo lợi nhuận mà tạo ra nó bằng kinh doanh đúng đắn, tuân thủ quy định và được khách hàng lựa chọn.'}},
      {m:{ja:'SCは、店長に答えを与えるだけでなく、考える力を育てます。',en:"The SC does more than give answers — developing store managers' ability to think.",ne:'SC ले स्टोर म्यानेजरलाई जवाफ मात्र दिँदैन, सोच्ने क्षमता विकास गर्छ।',vi:'SC không chỉ đưa ra đáp án mà còn rèn khả năng tư duy cho cửa hàng trưởng.'},
       n:{ja:'何でもSCが決めるのではなく、店長自身が数字を理解し、考え、判断できるよう支援します。',en:'Rather than deciding everything, support managers so they can understand the numbers, think, and decide for themselves.',ne:'सबै कुरा SC ले निर्णय गर्ने होइन, स्टोर म्यानेजर आफैंले अंक बुझी, सोची, निर्णय गर्न सक्ने बनाउने।',vi:'Không phải SC quyết định mọi thứ, mà hỗ trợ để cửa hàng trưởng tự hiểu con số, tự suy nghĩ và tự quyết định.'}},
      {m:{ja:'SCは、問題を数字だけで判断せず、原因を現場で見つけます。',en:"The SC doesn't diagnose problems by numbers alone — finding causes on the floor.",ne:'SC ले समस्या अंकबाट मात्र नहेरी, कारण कार्यस्थलमै खोज्छ।',vi:'SC không phán đoán vấn đề chỉ bằng con số mà tìm nguyên nhân tại hiện trường.'},
       n:{ja:'売上や利益が悪いという結果だけを見るのではなく、「なぜそうなったのか」を売場と行動から考えます。',en:'Don\'t stop at the result "sales or profit is poor" — think about "why it happened" from the floor and from behavior.',ne:'"बिक्री वा नाफा खराब छ" भन्ने नतिजा मात्र नहेरी, "किन त्यसो भयो" भन्ने कुरा पसल र व्यवहारबाट सोच्ने।',vi:'Không chỉ nhìn kết quả "doanh thu, lợi nhuận kém" mà suy nghĩ "vì sao như vậy" từ quầy hàng và hành động.'}},
      {m:{ja:'SCは、問題を隠さず、先送りせず、必要な時はすぐに相談します。',en:'The SC never hides or postpones problems, and consults immediately when needed.',ne:'SC ले समस्या लुकाउँदैन, पछि सार्दैन, र आवश्यक परे तुरुन्तै सल्लाह गर्छ।',vi:'SC không giấu, không trì hoãn vấn đề và trao đổi ngay khi cần.'},
       n:{ja:'自分だけで判断できないことを抱え込むことは責任ではありません。早い報告・相談が、会社と仲間を守ります。',en:'Carrying alone what you cannot decide is not responsibility. Early reporting and consultation protect the company and your colleagues.',ne:'आफैंले निर्णय गर्न नसक्ने कुरा एक्लै बोक्नु जिम्मेवारी होइन। छिटो प्रतिवेदन र सल्लाहले कम्पनी र सहकर्मीलाई जोगाउँछ।',vi:'Ôm một mình điều mình không thể quyết định không phải là trách nhiệm. Báo cáo và trao đổi sớm sẽ bảo vệ công ty và đồng nghiệp.'}},
      {m:{ja:'SCは、一店舗だけでなく、会社全体を考えて行動します。',en:'The SC acts with the whole company in mind, not just one store.',ne:'SC ले एउटा पसल मात्र होइन, सम्पूर्ण कम्पनी सोचेर काम गर्छ।',vi:'SC hành động vì toàn công ty, không chỉ một cửa hàng.'},
       n:{ja:'担当店舗だけが良ければいいのではなく、人・商品・情報・成功事例を共有し、会社全体の成長につなげます。',en:"It's not enough for your own stores to do well — share people, products, information, and success stories to grow the whole company.",ne:'आफ्नो पसल मात्र राम्रो भए पुग्दैन; कर्मचारी, सामान, जानकारी र सफल उदाहरण बाँडेर सम्पूर्ण कम्पनीको प्रगतिमा जोड्ने।',vi:'Không phải chỉ cửa hàng phụ trách tốt là đủ; hãy chia sẻ con người, hàng hóa, thông tin và ví dụ thành công để cả công ty cùng phát triển.'}},
      {m:{ja:'SCは、店長の良き相談相手になります。',en:'The SC becomes a trusted advisor to store managers.',ne:'SC स्टोर म्यानेजरको भरपर्दो सल्लाहकार बन्छ।',vi:'SC trở thành người để cửa hàng trưởng tin tưởng trao đổi.'},
       n:{ja:'指摘するだけの存在ではなく、困った時に最初に相談してもらえる信頼関係をつくります。',en:'Not merely someone who points out faults — build the trust to be the first person they turn to in trouble.',ne:'कमजोरी देखाउने मात्र होइन, अप्ठ्यारो परेको बेला पहिलो पटक सम्झिने विश्वासको सम्बन्ध बनाउने।',vi:'Không chỉ là người chỉ ra lỗi, mà xây dựng quan hệ tin cậy để được tìm đến đầu tiên khi gặp khó khăn.'}},
      {m:{ja:'SCは、自ら学び、現場に伝え、共に成長します。',en:'The SC learns, passes it on to the floor, and grows together with it.',ne:'SC आफैं सिक्छ, कार्यस्थलमा पुर्‍याउँछ र सँगै प्रगति गर्छ।',vi:'SC tự học, truyền đạt tới hiện trường và cùng nhau phát triển.'},
       n:{ja:'知っているだけではSCの仕事ではありません。学んだことを店長が理解し、行動できるところまで伝えます。',en:"Knowing is not the SC's job. Convey what you've learned until the manager understands it and can act on it.",ne:'थाहा हुनु मात्र SC को काम होइन। सिकेको कुरा स्टोर म्यानेजरले बुझी व्यवहारमा ल्याउन सक्ने ठाउँसम्म पुर्‍याउने।',vi:'Chỉ biết thôi không phải là việc của SC. Hãy truyền đạt tới mức cửa hàng trưởng hiểu và hành động được.'}},
      {m:{ja:'SCは、店舗の未来と会社の未来をつくります。',en:'The SC builds the future of the stores and the company.',ne:'SC ले पसल र कम्पनी दुवैको भविष्य बनाउँछ।',vi:'SC tạo dựng tương lai của cửa hàng và của công ty.'},
       n:{ja:'今日の数字だけでなく、半年後、一年後を考え、店長と店舗を育て、継続して利益を生み出せる会社をつくります。',en:"Look beyond today's numbers to six months and a year ahead; develop managers and stores, and build a company that can keep generating profit.",ne:'आजको अंक मात्र होइन, छ महिना र एक वर्षपछिको सोची, स्टोर म्यानेजर र पसल हुर्काएर निरन्तर नाफा दिन सक्ने कम्पनी बनाउने।',vi:'Không chỉ con số hôm nay mà nghĩ tới nửa năm, một năm sau; đào tạo cửa hàng trưởng và cửa hàng để công ty liên tục tạo ra lợi nhuận.'}}
    ]
  },
  si: {
    title:{ja:'SIの心得',en:'The SI Code',ne:'SI को आचारसंहिता',vi:'Phương châm của SI'},
    sub:{ja:'— 人を育て、成長を支える —',en:'— Developing people, supporting growth —',ne:'— मानिस हुर्काउने, प्रगतिमा साथ दिने —',vi:'— Đào tạo con người, hỗ trợ phát triển —'},
    items:[
      {m:{ja:'SIは、会社の理念を理解し、自ら実践します。',en:"The SI understands the company's philosophy and practices it personally.",ne:'SI ले कम्पनीको सिद्धान्त बुझ्छ र आफैं व्यवहारमा उतार्छ।',vi:'SI hiểu triết lý công ty và tự mình thực hành.'},
       n:{ja:'人に教える立場だからこそ、まず自分自身が企業理念・経営理念・5宣言を理解し、日々の判断と行動で示します。',en:'Precisely because you teach others, first understand the corporate philosophy, management principles, and 5 Declarations yourself, and show them in daily judgment and action.',ne:'अरूलाई सिकाउने भएकैले, पहिले आफैंले कम्पनीको सिद्धान्त, व्यवस्थापन सिद्धान्त र ५ घोषणा बुझी, दैनिक निर्णय र व्यवहारमा देखाउने।',vi:'Chính vì ở vị trí dạy người khác, trước hết bản thân phải hiểu triết lý doanh nghiệp, triết lý kinh doanh và 5 tuyên ngôn, thể hiện qua phán đoán và hành động hằng ngày.'}},
      {m:{ja:'SIは、一人ひとりの可能性を信じます。',en:"The SI believes in each person's potential.",ne:'SI ले प्रत्येक व्यक्तिको सम्भावनामा विश्वास गर्छ।',vi:'SI tin vào tiềm năng của mỗi người.'},
       n:{ja:'今できることだけで判断せず、その人がこれから何をできるようになるのかを考え、成長を支えます。',en:"Don't judge by what they can do now — think about what they will become able to do, and support that growth.",ne:'अहिले गर्न सक्ने कुराबाट मात्र नजाँची, उसले भविष्यमा के गर्न सक्छ भनी सोचेर प्रगतिमा साथ दिने।',vi:'Không đánh giá chỉ bằng những gì họ làm được hiện tại, mà nghĩ tới điều họ sẽ làm được và hỗ trợ sự trưởng thành đó.'}},
      {m:{ja:'SIは、「教えた」ではなく「できた」までを教育と考えます。',en:'For the SI, training means not "I taught it" but "they can do it."',ne:'SI का लागि तालिम भनेको "सिकाएँ" होइन, "गर्न सक्यो" सम्म हो।',vi:'Với SI, đào tạo không phải là "đã dạy" mà là "đã làm được".'},
       n:{ja:'説明して終わりではありません。相手が理解し、自分で実践できるところまで確認することが教育です。',en:'Explaining is not the end. Training means confirming they understand and can do it themselves.',ne:'व्याख्या गरेर सकियो भन्ने होइन। उनीहरूले बुझे र आफैं गर्न सक्ने भए भन्ने पक्का गर्नु नै तालिम हो।',vi:'Giải thích xong không phải là kết thúc. Đào tạo là xác nhận người đó hiểu và tự làm được.'}},
      {m:{ja:'SIは、答えを与えるだけでなく、自ら考える力を育てます。',en:'The SI does more than give answers — developing the ability to think.',ne:'SI ले जवाफ मात्र दिँदैन, आफैं सोच्ने क्षमता विकास गर्छ।',vi:'SI không chỉ đưa đáp án mà rèn khả năng tự suy nghĩ.'},
       n:{ja:'何でも答えを教えるのではなく、「なぜそうするのか」を理解させ、自分で考え、判断し、行動できる人を育てます。',en:'Rather than handing over answers, help them understand "why we do it this way," and raise people who can think, judge, and act on their own.',ne:'सबै जवाफ दिने होइन, "किन त्यसो गर्ने" भन्ने बुझाएर आफैं सोच्न, निर्णय गर्न र काम गर्न सक्ने मानिस तयार पार्ने।',vi:'Không phải dạy sẵn đáp án, mà giúp họ hiểu "vì sao làm như vậy" để tự suy nghĩ, tự phán đoán và tự hành động.'}},
      {m:{ja:'SIは、できていないことだけでなく、できていることを見つけます。',en:'The SI notices what is being done well, not only what is lacking.',ne:'SI ले नभएको कुरा मात्र होइन, भइरहेको राम्रो कुरा पनि देख्छ।',vi:'SI không chỉ thấy điều chưa làm được mà còn nhận ra điều đã làm tốt.'},
       n:{ja:'注意や指摘だけでは人は育ちません。良い行動や成長を見つけ、認め、次の成長につなげます。',en:"People don't grow from correction alone. Find good actions and growth, acknowledge them, and connect them to the next step.",ne:'गाली वा औंल्याउने मात्रैले मानिस हुर्कँदैन। राम्रो व्यवहार र प्रगति देखेर प्रशंसा गर्दै अर्को प्रगतिमा जोड्ने।',vi:'Chỉ nhắc nhở thì con người không trưởng thành. Hãy tìm ra hành động tốt, ghi nhận và dẫn tới bước phát triển tiếp theo.'}},
      {m:{ja:'SIは、誰も一人で悩ませません。',en:'The SI never lets anyone struggle alone.',ne:'SI ले कसैलाई एक्लै चिन्तित हुन दिँदैन।',vi:'SI không để ai một mình lo lắng.'},
       n:{ja:'困っている人に気付き、声を掛け、相談できる環境をつくります。SI自身も問題を一人で抱え込まず、必要な時はすぐに相談します。',en:'Notice those in difficulty, speak to them, and create an environment where people can ask for help. The SI, too, never carries problems alone and consults right away when needed.',ne:'अप्ठ्यारोमा परेको व्यक्ति चिनेर बोलाउने र सल्लाह गर्न सकिने वातावरण बनाउने। SI आफैंले पनि समस्या एक्लै नबोकी आवश्यक परे तुरुन्तै सल्लाह लिने।',vi:'Nhận ra người đang gặp khó, chủ động hỏi han và tạo môi trường dễ trao đổi. Bản thân SI cũng không ôm vấn đề một mình mà trao đổi ngay khi cần.'}},
      {m:{ja:'SIは、人によって教え方を変えます。',en:'The SI adapts how they teach to each person.',ne:'SI ले व्यक्तिअनुसार सिकाउने तरिका फेर्छ।',vi:'SI thay đổi cách dạy tùy theo từng người.'},
       n:{ja:'年齢・経験・国籍・日本語力など、一人ひとりの違いを理解し、「伝えた」ではなく「伝わった」を大切にします。',en:'Understand differences in age, experience, nationality, and Japanese ability; value not "I told them" but "it got through."',ne:'उमेर, अनुभव, राष्ट्रियता र जापानी भाषाको क्षमताजस्ता भिन्नता बुझेर, "भनें" होइन "बुझ्यो" भन्ने कुरालाई महत्त्व दिने।',vi:'Hiểu sự khác biệt về tuổi tác, kinh nghiệm, quốc tịch, năng lực tiếng Nhật; coi trọng "đã hiểu" chứ không phải "đã nói".'}},
      {m:{ja:'SIは、店長と共に人を育てます。',en:'The SI develops people together with the store manager.',ne:'SI ले स्टोर म्यानेजरसँग मिलेर मानिस हुर्काउँछ।',vi:'SI cùng cửa hàng trưởng đào tạo con người.'},
       n:{ja:'SIがすべての教育をするのではありません。店長自身がクルーを育てられるよう支援し、人を育てる文化を店舗に根付かせます。',en:'The SI does not do all the training. Support managers so they can develop crew themselves, and root a culture of developing people in the store.',ne:'सबै तालिम SI ले गर्ने होइन। स्टोर म्यानेजर आफैंले क्रू हुर्काउन सक्ने बनाई, मानिस हुर्काउने संस्कृति पसलमा बसाल्ने।',vi:'SI không làm toàn bộ việc đào tạo. Hãy hỗ trợ để cửa hàng trưởng tự đào tạo được nhân viên, gây dựng văn hóa đào tạo con người tại cửa hàng.'}},
      {m:{ja:'SIは、自ら学び、自ら手本となります。',en:'The SI learns and sets the example.',ne:'SI आफैं सिक्छ र आफैं उदाहरण बन्छ।',vi:'SI tự học và tự làm gương.'},
       n:{ja:'挨拶・接客・売場・ルール・仲間への接し方まで、言葉だけではなく自分の行動で「会社が大切にする仕事」を示します。',en:'From greetings, service, the sales floor, and rules to how you treat colleagues — show "the work this company values" through your actions, not just words.',ne:'अभिवादन, ग्राहक सेवा, पसल, नियम र सहकर्मीप्रतिको व्यवहारसम्म — शब्दले मात्र होइन, आफ्नै व्यवहारले "कम्पनीले महत्त्व दिने काम" देखाउने।',vi:'Từ chào hỏi, phục vụ, quầy hàng, quy định đến cách đối xử với đồng nghiệp — thể hiện "công việc mà công ty coi trọng" bằng hành động chứ không chỉ lời nói.'}},
      {m:{ja:'SIは、人の成長を会社の未来につなげます。',en:"The SI connects people's growth to the company's future.",ne:'SI ले मानिसको प्रगतिलाई कम्पनीको भविष्यसँग जोड्छ।',vi:'SI kết nối sự trưởng thành của con người với tương lai công ty.'},
       n:{ja:'一人の成長が店舗を変え、店舗の成長が会社を変えます。次の店長、次のSI、次のSCを育てることもSIの大切な使命です。',en:"One person's growth changes a store; a store's growth changes the company. Raising the next manager, the next SI, and the next SC is also the SI's vital mission.",ne:'एक जनाको प्रगतिले पसल बदल्छ, पसलको प्रगतिले कम्पनी बदल्छ। अर्को स्टोर म्यानेजर, अर्को SI र अर्को SC तयार पार्नु पनि SI को महत्त्वपूर्ण जिम्मेवारी हो।',vi:'Sự trưởng thành của một người thay đổi cửa hàng, sự phát triển của cửa hàng thay đổi công ty. Đào tạo cửa hàng trưởng kế tiếp, SI kế tiếp, SC kế tiếp cũng là sứ mệnh quan trọng của SI.'}}
    ]
  }
};

    needAll:'Vui lòng trả lời tất cả các mục.', needId:'Vui lòng xác nhận mã nhân viên.',
    sending:'Đang gửi…', sent:'✓ Đã nộp ({d})', sendFail:'Không gửi được. Vui lòng bấm "Nộp" lại sau.',
    copied:'Đã sao chép. Bạn có thể dán vào LINE.',
    resetConfirm:'Sẽ xóa toàn bộ câu trả lời. Bạn chắc chứ?',
    ovLoading:'Đang tạo ảnh…', ovHint:'<b>Nhấn giữ</b> ảnh và chọn "Add to Photos" để lưu', ovClose:'Đóng',
    imgFail:'Không tạo được ảnh. Vui lòng thử lại.'
  }
};

let LANG = localStorage.getItem('philo_lang') || 'ja';
function tt(k){ return (T[LANG] && T[LANG][k]) || T.ja[k] || k; }
function L(v){ if(v==null) return ''; if(typeof v === 'string') return v; return v[LANG] || v.ja || ''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// 日本語は漢数字、他言語は算用数字
function numLabel(i){ return LANG==='ja' ? KANJI[i] : NUM[i]; }

// ===================================================================
// 描画
// ===================================================================
function renderTabs(){
  document.getElementById('tabs').innerHTML = `
    <button class="tab-btn" data-tab="creed" onclick="switchTab('creed')">${esc(tt('tabCreed'))}</button>
    <button class="tab-btn" data-tab="tencho" onclick="switchTab('tencho')">${esc(L(ROLES.tencho.title))}</button>
    <button class="tab-btn" data-tab="sc" onclick="switchTab('sc')">${esc(L(ROLES.sc.title))}</button>
    <button class="tab-btn" data-tab="si" onclick="switchTab('si')">${esc(L(ROLES.si.title))}</button>
    <button class="tab-btn" data-tab="check" onclick="switchTab('check')">${esc(tt('tabCheck'))}</button>`;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-tab')===currentTab);
  });
}

function renderCreed(){
  const mg = CREED.management.map((m,i)=>`
    <div class="mg-item">
      <div class="t">${esc(numLabel(i))}${LANG==='ja'?'、':'. '}${esc(L(m.t))}</div>
      <div class="b">${esc(L(m.b))}</div>
    </div>`).join('');
  const dec = CREED.declarations.map(d=>`
    <div class="dec-item">
      <div class="dec-mark">${esc(tt('decMark'))}</div>
      <div class="b">${esc(L(d))}</div>
    </div>`).join('');
  document.getElementById('panel-creed').innerHTML = `
    <div class="sheet">
      <div class="sheet-head"><h2>${esc(tt('hCompany'))}</h2></div>
      <div class="creed-main">
        <div class="t">${esc(tt('hCompany'))}</div>
        <div class="v">${esc(L(CREED.company))}</div>
      </div>
      <div class="sheet-head" style="margin-top:24px"><h2>${esc(tt('hManage'))}</h2></div>
      ${mg}
      <div class="sheet-head" style="margin-top:24px"><h2>${esc(tt('hDecl'))}</h2></div>
      ${dec}
    </div>`;
}

function renderRole(key){
  const r = ROLES[key];
  const items = r.items.map((it,i)=>`
    <div class="art">
      <div class="art-t">
        <div class="art-no">${esc(numLabel(i))}</div>
        <div class="art-main">${esc(L(it.m))}</div>
      </div>
      <div class="art-note">※ ${esc(L(it.n))}</div>
    </div>`).join('');
  document.getElementById('panel-'+key).innerHTML = `
    <div class="sheet">
      <div class="sheet-head">
        <h2>${esc(L(r.title))}</h2>
        ${r.sub ? `<div class="sub">${esc(L(r.sub))}</div>` : ''}
      </div>
      ${items}
    </div>`;
}

// ===================================================================
// 自己チェック
// ===================================================================
const LS_KEY = 'creedCheck_v2';
const OPTS = [{v:10,k:'opt10'},{v:7,k:'opt7'},{v:3,k:'opt3'},{v:0,k:'opt0'}];
let chkRole = 'tencho';
let answers = {};
let who = null;              // {id,name,store,type} 照合済み本人
let inputId = '';
let verifyMsg = '';
let verifyState = '';        // '', 'ok', 'ng', 'busy'
let history = [];            // [{date,role,score,sent}]
let sendState = '';          // '', 'busy', 'ok', 'fail'
let sentAt = '';

function today(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function thisMonth(){ return today().slice(0,7); }
function isDone(a){ return a && Object.keys(a).length===10; }
function calcScore(a){ return Object.values(a).reduce((s,v)=>s+v,0); }

function loadChk(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){ return null; }
}
function saveChk(){
  if(isDone(answers)){
    const d=today(), sc=calcScore(answers);
    const hit = history.find(h=>h.date===d && h.role===chkRole);
    if(hit) hit.score = sc; else history.push({date:d, role:chkRole, score:sc});
    history = history.slice(-24);
  }
  const data = {role:chkRole, answers, who, inputId, history, sentAt};
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
}
function prevRecord(){
  const d=today();
  const past = history.filter(h=>h.role===chkRole && h.date<d);
  return past.length ? past[past.length-1] : null;
}

function renderCheck(){
  const r = ROLES[chkRole];
  const prev = prevRecord();
  const done = isDone(answers);
  const score = done ? calcScore(answers) : null;

  const items = r.items.map((it,i)=>`
    <div class="chk-item">
      <div class="chk-q">
        <div class="art-no">${esc(numLabel(i))}</div>
        <div class="art-main">${esc(L(it.m))}</div>
      </div>
      <div class="chk-opts">
        ${OPTS.map(o=>`<button data-v="${o.v}" class="${answers[i]===o.v?'on':''}"
          onclick="pick(${i},${o.v})">${tt(o.k)}</button>`).join('')}
      </div>
    </div>`).join('');

  let weak='';
  if(done){
    const list = r.items.map((it,i)=>({i,v:answers[i],m:it.m})).filter(x=>x.v<=3)
      .sort((a,b)=>a.v-b.v).slice(0,3);
    if(list.length){
      weak = `<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px">${esc(tt('weakTitle'))}</div>
        <div class="weak-list">${list.map(x=>`
          <div class="w"><b>${esc(numLabel(x.i))}</b> ${esc(L(x.m))}</div>`).join('')}</div>`;
    }
  }

  let whoBox='';
  if(who){
    whoBox = `<div class="who"><b>${esc(who.name)}</b>　/　${esc(tt('whoStore'))}: ${esc(who.store||'')}</div>`;
  }else if(verifyMsg){
    whoBox = `<div class="who ${verifyState==='ng'||verifyState==='err'?'err':''}"><b>${esc(verifyMsg)}</b></div>`;
  }

  let sendBox='';
  if(sendState==='ok') sendBox = `<div class="sent-note">${esc(tt('sent').replace('{d}', sentAt))}</div>`;
  else if(sendState==='fail') sendBox = `<div class="sent-note pending">${esc(tt('sendFail'))}</div>`;

  document.getElementById('panel-check').innerHTML = `
    <div class="sheet">
      <div class="sheet-head">
        <h2>${esc(tt('checkTitle'))}</h2>
        <div class="sub">${esc(tt('checkSub'))}</div>
      </div>

      <div class="field">
        <label>${esc(tt('fRole'))}</label>
        <select onchange="changeRole(this.value)">
          <option value="tencho" ${chkRole==='tencho'?'selected':''}>${esc(L(ROLES.tencho.title))}</option>
          <option value="sc" ${chkRole==='sc'?'selected':''}>${esc(L(ROLES.sc.title))}</option>
          <option value="si" ${chkRole==='si'?'selected':''}>${esc(L(ROLES.si.title))}</option>
        </select>
      </div>

      <div class="field">
        <label>${esc(tt('fId'))}</label>
        <div class="id-row">
          <input type="tel" id="empId" value="${esc(inputId)}" placeholder="${esc(tt('fIdPh'))}"
            inputmode="numeric" oninput="inputId=this.value">
          <button class="btn btn-navy" style="flex:0 0 auto;min-width:0"
            onclick="verifyId()" ${verifyState==='busy'?'disabled':''}>${esc(tt('btnVerify'))}</button>
        </div>
      </div>
      ${whoBox}
      ${sendBox}

      ${prev ? `<div class="prev-note">${esc(tt('prevScore').replace('{d}',prev.date).replace('{s}',prev.score))}</div>` : ''}

      <div class="score-box">
        <div class="lbl">${esc(tt('scoreNow'))}</div>
        <div class="n">${done?score:'—'}<small> / 100</small></div>
        <div class="score-bar"><span style="width:${done?score:0}%"></span></div>
        <div class="score-note">${done
          ? (score>=90 ? esc(tt('good')) : score>=70 ? esc(tt('mid')) : esc(tt('low')))
          : esc(tt('unanswered').replace('{n}', 10-Object.keys(answers).length))}</div>
        ${done&&prev ? `<div class="score-note">${esc(tt('vsPrev').replace('{v}',(score-prev.score>=0?'+':'')+(score-prev.score)))}</div>` : ''}
      </div>

      ${weak}
      ${items}

      <div class="actions" style="margin-top:16px;margin-bottom:0">
        <button class="btn btn-navy" onclick="sendResult()" ${sendState==='busy'?'disabled':''}>
          ${sendState==='busy' ? esc(tt('sending')) : esc(tt('btnSend'))}</button>
        <button class="btn btn-line" onclick="copyResult()">${esc(tt('btnCopy'))}</button>
        <button class="btn btn-line" onclick="clearCheck()">${esc(tt('btnReset'))}</button>
      </div>
    </div>`;
}

function pick(i,v){ answers[i]=v; sendState=''; saveChk(); renderCheck(); }
function changeRole(v){ chkRole=v; answers={}; sendState=''; saveChk(); renderCheck(); }
function clearCheck(){
  if(!confirm(tt('resetConfirm'))) return;
  answers={}; sendState=''; saveChk(); renderCheck();
}

async function verifyId(){
  const id = (inputId||'').trim();
  if(!id) return;
  verifyState='busy'; verifyMsg=tt('verifying'); who=null; renderCheck();
  try{
    const res = await fetch(`${GAS_URL}?action=verifyCrew&id=${encodeURIComponent(id)}`, {redirect:'follow'});
    const d = await res.json();
    if(d && d.found && d.employee){
      who = d.employee; verifyState='ok'; verifyMsg='';
    }else{
      who=null; verifyState='ng'; verifyMsg=tt('verifyNg');
    }
  }catch(e){
    who=null; verifyState='err'; verifyMsg=tt('verifyErr');
  }
  saveChk(); renderCheck();
}

function buildRecord(){
  const r = ROLES[chkRole];
  const score = calcScore(answers);
  const detail = {};
  r.items.forEach((it,i)=>{ detail[i+1] = answers[i]; });
  const weak = r.items.map((it,i)=>({i,v:answers[i],m:it.m}))
    .filter(x=>x.v<=3).sort((a,b)=>a.v-b.v).slice(0,3)
    .map(x=>`${KANJI[x.i]}、${x.m.ja}`).join(' / ');
  return {
    '対象年月': thisMonth(),
    '従業員番号': who ? who.id : '',
    '役職': chkRole==='tencho' ? '店長' : chkRole.toUpperCase(),
    'スコア': score,
    '点数詳細': JSON.stringify(detail),
    '重点強化項目': weak,
    '言語': LANG,
    '提出日時': new Date().toISOString()
  };
}

async function sendResult(){
  if(!isDone(answers)){ alert(tt('needAll')); return; }
  if(!who){ alert(tt('needId')); return; }
  sendState='busy'; renderCheck();
  try{
    const res = await fetch(GAS_URL, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'recordCreedCheck', record: buildRecord()})
    });
    const d = await res.json();
    if(d && d.ok){
      sendState='ok'; sentAt=today();
      const hit = history.find(h=>h.date===today() && h.role===chkRole);
      if(hit) hit.sent = true;
    }else{
      sendState='fail';
    }
  }catch(e){
    sendState='fail';
  }
  saveChk(); renderCheck();
}

function copyResult(){
  if(!isDone(answers)){ alert(tt('needAll')); return; }
  const r = ROLES[chkRole];
  const score = calcScore(answers);
  const weak = r.items.map((it,i)=>({i,v:answers[i],m:it.m}))
    .filter(x=>x.v<=3).sort((a,b)=>a.v-b.v).slice(0,3);
  let txt = `【${L(r.title)}】\n${today()}\n`;
  if(who){ txt += `${tt('whoStore')}: ${who.store}\n${tt('whoName')}: ${who.name}\n`; }
  txt += `${tt('scoreNow')}: ${score} / 100\n`;
  if(weak.length){
    txt += `\n■ ${tt('weakTitle')}\n` + weak.map(x=>`${numLabel(x.i)} ${L(x.m)}`).join('\n');
  }
  navigator.clipboard.writeText(txt)
    .then(()=>alert(tt('copied')))
    .catch(()=>prompt(tt('btnCopy'), txt));
}

// ===================================================================
// タブ・言語・画像
// ===================================================================
let currentTab = 'creed';
function switchTab(key){
  currentTab = key;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
  document.getElementById('panel-'+key).classList.add('show');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.getAttribute('data-tab')===key));
  const show = key!=='check';
  document.getElementById('viewActions').style.display = show?'flex':'none';
  document.getElementById('viewHint').style.display = show?'block':'none';
  window.scrollTo(0,0);
}

function setLang(l){
  LANG = l;
  localStorage.setItem('philo_lang', l);
  applyLang();
}
function applyLang(){
  document.documentElement.lang = LANG;
  document.getElementById('hSub').textContent = tt('hSub');
  document.getElementById('btnPrint').textContent = tt('btnPrint');
  document.getElementById('btnPng').textContent = tt('btnPng');
  document.getElementById('viewHint').innerHTML = tt('hint');
  document.getElementById('ovLoading').textContent = tt('ovLoading');
  document.getElementById('ovHint').innerHTML = tt('ovHint');
  document.getElementById('ovClose').textContent = tt('ovClose');
  document.querySelectorAll('#langbar button').forEach(b=>
    b.classList.toggle('on', b.getAttribute('data-lang')===LANG));
  renderTabs();
  renderCreed();
  ['tencho','sc','si'].forEach(renderRole);
  renderCheck();
  switchTab(currentTab);
}

function exportPng(){
  const target = document.querySelector('#panel-'+currentTab+' .sheet');
  if(!target) return;
  const ov=document.getElementById('overlay'), loading=document.getElementById('ovLoading');
  const inner=document.getElementById('ovInner'), hint=document.getElementById('ovHint');
  const img=document.getElementById('ovImg');
  loading.textContent = tt('ovLoading');
  loading.style.display='block'; inner.style.display='none'; hint.style.display='none';
  ov.classList.add('show');
  html2canvas(target, {backgroundColor:'#FFFFFF', scale:2}).then(canvas=>{
    img.src = canvas.toDataURL('image/png');
    loading.style.display='none'; inner.style.display='block'; hint.style.display='block';
  }).catch(()=>{ loading.textContent = tt('imgFail'); });
}
function closeOverlay(){ document.getElementById('overlay').classList.remove('show'); }

// ===================================================================
// 初期化
// ===================================================================
(function init(){
  const saved = loadChk();
  if(saved){
    chkRole = ROLES[saved.role] ? saved.role : 'tencho';
    answers = saved.answers || {};
    who = saved.who || null;
    inputId = saved.inputId || '';
    history = Array.isArray(saved.history) ? saved.history : [];
    sentAt = saved.sentAt || '';
  }
  applyLang();
})();
</script>

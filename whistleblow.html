<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公益通報・コンプライアンス相談窓口 / Compliance Hotline</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--blue:#005BAC;--blue-d:#004080;--green:#00A651;--red:#E53E3E;--gray:#6B7280;--bg:#F3F4F6;--border:#E5E7EB;--warn:#B91C1C}
  body{font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:var(--bg);color:#1F2937;line-height:1.6;-webkit-text-size-adjust:100%}
  .wrap{max-width:600px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}
  header{background:var(--blue);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}
  header .t1{font-size:17px;font-weight:800;text-align:center}
  header .t2{font-size:11px;opacity:.9;margin-top:2px;text-align:center}
  .langbar{display:flex;gap:6px;margin-top:10px;justify-content:center;flex-wrap:wrap}
  .langbar button{flex:1;min-width:70px;padding:8px 4px;font-size:13px;font-weight:700;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;cursor:pointer}
  .langbar button.on{background:#fff;color:var(--blue);border-color:#fff}
  .content{padding:16px;flex:1}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .lead{background:#EBF3FB;border:1px solid #BFDBFE;border-radius:12px;padding:14px;margin-bottom:14px}
  .lead .h{font-size:17px;font-weight:800;color:var(--blue-d)}
  .lead .b{font-size:14px;margin-top:6px}
  .protect{background:#F0FDF4;border:1px solid #A7F3D0;border-radius:12px;padding:14px;margin-bottom:14px}
  .protect .h{font-size:15px;font-weight:800;color:#047857;margin-bottom:8px}
  .protect ul{list-style:none}
  .protect li{font-size:13.5px;padding-left:24px;position:relative;margin-bottom:7px}
  .protect li::before{content:"✓";position:absolute;left:4px;color:var(--green);font-weight:800}
  .label{font-weight:700;font-size:15px;margin-bottom:2px}
  .req{color:var(--red);font-size:12px;margin-left:4px}
  .hint{font-size:12px;color:var(--gray);margin:4px 0 10px}
  .warnnote{background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:9px 11px;font-size:12.5px;color:#92400E;margin:8px 0}
  input[type=text],input[type=tel],input[type=password],input[type=date],select,textarea{width:100%;padding:13px;font-size:16px;border:2px solid var(--border);border-radius:10px;font-family:inherit;background:#fff}
  textarea{min-height:150px;resize:vertical;line-height:1.6}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
  .pinin{text-align:center;letter-spacing:6px;font-size:20px}
  .fld{margin-bottom:16px}
  .btn{display:block;width:100%;padding:15px;font-size:16px;font-weight:700;border:none;border-radius:10px;cursor:pointer;text-align:center;font-family:inherit}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:disabled{background:#9CA3AF;cursor:not-allowed}
  .btn-green{background:var(--green);color:#fff}
  .btn-ghost{background:#fff;color:var(--blue);border:2px solid var(--blue)}
  .btn+.btn{margin-top:10px}
  .choice{display:block;border:2px solid var(--border);border-radius:10px;padding:13px;margin-bottom:8px;cursor:pointer;font-size:14px}
  .choice.on{border-color:var(--blue);background:#EBF3FB}
  .choice input{margin-right:8px;width:18px;height:18px;vertical-align:-3px}
  .choice .sub{display:block;font-size:12px;color:var(--gray);margin-top:3px;padding-left:26px}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cat{border:2px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;font-size:12.5px;font-weight:600;line-height:1.35}
  .cat.on{border-color:var(--blue);background:#EBF3FB;color:var(--blue-d)}
  .cat .ic{display:block;font-size:24px;margin-bottom:4px}
  .chk{display:flex;align-items:flex-start;gap:10px;padding:12px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;margin-bottom:9px}
  .chk input{width:24px;height:24px;flex-shrink:0;margin-top:1px}
  .chk label{font-size:13.5px;font-weight:600}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .photos .ph{position:relative;width:88px;height:88px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
  .photos .ph img{width:100%;height:100%;object-fit:cover}
  .photos .ph button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:13px;cursor:pointer;line-height:22px;padding:0}
  .addph{width:88px;height:88px;border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--gray);cursor:pointer;background:#fff}
  .ticketbox{background:#F0FDF4;border:2px solid var(--green);border-radius:12px;padding:18px;text-align:center;margin-bottom:14px}
  .ticketbox .k{font-size:12px;color:var(--gray);font-weight:700}
  .ticketbox .v{font-size:28px;font-weight:800;letter-spacing:2px;color:#047857;margin:4px 0 12px}
  .ext{background:#F9FAFB;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
  .ext .h{font-size:14px;font-weight:800;margin-bottom:4px}
  .ext .b{font-size:12.5px;color:var(--gray);margin-bottom:10px}
  .ext .row{border-top:1px solid var(--border);padding:9px 0;font-size:13px}
  .ext .row .n{font-weight:700}
  .ext .row .d{font-size:12px;color:var(--gray)}
  .status-pill{display:inline-block;padding:5px 14px;border-radius:999px;font-size:14px;font-weight:800;background:#EBF3FB;color:var(--blue-d)}
  .thread{margin-top:6px}
  .msg{padding:11px 13px;border-radius:12px;margin-bottom:9px;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .msg .who{font-size:11px;font-weight:700;opacity:.75;margin-bottom:3px}
  .msg.office{background:#EBF3FB;border:1px solid #BFDBFE}
  .msg.me{background:#F3F4F6;border:1px solid var(--border)}
  .err{color:var(--red);font-size:13px;margin-top:8px;font-weight:600;display:none}
  .err.show{display:block}
  .hidden{display:none!important}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;opacity:0;transition:.3s;z-index:200;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  footer{padding:16px;font-size:11px;color:var(--gray);text-align:center;border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="t1" id="hTitle">公益通報・コンプライアンス相談窓口</div>
    <div class="t2" id="hSub">阪口商店</div>
    <div class="langbar" id="langbar">
      <button data-lang="ja" class="on" onclick="setLang('ja')">日本語</button>
      <button data-lang="en" onclick="setLang('en')">English</button>
      <button data-lang="vi" onclick="setLang('vi')">Tiếng Việt</button>
      <button data-lang="ne" onclick="setLang('ne')">नेपाली</button>
    </div>
  </header>

  <div class="content">

    <!-- ========== TOP ========== -->
    <div id="scTop">
      <div class="lead">
        <div class="h" id="leadH"></div>
        <div class="b" id="leadB"></div>
      </div>
      <div class="protect">
        <div class="h" id="protectH"></div>
        <ul>
          <li id="p1"></li><li id="p2"></li><li id="p3"></li><li id="p4"></li>
        </ul>
      </div>
      <button class="btn btn-primary" id="btnNew" onclick="go('form')"></button>
      <button class="btn btn-ghost" id="btnStatus" onclick="go('status')"></button>
      <div style="height:16px"></div>
      <div class="ext">
        <div class="h" id="extH"></div>
        <div class="b" id="extB"></div>
        <div id="extList"></div>
      </div>
    </div>

    <!-- ========== FORM ========== -->
    <div id="scForm" class="hidden">
      <div class="card">
        <div class="label" id="fAnonH"></div>
        <div class="hint" id="fAnonHint"></div>
        <label class="choice on" id="chAnon">
          <input type="radio" name="anon" value="1" checked onchange="onAnonChange()"><span id="optAnon"></span>
          <span class="sub" id="optAnonSub"></span>
        </label>
        <label class="choice" id="chNamed">
          <input type="radio" name="anon" value="0" onchange="onAnonChange()"><span id="optNamed"></span>
          <span class="sub" id="optNamedSub"></span>
        </label>
        <div class="warnnote" id="anonWarn"></div>
      </div>

      <div class="card" id="namedFields">
        <div class="fld">
          <div class="label" id="lName"></div>
          <input type="text" id="iName" autocomplete="off">
        </div>
        <div class="fld">
          <div class="label" id="lEmp"></div>
          <input type="text" id="iEmp" inputmode="numeric" autocomplete="off">
        </div>
        <div class="fld" style="margin-bottom:0">
          <div class="label" id="lContact"></div>
          <div class="hint" id="hContact"></div>
          <input type="text" id="iContact" autocomplete="off">
        </div>
      </div>

      <div class="card">
        <div class="fld">
          <div class="label" id="lStore"></div>
          <div class="hint" id="hStore"></div>
          <select id="iStore"></select>
        </div>
        <div class="fld">
          <div class="label" id="lCat"></div>
          <div class="hint" id="hCat"></div>
          <div class="cats" id="catList"></div>
        </div>
        <div class="fld">
          <div class="label" id="lWhen"></div>
          <input type="text" id="iWhen" autocomplete="off">
        </div>
        <div class="fld">
          <div class="label" id="lWho"></div>
          <div class="hint" id="hWho"></div>
          <input type="text" id="iWho" autocomplete="off">
        </div>
        <div class="fld" style="margin-bottom:0">
          <div class="label"><span id="lDetail"></span><span class="req">*</span></div>
          <div class="hint" id="hDetail"></div>
          <textarea id="iDetail"></textarea>
        </div>
      </div>

      <div class="card">
        <div class="label" id="lPhoto"></div>
        <div class="hint" id="hPhoto"></div>
        <div class="photos" id="photoList">
          <div class="addph" onclick="document.getElementById('iPhoto').click()">＋</div>
        </div>
        <input type="file" id="iPhoto" accept="image/*" class="hidden" onchange="addPhoto(this)">
      </div>

      <div class="card">
        <div class="label"><span id="lPin"></span><span class="req">*</span></div>
        <div class="hint" id="hPin"></div>
        <input type="tel" id="iPin" class="pinin" maxlength="8" inputmode="numeric" autocomplete="off">
        <div style="height:10px"></div>
        <div class="label" id="lPin2"></div>
        <input type="tel" id="iPin2" class="pinin" maxlength="8" inputmode="numeric" autocomplete="off">
      </div>

      <div class="card">
        <div class="chk"><input type="checkbox" id="ck1"><label for="ck1" id="lCk1"></label></div>
        <div class="chk"><input type="checkbox" id="ck2"><label for="ck2" id="lCk2"></label></div>
      </div>

      <button class="btn btn-primary" id="btnSend" onclick="submitReport()"></button>
      <div class="err" id="formErr"></div>
      <div style="height:10px"></div>
      <button class="btn btn-ghost" id="btnBack1" onclick="go('top')"></button>
    </div>

    <!-- ========== DONE ========== -->
    <div id="scDone" class="hidden">
      <div class="lead">
        <div class="h" id="doneH"></div>
        <div class="b" id="doneB"></div>
      </div>
      <div class="ticketbox">
        <div class="k" id="kTicket"></div>
        <div class="v" id="vTicket"></div>
        <div class="k" id="kPin"></div>
        <div class="v" id="vPin"></div>
        <button class="btn btn-green" id="btnCopy" onclick="copyTicket()"></button>
      </div>
      <div class="warnnote" id="doneNote"></div>
      <button class="btn btn-ghost" id="btnBack2" onclick="location.reload()"></button>
    </div>

    <!-- ========== STATUS ========== -->
    <div id="scStatus" class="hidden">
      <div class="card" id="loginCard">
        <div class="label" id="stH"></div>
        <div class="hint" id="stHint"></div>
        <div class="fld">
          <div class="label" id="lStTicket"></div>
          <input type="text" id="iStTicket" placeholder="WB-2026-0001" autocomplete="off">
        </div>
        <div class="fld" style="margin-bottom:0">
          <div class="label" id="lStPin"></div>
          <input type="tel" id="iStPin" class="pinin" maxlength="8" inputmode="numeric" autocomplete="off">
        </div>
        <div style="height:12px"></div>
        <button class="btn btn-primary" id="btnLogin" onclick="reporterLogin()"></button>
        <div class="err" id="stErr"></div>
      </div>

      <div id="stDetail" class="hidden">
        <div class="card">
          <div class="hint" style="margin:0 0 4px" id="lStStatus"></div>
          <span class="status-pill" id="vStStatus"></span>
          <div class="hint" style="margin-top:10px" id="vStMeta"></div>
          <div class="warnnote hidden" id="vStClose"></div>
        </div>
        <div class="card">
          <div class="label" id="lThread"></div>
          <div class="thread" id="thread"></div>
          <div style="height:8px"></div>
          <textarea id="iMsg" style="min-height:90px"></textarea>
          <div style="height:8px"></div>
          <button class="btn btn-green" id="btnMsg" onclick="sendMessage()"></button>
          <div class="err" id="msgErr"></div>
        </div>
      </div>
      <div style="height:10px"></div>
      <button class="btn btn-ghost" id="btnBack3" onclick="go('top')"></button>
    </div>

  </div>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast"></div>

let LANG = localStorage.getItem('wb_lang') || 'ja';
let selectedCat = '';
let photos = [];
let session = null;   // {ticket, pin} 状況確認用（この端末のメモリ上のみ。保存しない）

function t(){ return T[LANG]; }
function $(id){ return document.getElementById(id); }

function setLang(l){ LANG = l; localStorage.setItem('wb_lang', l); applyLang(); }

function applyLang(){
  const x = t();
  document.documentElement.lang = LANG;
  document.querySelectorAll('#langbar button').forEach(b=>b.classList.toggle('on', b.getAttribute('data-lang')===LANG));
  const map = {
    hTitle:'title', hSub:'sub', leadH:'leadH', leadB:'leadB', protectH:'protectH',
    p1:'p1', p2:'p2', p3:'p3', p4:'p4', btnNew:'btnNew', btnStatus:'btnStatus',
    extH:'extH', extB:'extB',
    fAnonH:'fAnonH', fAnonHint:'fAnonHint', optAnon:'optAnon', optAnonSub:'optAnonSub',
    optNamed:'optNamed', optNamedSub:'optNamedSub', anonWarn:'anonWarn',
    lName:'lName', lEmp:'lEmp', lContact:'lContact', hContact:'hContact',
    lStore:'lStore', hStore:'hStore', lCat:'lCat', hCat:'hCat',
    lWhen:'lWhen', lWho:'lWho', hWho:'hWho', lDetail:'lDetail', hDetail:'hDetail',
    lPhoto:'lPhoto', hPhoto:'hPhoto', lPin:'lPin', hPin:'hPin', lPin2:'lPin2',
    lCk1:'ck1', lCk2:'ck2', btnSend:'btnSend', btnBack1:'back',
    doneH:'doneH', doneB:'doneB', kTicket:'kTicket', kPin:'kPin', btnCopy:'btnCopy',
    doneNote:'doneNote', btnBack2:'btnHome',
    stH:'stH', stHint:'stHint', lStTicket:'lStTicket', lStPin:'lStPin', btnLogin:'btnLogin',
    lStStatus:'lStStatus', lThread:'lThread', btnMsg:'btnMsg', btnBack3:'back', foot:'foot'
  };
  Object.keys(map).forEach(function(id){ const el=$(id); if(el) el.textContent = x[map[id]]; });
  $('iMsg').placeholder = x.msgPh;
  renderCats(); renderStores(); renderExt();
  if (session) renderThreadFromCache();
}

function renderCats(){
  const x = t();
  $('catList').innerHTML = CATEGORIES.map(function(c){
    return '<div class="cat'+(selectedCat===c.id?' on':'')+'" onclick="pickCat(\''+c.id+'\')">'
      + '<span class="ic">'+c.ic+'</span>'+x['cat_'+c.id]+'</div>';
  }).join('');
}
function pickCat(id){ selectedCat = id; renderCats(); }

function renderStores(){
  const sel = $('iStore'); const cur = sel.value;
  sel.innerHTML = '<option value="">'+t().storeNone+'</option>'
    + STORES.map(function(s){ return '<option value="'+s+'">'+s+'</option>'; }).join('');
  if (cur) sel.value = cur;
}

function renderExt(){
  $('extList').innerHTML = EXTERNAL_CONTACTS.map(function(c){
    return '<div class="row"><div class="n">'+c.n+'</div><div class="d">'+c.d+'</div></div>';
  }).join('');
}

function go(sc){
  ['scTop','scForm','scDone','scStatus'].forEach(function(id){ $(id).classList.add('hidden'); });
  $({top:'scTop',form:'scForm',done:'scDone',status:'scStatus'}[sc]).classList.remove('hidden');
  window.scrollTo(0,0);
}

function onAnonChange(){
  const anon = document.querySelector('input[name=anon]:checked').value === '1';
  $('chAnon').classList.toggle('on', anon);
  $('chNamed').classList.toggle('on', !anon);
  $('namedFields').classList.toggle('hidden', anon);
  $('anonWarn').classList.toggle('hidden', !anon);
}

function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
function showErr(id, msg){ const el=$(id); el.textContent=msg; el.classList.add('show'); }
function hideErr(id){ $(id).classList.remove('show'); }

// ---- 写真（端末側で縮小してから送る） ----
function addPhoto(input){
  const file = input.files[0];
  if (!file) return;
  if (photos.length >= 3) { input.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const max = 1280;
      let w = img.width, h = img.height;
      if (w > max || h > max){ const r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      photos.push(cv.toDataURL('image/jpeg',0.7));
      renderPhotos();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value='';
}
function renderPhotos(){
  const html = photos.map(function(p,i){
    return '<div class="ph"><img src="'+p+'"><button onclick="delPhoto('+i+')">×</button></div>';
  }).join('');
  $('photoList').innerHTML = html + (photos.length<3
    ? '<div class="addph" onclick="document.getElementById(\'iPhoto\').click()">＋</div>' : '');
}
function delPhoto(i){ photos.splice(i,1); renderPhotos(); }

// ---- 通信 ----
async function post(payload){
  if (!GAS_URL) throw new Error('NOURL');
  const res = await fetch(GAS_URL, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  return await res.json();
}

// ---- 送信 ----
async function submitReport(){
  const x = t();
  hideErr('formErr');
  const anon = document.querySelector('input[name=anon]:checked').value === '1';
  const detail = $('iDetail').value.trim();
  const pin = $('iPin').value.trim(), pin2 = $('iPin2').value.trim();

  if (!selectedCat)                 return showErr('formErr', x.errCat);
  if (detail.length < 10)           return showErr('formErr', x.errDetail);
  if (!anon && !$('iName').value.trim()) return showErr('formErr', x.errName);
  if (!/^[0-9]{4,8}$/.test(pin))    return showErr('formErr', x.errPin);
  if (pin !== pin2)                 return showErr('formErr', x.errPin2);
  if (!$('ck1').checked || !$('ck2').checked) return showErr('formErr', x.errCk);

  const btn = $('btnSend');
  btn.disabled = true; btn.textContent = x.sending;
  try{
    const r = await post({ action:'submitReport', report:{
      anonymous: anon,
      name:    anon ? '' : $('iName').value.trim(),
      empId:   anon ? '' : $('iEmp').value.trim(),
      contact: anon ? '' : $('iContact').value.trim(),
      store:   $('iStore').value,
      category: selectedCat,
      occurredAt: $('iWhen').value.trim(),
      involved:   $('iWho').value.trim(),
      detail: detail,
      pin: pin,
      photos: photos
    }});
    if (!r.ok) { btn.disabled=false; btn.textContent=x.btnSend; return showErr('formErr', r.error || x.errNet); }
    $('vTicket').textContent = r.ticket;
    $('vPin').textContent = pin;
    photos = [];
    go('done');
  }catch(err){
    showErr('formErr', String(err.message)==='NOURL' ? x.errNoUrl : x.errNet);
  }finally{
    btn.disabled = false; btn.textContent = x.btnSend;
  }
}

function copyTicket(){
  const txt = $('vTicket').textContent + ' / ' + $('vPin').textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(txt);
  toast(t().copied);
}

// ---- 状況確認 ----
let cachedReport = null, cachedMessages = [];

async function reporterLogin(){
  const x = t();
  hideErr('stErr');
  const ticket = $('iStTicket').value.trim().toUpperCase();
  const pin = $('iStPin').value.trim();
  if (!ticket || !pin) return;
  const btn = $('btnLogin'); btn.disabled = true; btn.textContent = x.sending;
  try{
    const r = await post({ action:'reporterLogin', ticket: ticket, pin: pin });
    if (!r.ok) { showErr('stErr', r.error || x.errNet); return; }
    session = { ticket: ticket, pin: pin };
    cachedReport = r.report; cachedMessages = r.messages || [];
    $('loginCard').classList.add('hidden');
    $('stDetail').classList.remove('hidden');
    renderThreadFromCache();
  }catch(err){
    showErr('stErr', String(err.message)==='NOURL' ? x.errNoUrl : x.errNet);
  }finally{
    btn.disabled = false; btn.textContent = x.btnLogin;
  }
}

function renderThreadFromCache(){
  if (!cachedReport) return;
  const x = t();
  $('vStStatus').textContent = x.st[cachedReport.status] || cachedReport.status;
  $('vStMeta').textContent = x.received + ': ' + fmtDate(cachedReport.receivedAt) + '　/　' + cachedReport.ticket;
  if (cachedReport.closeSummary){
    $('vStClose').textContent = x.closeLabel + '：' + cachedReport.closeSummary;
    $('vStClose').classList.remove('hidden');
  } else {
    $('vStClose').classList.add('hidden');
  }
  $('thread').innerHTML = cachedMessages.length
    ? cachedMessages.map(function(m){
        const who = m.from==='office' ? (x.fromOffice + (m.byName? '（'+m.byName+'）':'')) : x.fromYou;
        return '<div class="msg '+(m.from==='office'?'office':'me')+'">'
          + '<div class="who">'+who+'　'+fmtDate(m.at)+'</div>'+escapeHtml(m.body)+'</div>';
      }).join('')
    : '<div class="hint">'+x.noMsg+'</div>';
}

async function sendMessage(){
  const x = t();
  hideErr('msgErr');
  const body = $('iMsg').value.trim();
  if (!body || !session) return;
  const btn = $('btnMsg'); btn.disabled = true; btn.textContent = x.sending;
  try{
    const r = await post({ action:'reporterMessage', ticket:session.ticket, pin:session.pin, body:body });
    if (!r.ok) { showErr('msgErr', r.error || x.errNet); return; }
    cachedMessages = r.messages || [];
    $('iMsg').value = '';
    renderThreadFromCache();
    toast(x.sent);
  }catch(err){
    showErr('msgErr', x.errNet);
  }finally{
    btn.disabled = false; btn.textContent = x.btnMsg;
  }
}

function fmtDate(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = function(n){ return ('0'+n).slice(-2); };
  return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

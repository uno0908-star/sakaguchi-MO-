<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コンプライアンス理解度テスト / Compliance Test</title>
<style>
:root{
  --navy:#16304F; --blue:#005BAC; --blue2:#2E75B6; --line:#D8DDE3;
  --ink:#1F2124; --ink2:#5A5F66; --bg:#F4F6F9; --white:#fff;
  --ok:#1E6F45; --okbg:#ECF6F0; --ng:#B3332B; --ngbg:#FBEEEC; --amber:#8A5A00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
  font-size:15px;line-height:1.7;padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* 言語切替 */
.langbar{background:var(--navy);padding:8px 10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  position:sticky;top:0;z-index:20}
.langbar button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;
  border-radius:999px;padding:5px 13px;font-size:13px;font-weight:700;cursor:pointer}
.langbar button.on{background:#fff;color:var(--navy);border-color:#fff}

header{background:var(--blue);color:#fff;padding:16px 14px 18px}
header h1{margin:0;font-size:19px;font-weight:800;line-height:1.45}
header p{margin:6px 0 0;font-size:12.5px;opacity:.92}

.card{background:var(--white);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin-top:14px}
.card h2{margin:0 0 10px;font-size:16px;color:var(--navy);font-weight:800}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.hint{font-size:12.5px;color:var(--ink2);margin:6px 0 0}
input[type=text]{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:9px;
  font-size:17px;text-align:center;letter-spacing:.12em}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:10px;background:var(--blue);
  color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:12px}
.btn:disabled{background:#9BB4CC}
.btn.sub{background:var(--white);color:var(--blue);border:1.5px solid var(--blue)}
.err{background:var(--ngbg);border:1px solid #E7C2BD;color:var(--ng);border-radius:9px;
  padding:11px;font-size:13.5px;margin-top:10px;display:none}

/* 進捗 */
.prog{display:flex;align-items:center;gap:9px;margin:14px 0 0}
.prog .bar{flex:1;height:7px;background:#E3E8EE;border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}
.prog .n{font-size:12.5px;color:var(--ink2);font-weight:700;white-space:nowrap}

/* 設問 */
.q{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:12px}
.q .num{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:800;
  border-radius:6px;padding:2px 9px;margin-bottom:9px}
.q .txt{font-size:15.5px;line-height:1.65;margin-bottom:13px}
.ans{display:flex;gap:10px}
.ans button{flex:1;padding:15px 6px;border:2px solid var(--line);background:var(--white);
  border-radius:10px;font-size:17px;font-weight:800;color:var(--ink2);cursor:pointer}
.ans button .sub{display:block;font-size:11.5px;font-weight:700;margin-top:2px}
.ans button.sel[data-v="1"]{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.ans button.sel[data-v="0"]{border-color:var(--ng);background:var(--ngbg);color:var(--ng)}

/* 結果 */
.score{text-align:center;padding:20px 14px}
.score .big{font-size:52px;font-weight:800;line-height:1.1}
.score .lab{font-size:13px;color:var(--ink2);margin-top:2px}
.score .judge{display:inline-block;margin-top:12px;padding:7px 20px;border-radius:999px;
  font-size:16px;font-weight:800}
.score.pass .big{color:var(--ok)} .score.pass .judge{background:var(--okbg);color:var(--ok)}
.score.fail .big{color:var(--ng)} .score.fail .judge{background:var(--ngbg);color:var(--ng)}
.review{margin-top:6px}
.review .r{display:flex;gap:9px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;align-items:flex-start}
.review .mk{flex:none;width:22px;font-weight:800;text-align:center}
.review .mk.o{color:var(--ok)} .review .mk.x{color:var(--ng)}
.review .cor{display:block;color:var(--ng);font-size:12.5px;margin-top:3px;font-weight:700}
.note{background:#FDF6E7;border-left:4px solid var(--amber);padding:11px 13px;border-radius:0 8px 8px 0;
  font-size:13px;margin-top:14px;color:#5c4200}
.foot{text-align:center;font-size:11.5px;color:var(--ink2);margin-top:18px}
.hide{display:none!important}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.86);display:none;
  align-items:center;justify-content:center;z-index:50;font-weight:800;color:var(--navy)}
.loading.on{display:flex}
</style>
</head>
<body>

<div class="langbar">
  <button data-lang="ja" class="on" onclick="setLang('ja')">日本語</button>
  <button data-lang="en" onclick="setLang('en')">English</button>
  <button data-lang="ne" onclick="setLang('ne')">नेपाली</button>
  <button data-lang="vi" onclick="setLang('vi')">Tiếng Việt</button>
</div>

<header>
  <div class="wrap">
    <h1 id="h-title">コンプライアンス理解度テスト</h1>
    <p id="h-sub">クーポンの取り扱いルールと報告のきまり（全10問・80点以上で合格）</p>
  </div>
</header>

<div class="wrap">

  <!-- ① 本人確認 -->
  <section id="sec-id" class="card">
    <h2 id="t-id">受験者の確認</h2>
    <label id="l-emp">従業員番号（7桁）</label>
    <input type="text" id="emp" inputmode="numeric" maxlength="7" placeholder="0000000">
    <p class="hint" id="h-emp">ご自身の従業員番号を入力してください。分からない場合は店舗責任者に確認してください。</p>
    <button class="btn" id="b-start" onclick="startTest()">はじめる</button>
    <div class="err" id="e-id"></div>
  </section>

  <!-- ② テスト -->
  <section id="sec-q" class="hide">
    <div class="card" style="padding:13px 15px">
      <div style="font-size:13.5px;font-weight:800;color:var(--navy)" id="who"></div>
      <div class="prog"><div class="bar"><i id="pbar"></i></div><div class="n" id="pnum"></div></div>
    </div>
    <div id="qlist"></div>
    <button class="btn" id="b-submit" onclick="submitTest()" disabled>採点する</button>
    <div class="err" id="e-q"></div>
  </section>

  <!-- ③ 結果 -->
  <section id="sec-r" class="hide">
    <div class="card">
      <div class="score" id="score">
        <div class="big"><span id="s-score">0</span><span style="font-size:24px">点</span></div>
        <div class="lab" id="s-lab">10問中 <span id="s-ok">0</span>問 正解</div>
        <div class="judge" id="s-judge">合格</div>
      </div>
      <div class="note" id="s-note"></div>
      <div class="review" id="review"></div>
      <button class="btn sub hide" id="b-retry" onclick="retry()">もう一度受ける</button>
    </div>
    <p class="foot" id="f-note"></p>
  </section>

</div>

<div class="loading" id="loading"><span id="load-msg">送信中...</span></div>

let LANG = localStorage.getItem('ct_lang') || 'ja';
let EMP  = null;            // {id,name,store,type}
let PICK = new Array(10).fill(null);
let TRY  = 0;

const $ = id => document.getElementById(id);
const T = () => I18N[LANG];

function setLang(l){
  LANG = l; localStorage.setItem('ct_lang', l);
  document.documentElement.lang = l;
  document.querySelectorAll('.langbar button').forEach(b =>
    b.classList.toggle('on', b.dataset.lang === l));
  applyLang();
}

function applyLang(){
  const t = T();
  $('h-title').textContent = t.title;
  $('h-sub').textContent   = t.sub;
  $('t-id').textContent    = t.t_id;
  $('l-emp').textContent   = t.l_emp;
  $('h-emp').textContent   = t.h_emp;
  $('b-start').textContent = t.start;
  $('b-submit').textContent= t.submit;
  $('b-retry').textContent = t.retry;
  $('f-note').textContent  = t.foot;
  if (!$('sec-q').classList.contains('hide')) renderQ();
  if (!$('sec-r').classList.contains('hide')) renderResult(true);
}

function loading(on, msg){
  $('loading').classList.toggle('on', !!on);
  if (msg) $('load-msg').textContent = msg;
}
function showErr(id, msg){
  const e = $(id); e.textContent = msg; e.style.display = msg ? 'block' : 'none';
}

/* ── ① 本人確認 ───────────────────────────── */
async function startTest(){
  const id = $('emp').value.trim();
  showErr('e-id','');
  if (!/^\d{7}$/.test(id)) { showErr('e-id', T().err_fmt); return; }
  loading(true, T().checking);
  try{
    const res = await fetch(`${GAS_URL}?action=verifyCrew&id=${encodeURIComponent(id)}`, {redirect:'follow'});
    const j = await res.json();
    const d = j.data || j;
    if (!d.found) { loading(false); showErr('e-id', T().err_nf); return; }
    EMP = d.employee;
    loading(false);
    $('sec-id').classList.add('hide');
    $('sec-q').classList.remove('hide');
    $('who').textContent = `${EMP.name}（${EMP.store}）`;
    renderQ();
    window.scrollTo(0,0);
  }catch(e){
    loading(false); showErr('e-id', T().err_net);
  }
}

/* ── ② 設問 ───────────────────────────────── */
function renderQ(){
  const t = T();
  $('qlist').innerHTML = t.q.map((text,i) => `
    <div class="q">
      <span class="num">Q${i+1}</span>
      <div class="txt">${text}</div>
      <div class="ans">
        <button data-v="1" class="${PICK[i]===1?'sel':''}" onclick="pick(${i},1)">
          ${t.yes}<span class="sub">${t.yes_s}</span></button>
        <button data-v="0" class="${PICK[i]===0?'sel':''}" onclick="pick(${i},0)">
          ${t.no}<span class="sub">${t.no_s}</span></button>
      </div>
    </div>`).join('');
  updateProg();
}
function pick(i, v){
  PICK[i] = v;
  const box = $('qlist').children[i];
  box.querySelectorAll('.ans button').forEach(b =>
    b.classList.toggle('sel', +b.dataset.v === v));
  updateProg();
}
function updateProg(){
  const n = PICK.filter(x => x !== null).length;
  $('pbar').style.width = (n/10*100) + '%';
  $('pnum').textContent = T().pnum.replace('{a}', n).replace('{b}', 10);
  $('b-submit').disabled = n < 10;
}

/* ── ③ 採点・送信 ─────────────────────────── */
async function submitTest(){
  showErr('e-q','');
  if (PICK.some(x => x === null)) { showErr('e-q', T().err_unans); return; }
  TRY += 1;
  const okArr = PICK.map((v,i) => v === ANSWER[i]);
  const ok    = okArr.filter(Boolean).length;
  const score = ok * 10;
  const pass  = score >= PASS_LINE;

  loading(true, T().sending);
  const rec = {
    'テストID': TEST_ID,
    '従業員番号': EMP.id,
    '得点': score,
    '正答数': ok,
    '判定': pass ? '合格' : '不合格',
    '受験回数': TRY,
    '解答': PICK.join(''),
    '正誤': okArr.map(b => b ? 'O' : 'X').join(''),
    '言語': LANG,
    '受験日時': new Date().toISOString()
  };
  try{
    await fetch(GAS_URL, {method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'recordComplianceTest', record: rec})});
  }catch(e){ /* 記録に失敗しても受験者には結果を見せる */ }
  loading(false);

  window.__result = {score, ok, pass, okArr};
  $('sec-q').classList.add('hide');
  $('sec-r').classList.remove('hide');
  renderResult();
  window.scrollTo(0,0);
}

function renderResult(keepScroll){
  const t = T(), r = window.__result;
  if (!r) return;
  $('s-score').textContent = r.score;
  $('s-score').nextElementSibling.textContent = t.pt;
  $('s-lab').textContent   = t.lab.replace('{n}', r.ok);
  $('s-judge').textContent = r.pass ? t.pass : t.fail;
  $('score').className     = 'score ' + (r.pass ? 'pass' : 'fail');
  $('s-note').textContent  = r.pass ? t.note_pass : t.note_fail;
  $('b-retry').classList.toggle('hide', r.pass);
  $('review').innerHTML = t.q.map((text,i) => {
    const good = r.okArr[i];
    return `<div class="r">
      <div class="mk ${good?'o':'x'}">${good?'○':'✕'}</div>
      <div><b>Q${i+1}.</b> ${text}
        ${good ? '' : `<span class="cor">${t.correct}：${ANSWER[i]===1?t.ans_o:t.ans_x}</span>`}</div>
    </div>`;
  }).join('');
  if (!keepScroll) window.scrollTo(0,0);
}

function retry(){
  PICK = new Array(10).fill(null);
  $('sec-r').classList.add('hide');
  $('sec-q').classList.remove('hide');
  renderQ();
  window.scrollTo(0,0);
}

/* 7桁だけ入力できるように */
$('emp').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g,'').slice(0,7);
});

setLang(LANG);
</script>
</body>
</html>

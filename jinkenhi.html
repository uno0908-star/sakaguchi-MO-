<!DOCTYPE html>
<html lang="ja">
<head>

<title>人件費 予実 | 阪口商店</title>
<style>
:root{
  --blue:#005BAC;--act:#2a78d6;--over:#eb6834;--ref:#52514e;
  --green:#047857;--red:#B91C1C;--amber:#92400E;
  --bg:#F3F4F6;--card:#fff;--border:#E5E7EB;--text:#1F2937;--sub:#6B7280;--muted:#9CA3AF;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;padding-bottom:60px}
button,select,input,textarea{font-family:inherit}
.hdr{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);
  padding:8px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.hdr-ttl{font-size:16px;font-weight:800;flex:1;min-width:0}
.hdr-ttl small{display:block;font-size:11px;font-weight:600;color:var(--sub)}
.who{font-size:12px;font-weight:700;padding:6px 10px;border-radius:20px;background:#EEF4FB;color:var(--blue);white-space:nowrap}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--border);background:#fff;
  font-size:14px;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{min-height:40px;font-size:13px;padding:0 10px}
.bar{background:#fff;border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=number],input[type=password],textarea{font-size:16px;padding:10px;border:1.5px solid var(--border);
  border-radius:10px;background:#fff;color:var(--text);width:100%}
select{min-height:44px;font-weight:600}
.wrap{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
h2{font-size:15px;font-weight:800;margin-bottom:8px}
h3{font-size:13px;font-weight:800;color:var(--sub);margin:12px 0 6px}
.note{font-size:12px;color:var(--sub)}
.big{display:flex;gap:8px;text-align:center}
.big>div{flex:1;background:var(--bg);border-radius:10px;padding:10px 4px}

.chip.wait{background:#FEF3C7;color:var(--amber)}.chip.done{background:#EEF4FB;color:var(--blue)}

td.k{white-space:normal;text-align:left;line-height:1.4;overflow-wrap:anywhere}

.gai .st{font-size:12px;font-weight:800}

.alertcard{border:2px solid #F5B5B5}

.dchips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.dchips .btn{min-height:40px;font-size:13px;padding:0 10px}
.dchips .btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.why{list-style:none;padding:0;margin:8px 0 0}
.why li{padding:7px 0;border-top:1px solid var(--border);font-size:14px;line-height:1.5}
.why li:first-child{border-top:0}
.why small{display:block;color:var(--sub);font-size:12px}
.ppl td{white-space:normal}
.ppl tr.up td{background:#FFF7ED}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:0 6px;border-radius:8px;margin-left:4px;background:var(--bg);color:var(--sub)}
.tag.o{background:#FFF1EA;color:#9A3412}
.hrs{overflow-x:auto;margin-top:6px}
.hrs table{width:auto;min-width:100%}
.hrs td,.hrs th{padding:3px 0;min-width:22px;text-align:center;font-size:12px}
.hrs td.up{background:#FFE4D1;color:#9A3412;font-weight:800}
.hrs td.dn{background:#E0EDFF;color:var(--blue)}
.req{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.req .st{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:10px;margin-left:4px}
.req .st.ok{background:#E7F6EC;color:#15803D}.req .st.ng{background:#FDECEC;color:var(--over)}.req .st.wait{background:#FEF3C7;color:var(--amber)}
.req .btn.sm{align-self:flex-start}
.seg .btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.seg .btn.on.ng{background:var(--over);border-color:var(--over)}
label.f{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
textarea{min-height:70px;resize:vertical}
.savebar{display:flex;gap:8px;margin-top:12px;align-items:center}
.savebar .msg{font-size:13px;color:var(--green);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(31,41,55,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.ovbox{background:#fff;border-radius:18px;padding:22px 18px;max-width:420px;width:100%;max-height:92vh;overflow-y:auto}
.ovbox h1{font-size:19px;text-align:center;margin-bottom:4px}
.grp{font-size:12px;font-weight:800;color:var(--sub);margin:14px 0 6px}
.names{display:flex;flex-wrap:wrap;gap:8px}
.names .btn{flex:1 0 30%}
.names .btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.err{color:var(--red);font-weight:700;font-size:13px;margin-top:8px;text-align:center}
.loading{text-align:center;color:var(--sub);padding:40px 0}
details{margin-top:8px}
summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--blue);min-height:40px;display:flex;align-items:center}
.back{margin-bottom:10px}

@media(min-width:1100px){
  body{font-size:16px}
  .wrap{max-width:1680px;padding:20px}
  .slist{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .slist .st{margin:0}
  .detail{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .detail>.col>.card{margin-bottom:14px}

<body>
<div class="hdr">
  <div class="hdr-ttl">人件費 予実<small id="hdrSub">予算と実績の時間をくらべる</small></div>
  <span class="who hidden" id="who"></span>
  <button class="btn sm hidden" id="btnOut" onclick="logout()">ログアウト</button>
</div>
<div class="bar hidden" id="bar">
  <select id="selMonth" onchange="loadMonth(this.value)" style="max-width:220px"></select>
  <span class="note" id="period"></span>
</div>
<div class="wrap" id="main"><div class="loading">読み込み中…</div></div>

<div class="ov hidden" id="login">
  <div class="ovbox">
    <h1>人件費 予実</h1>
    <p class="note" style="text-align:center">名前をえらんで、パスコードを入れてください</p>
    <div id="nameGroups"><div class="loading">名前を読み込み中…</div></div>
    <label class="f" for="pass">パスコード</label>
    <input type="password" id="pass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err" id="loginErr"></div>
    <button class="btn pri" style="width:100%;margin-top:12px" onclick="doLogin()">ログイン</button>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwvfreulUH0kdpV2H4PXUZ1xEYGNX3ckePiFipI10_hSi2Jou3GCkjaV2NvKcws6334/exec';
const REASONS = ["欠員の穴埋め","新人教育","長期休み・帰国","ヘルプ受け入れ","売上・客数増","厨房投資",
  "店長・社員の時間不足","深夜・時給の高い人の偏り","手当・有給","シフトの組みすぎ","その他"];
const REQ_CATS = ["本部・外部の研修","厨房研修","接客講座・サービス向上の研修","新人トレーニング","その他"];  // GASのREQ_CATSと同じ
const WDS = "月火水木金土日";
const LS_KEY = 'jinkenhi_login';

let ME = null;          // {name, pass, role}
let PICK = '';          // ログイン画面で選んだ名前
let D = null;           // getMonthの結果
let CUR = null;         // 表示中の店 ab

// ---------- 通信 ----------
async function api(body){
  const r = await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'エラー');
  return j;
}
const authBody = (o)=>Object.assign({name:ME.name,pass:ME.pass},o);
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

// ---------- 表示用 ----------
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const h1 = v=>(Math.round(v*10)/10).toLocaleString();
const hs = v=>(v>0?'+':v<0?'▲':'')+h1(Math.abs(v));
const yen = v=>Math.round(v).toLocaleString()+'円';
const yens = v=>(v>0?'+':v<0?'▲':'')+Math.round(Math.abs(v)).toLocaleString()+'円';
function man(v){const a=Math.abs(v)/10000;return (v>0?'+':v<0?'▲':'')+(a>=10?Math.round(a):Math.round(a*10)/10)+'万円'}
const sum = a=>a.reduce((x,y)=>x+y,0);

// ---------- 計算 ----------
function reqsOf(ab){return (D.reqs||[]).filter(x=>x.ab===ab)}
function judgeOf(id){const j=D.judges.find(x=>x.id===id);return j?j.status:''}
function calc(s){
  const mhIn = sum(s.a.daily);
  const rate = s.a.rate||0;
  let okH=0, ngH=0, waitH=0;
  (s.gai||[]).forEach(g=>{const st=judgeOf(g.id); if(st==='ok')okH+=g.h; else if(st==='ng')ngH+=g.h; else waitH+=g.h;});
  const mhStore = mhIn + ngH;                 // 店の時間（予算に追加しない店外は店の時間に入れる）
  // 後付け予算の申告：神田さんが「予算に追加」した時間はバイトの予算に足す（判断待ちはまだ足さない）
  const rq=reqsOf(s.ab), reqOkH=sum(rq.filter(x=>x.status==='ok').map(x=>+x.h||0)), reqWait=rq.filter(x=>!x.status).length;
  const bMh = s.b.mh + reqOkH;
  const dBaito = mhStore - bMh;
  // 社員：契約時間との差（出退勤データ）。店全体＝バイト＋社員で見る
  const sh = s.shain||[];
  const shC = sum(sh.map(x=>x.c)), shA = sum(sh.map(x=>x.a)), dShain = shA - shC;
  const dMh = dBaito + dShain;
  const r = {mhIn, mhStore, dBaito, shC, shA, dShain, bAll: bMh+shC, aAll: mhStore+shA,
    dMh, rate, okH, ngH, waitH, reqOkH, reqWait, bMh, t1: dMh*rate, t5: -dShain*rate, perDay: dMh/D.meta.days};
  if(s.b.nendo!==undefined){
    const adj = (D.adjs.find(a=>a.ab===s.ab)||{}).yen||0;
    r.nendo = s.b.nendo; r.fixed = s.b.fixed; r.adj = Number(adj)||0;
    r.rateGap = (rate - s.b.rate)*s.b.mh;
    r.gaiOk = okH*rate;
    r.reqOk = reqOkH*rate;
    r.budget = s.b.nendo - s.b.fixed + r.rateGap + r.adj + r.gaiOk + r.reqOk;
    r.actual = s.a.pay;
    r.diff = r.actual - r.budget;
    r.t4 = waitH*rate;
    r.t6 = (s.a.ntBk&&s.a.ntBk.gen)||0;     // 時給の減額（5%・10%）。事実として見せるだけで予算は直さない
    r.t7 = -(s.b.zure||0);                  // 年度予算がMH予算＋有給4万より少ない分（朝日町など）
    r.t3 = r.diff - r.t1 - r.t4 - r.t5 - r.t6 - r.t7;
  }
  return r;
}
// ③の実績の中身（手当１＝有給・臨時・スキル、手当２＝役職・資格。手当１のマイナス＝時給の減額は時給の側）
function ntBkText(s){
  const b=s.a.ntBk; if(!b) return '給与の明細で中身を見る';
  const it=[['有給・臨時・スキル',b.rinji],['役職・資格手当',b.yaku],['交通費',b.kotsu],['その他',b.other]].filter(x=>x[1]);
  return '実績の中身：'+(it.length?it.map(x=>x[0]+' '+yen(x[1])).join('／'):'なし');
}
// 時間帯別：予算＝〇〇MHシートの枠の割合で1日の予算（バイト＋社員の契約）を分ける／実績＝勤怠の時刻（社員は出退勤の合計に合わせる）
const BANDS=()=>D.meta.bands||((D.stores[0]||{}).bands)||null;
function bandStats(s,c){
  if(!s.band||!BANDS()) return null;
  const NB=BANDS().length, W='月火水木金土日';
  const shSum=sum(s.band.shain.map(x=>sum(x))); const f=shSum?c.shA/shSum:0;
  const bud=Array(NB).fill(0), act=Array(NB).fill(0);
  const wd=W.split('').map(()=>({n:0,b:Array(NB).fill(0),a:Array(NB).fill(0)}));
  D.meta.wds.forEach((w,i)=>{
    const k=W.indexOf(w), pr=s.band.prof[k]||[], P=sum(pr);
    const day=s.b.daily[i]+c.shC/D.meta.days; wd[k].n++;
    for(let j=0;j<NB;j++){
      const b=P?pr[j]/P*day:day/NB, a=(s.band.baito[i]||[])[j]+((s.band.shain[i]||[])[j]||0)*f;
      bud[j]+=b; act[j]+=a; wd[k].b[j]+=b; wd[k].a[j]+=a;
    }
  });
  const n=D.meta.days;
  return {rows:BANDS().map((nm,j)=>({nm,b:bud[j]/n,a:act[j]/n,d:(act[j]-bud[j])/n,m:act[j]-bud[j]})),
    wd:wd.map((x,k)=>({w:W[k],n:x.n,d:x.b.map((b,j)=>x.n?(x.a[j]-b)/x.n:0)}))};
}
function wdStats(s){
  const out = WDS.split('').map(w=>({w,b:0,a:0,n:0}));
  D.meta.wds.forEach((w,i)=>{const o=out[WDS.indexOf(w)]; o.b+=s.b.daily[i]; o.a+=s.a.daily[i]; o.n++;});
  return out;
}

// ---------- ログイン ----------
async function showLogin(){
  document.getElementById('login').classList.remove('hidden');
  try{
    const r = await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'names'})}).then(x=>x.json());
    const grp = (t,arr)=>arr.length?`<div class="grp">${t}</div><div class="names">${arr.map(n=>`<button class="btn" data-n="${esc(n)}" onclick="pickName(this)">${esc(n)}</button>`).join('')}</div>`:'';
    document.getElementById('nameGroups').innerHTML = grp('店長',r.mgr.filter(n=>!r.sc.includes(n)))+grp('SC・ASC',r.sc)+grp('管理者',r.admin);
  }catch(e){
    document.getElementById('nameGroups').innerHTML = '<div class="err">名前を読み込めませんでした。通信を確認してください。</div>';
  }
}
function pickName(b){PICK=b.dataset.n;document.querySelectorAll('.names .btn').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('pass').focus()}
async function doLogin(){
  const err=document.getElementById('loginErr'); err.textContent='';
  const pass=document.getElementById('pass').value.trim();
  if(!PICK){err.textContent='名前をえらんでください';return}
  if(!pass){err.textContent='パスコードを入れてください';return}
  try{
    const r = await api({action:'login',name:PICK,pass});
    ME={name:r.name,pass,role:r.role}; lsSet(LS_KEY,ME);
    document.getElementById('login').classList.add('hidden');
    afterLogin(r.months);
  }catch(e){err.textContent=e.message}
}
function logout(){lsDel(LS_KEY);ME=null;D=null;location.reload()}
function afterLogin(months){
  const w=document.getElementById('who'); w.textContent=ME.name+'（'+({admin:'管理者',sc:'SC',mgr:'店長'})[ME.role]+'）'; w.classList.remove('hidden');
  document.getElementById('btnOut').classList.remove('hidden');
  document.getElementById('bar').classList.remove('hidden');
  if(!months.length){document.getElementById('main').innerHTML='<div class="card">まだデータがありません。</div>';return}
  const sel=document.getElementById('selMonth');
  sel.innerHTML=months.map(m=>`<option value="${m}">${m.slice(0,4)}年${+m.slice(4)}月度</option>`).join('');
  loadMonth(months[0]);
}
async function loadMonth(ym){
  const cacheKey='jinkenhi_cache_'+ME.name+'_'+ym;
  const cached=lsGet(cacheKey);
  if(cached){D=cached;route()} else document.getElementById('main').innerHTML='<div class="loading">読み込み中…</div>';
  try{
    D = await api(authBody({action:'getMonth',ym}));
    lsSet(cacheKey,D); route();
  }catch(e){ if(!cached) document.getElementById('main').innerHTML=`<div class="card err">${esc(e.message)}</div>`; }
}
function route(){
  document.getElementById('period').textContent=D.meta.period+'（'+D.meta.days+'日）';
  if(CUR && D.stores.find(s=>s.ab===CUR)) return showStore(CUR);
  if(D.stores.length===1) return showStore(D.stores[0].ab);
  showList();
}

// ---------- 一覧 ----------
function showList(){
  CUR=null; window.scrollTo(0,0);
  const rows = D.stores.map(s=>({s,c:calc(s),n:D.notes.find(x=>x.ab===s.ab)}));
  rows.sort((a,b)=>b.c.dMh-a.c.dMh);
  const money = D.stores.every(s=>s.a&&s.a.pay!==undefined);   // 店長・SC・管理者で同じ画面（2026-11-03）。金額が届いていれば全員に出す
  let top='';
  if(money){
    const T=k=>sum(rows.map(r=>r.c[k]||0));
    const over=rows.filter(r=>r.c.dMh>0).length;
    const wait=sum(rows.map(r=>(r.s.gai||[]).filter(g=>!judgeOf(g.id)).length));
    const rw=sum(rows.map(r=>r.c.reqWait));
    top=`<div class="card"><h2>${esc(D.meta.label)} ぜんたい（${rows.length}店）</h2>
      <div class="big">
        <div><div class="l">予算との差</div><div class="v ${T('diff')>0?'pl':'mi'}">${man(T('diff'))}</div></div>
        <div><div class="l">① 時間の差</div><div class="v ${T('t1')>0?'pl':'mi'}">${man(T('t1'))}</div></div>
        <div><div class="l">③ 時間以外</div><div class="v">${man(T('t3'))}</div></div>
      </div>
      <p class="note" style="margin-top:8px">時間オーバーの店：<b>${over}店</b>${wait?` ／ 店外の判断待ち：<b>${wait}件</b>`:''}${rw?` ／ 後付け予算の申告 判断待ち：<b>${rw}件</b>`:''}。
      差＝①時間の差（店長・社員＋バイト）＋③時間以外（手当・有給など）${T('t4')?'＋④店外の判断待ち':''}＋⑤社員の過不足の分（${man(T('t5'))}）${T('t6')?`＋⑥時給の減額（${man(T('t6'))}）`:''}${T('t7')?`＋⑦年度予算の不足（${man(T('t7'))}）`:''}</p></div>`;
  }
  const cards = rows.map(({s,c,n})=>{
    const wait=(s.gai||[]).filter(g=>!judgeOf(g.id)).length;
    return `<button class="st" onclick="showStore('${s.ab}')">
      <div class="st-hd"><span class="st-name">${esc(s.ab)} <small class="note">${esc(s.name)}</small></span>
        <span class="${c.dMh>0?'pl':'mi'}">${hs(c.dMh)}h</span></div>
      <div class="st-mh">予算 ${h1(c.bAll)}h → 実績 ${h1(c.aAll)}h（バイト ${hs(c.dBaito)}・社員 ${hs(c.dShain)}） ／ ① ${man(c.t1)}${money?` ／ 差 ${man(c.diff)}`:''}</div>
      <div class="st-row">
        <span class="chip ${c.dMh>0?'over':'ok'}">${c.dMh>0?'▲ 時間オーバー':'✓ 予算内'}</span>
        ${n&&n.r1?`<span class="chip done">理由：${esc(n.r1)}</span>`:`<span class="chip">理由 まだ</span>`}
        ${wait?`<span class="chip wait">店外 判断待ち ${wait}件</span>`:''}
        ${c.reqWait?`<span class="chip wait">申告 判断待ち ${c.reqWait}件</span>`:''}
        ${alertsOf(s).length?`<span class="chip alert">⚠ 要確認 ${alertsOf(s).length}件</span>`:''}
        <span class="chip">${esc(s.sc)}SC</span>
      </div></button>`;
  }).join('');
  document.getElementById('main').innerHTML = top + `<div class="slist">${cards}</div>`;
}

// ---------- 店の画面 ----------
function showStore(ab){
  CUR=ab; window.scrollTo(0,0);
  const s=D.stores.find(x=>x.ab===ab); const c=calc(s);
  const money = s.a&&s.a.pay!==undefined;   // 店長・SC・管理者で同じ画面（2026-11-03）
  const n=D.notes.find(x=>x.ab===ab)||{};
  const over=c.dMh>0;
  const back = D.stores.length>1?`<button class="btn back" onclick="showList()">← 店の一覧へ</button>`:'';

  // 結論
  const head = `<div class="card">
    <h2>${esc(s.ab)}（${esc(s.name)}）${esc(D.meta.label)}</h2>
    <div class="big">
      <div><div class="l">予算</div><div class="v">${h1(c.bAll)}<small>h</small></div></div>

      <div><div class="l">差</div><div class="v ${over?'pl':'mi'}">${hs(c.dMh)}<small>h</small></div></div>
    </div>
    <div class="verdict ${over?'over':'ok'}">${over?`予算より ${h1(c.dMh)}時間 多い`:`予算より ${h1(-c.dMh)}時間 少ない ✓`}
      <span class="s">1日あたり ${hs(c.perDay)}時間 ≒ ${yens(c.perDay*c.rate)}　／　1か月で ${man(c.t1)}</span></div>
    <table style="margin-top:8px"><tr><th></th><th>予算</th><th>実績</th><th>差</th></tr>
      <tr><td class="k">バイト・契約社員${s.b.mae2h?`<br><small>予算は出退勤の前後2分 ${h1(s.b.mae2h)}h を含む</small>`:''}</td><td>${h1(c.bMh)}${c.reqOkH?`<br><small>申告 +${h1(c.reqOkH)}</small>`:''}</td><td>${h1(c.mhStore)}</td><td class="${c.dBaito>0?'pl':'mi'}">${hs(c.dBaito)}</td></tr>
      <tr><td class="k">社員（契約時間）</td><td>${h1(c.shC)}</td><td>${h1(c.shA)}</td><td class="${c.dShain>0?'pl':'mi'}">${hs(c.dShain)}</td></tr></table>
    <p class="note" style="margin-top:6px">店全体（社員＋バイト）で見ています。社員が契約より少ない分をバイトで埋めても、合計が予算内ならOKです。バイトはSC巡回・MT・研修などの店外を入れていません。</p>
  </div>`;

  // どこを調べる？（自動で出す）
  const chkHtml = checkCard(s,c,money);

  // 曜日別
  const ws=wdStats(s); const mx=Math.max(1,...ws.map(w=>Math.abs((w.a-w.b)/(w.n||1))));
  const wdHtml = `<div class="card"><h2>曜日ごとの差（バイト・1日あたり）</h2>
    <p class="note">右（オレンジ）＝予算より多い、左（青）＝少ない</p>
    <div class="wdbars" style="margin-top:8px">${ws.map(w=>{
      const d=w.n?(w.a-w.b)/w.n:0; const pct=Math.abs(d)/mx*50;
      const st=d>=0?`left:50%;width:${pct}%;background:var(--over)`:`right:50%;width:${pct}%;background:var(--act)`;
      return `<b>${w.w}</b><div class="bk" title="${w.w}曜 予算${h1(w.b/(w.n||1))}h 実績${h1(w.a/(w.n||1))}h"><div class="b" style="${st}"></div><div class="mid"></div></div>
        <span class="val ${d>0?'pl':'mi'}">${hs(d)}h</span>`;}).join('')}</div>
    <details><summary>表で見る</summary><table style="margin-top:6px"><tr><th>曜日</th><th>日数</th><th>予算(1日)</th><th>実績(1日)</th><th>差(1日)</th><th>差(月)</th></tr>
    ${ws.map(w=>`<tr><td>${w.w}</td><td>${w.n}</td><td>${h1(w.b/(w.n||1))}</td><td>${h1(w.a/(w.n||1))}</td><td>${hs((w.a-w.b)/(w.n||1))}</td><td>${hs(w.a-w.b)}</td></tr>`).join('')}
    </table></details></div>`;

  // 時間帯別
  const bs=bandStats(s,c); let bandHtml='';
  if(bs){
    const bmx=Math.max(1,...bs.rows.map(r=>Math.abs(r.d)));
    bandHtml=`<div class="card"><h2>時間帯ごとの差（店長・社員＋バイト・1日あたり）</h2>
    <p class="note">右（オレンジ）＝予算より多い、左（青）＝少ない</p>
    <div class="wdbars band" style="margin-top:8px">${bs.rows.map(r=>{const pct=Math.abs(r.d)/bmx*50;
      const st=r.d>=0?`left:50%;width:${pct}%;background:var(--over)`:`right:50%;width:${pct}%;background:var(--act)`;
      return `<b>${esc(r.nm)}</b><div class="bk" title="予算${h1(r.b)}h 実績${h1(r.a)}h"><div class="b" style="${st}"></div><div class="mid"></div></div><span class="val ${r.d>0?'pl':'mi'}">${hs(r.d)}h</span>`}).join('')}</div>
    <details><summary>表で見る（時間帯×曜日）</summary>
      <table style="margin-top:6px"><tr><th>時間帯</th><th>予算(1日)</th><th>実績(1日)</th><th>差(1日)</th><th>差(月)</th></tr>
      ${bs.rows.map(r=>`<tr><td class="k">${esc(r.nm)}</td><td>${h1(r.b)}</td><td>${h1(r.a)}</td><td class="${r.d>0?'pl':''}">${hs(r.d)}</td><td>${hs(r.m)}</td></tr>`).join('')}</table>
      <p class="note" style="margin-top:8px">曜日ごと（1日あたりの差・時間）</p>
      <table class="bt" style="margin-top:4px"><tr><th>曜</th>${BANDS().map(b=>`<th>${esc(b.split('（')[0])}</th>`).join('')}</tr>
      ${bs.wd.map(w=>`<tr><td>${w.w}</td>${w.d.map(v=>`<td class="${v>=1?'pl':v<=-1?'mi':''}">${hs(v)}</td>`).join('')}</tr>`).join('')}</table>
    </details>
    <p class="note" style="margin-top:6px">予算は人件費計算シートの「${esc(s.ab.slice(0,2))}MH」の色塗り（1マス＝1人1時間・赤は除く）の割合で1日の予算を分けたものです。実績も休憩を含めていた時間の割合で分けています。</p></div>`;
  }

  // 日別
  const dayHtml = `<div class="card"><h2>日ごとの時間（バイト）</h2>
    <div class="legend"><span><i style="background:var(--act)"></i>実績（予算内）</span><span><i style="background:var(--over)"></i>実績（予算より多い）</span><span><i class="ln"></i>予算</span></div>
    <div class="chart" id="dayChart">${daySvg(s)}<div class="tip" id="tip"></div></div>
    <details><summary>表で見る</summary><table style="margin-top:6px"><tr><th>日</th><th>曜</th><th>予算</th><th>実績</th><th>差</th></tr>
    ${D.meta.dates.map((d,i)=>`<tr><td>${d}</td><td>${D.meta.wds[i]}</td><td>${h1(s.b.daily[i])}</td><td>${h1(s.a.daily[i])}</td><td class="${s.a.daily[i]>s.b.daily[i]?'pl':''}">${hs(s.a.daily[i]-s.b.daily[i])}</td></tr>`).join('')}
    </table></details></div>`;

  // お金（SC・管理者）
  let moneyHtml='';
  if(money){
    const parts=[
      {lb:'① 時間が多い・少ない（店長・社員＋バイト）',sm:'シフトの組み方で変えられる',v:c.t1,who:'m'},
      c.dShain?{lb:c.dShain<0?'⑤ 社員が契約より少なかった分を戻す':'⑤ 社員が契約より多く働いた分を戻す',sm:'社員は月給なので、この時間ぶんのお金は動かない',v:c.t5,who:''}:null,
      {lb:'③ 時間以外（有給・手当・交通費など）',sm:ntBkText(s)+(s.b.yuq?`／予算：有給 ${yen(s.b.yuq)}`:''),v:c.t3,who:'s'},
      c.t4?{lb:'④ 店外の判断待ち',sm:'神田さんが「予算に追加」かを決める',v:c.t4,who:''}:null,
      c.t7?{lb:'⑦ 年度予算がシフト表の枠より少ない分',sm:'年度予算（パート給与）が「シフト表（MH）×時給＋有給4万」より少ない分',v:c.t7,who:''}:null,
      c.t6?{lb:'⑥ 時給の減額（5%・10%）',sm:(s.a.genList||[]).map(x=>esc(x.n)+' '+yens(x.yen)).join('／'),v:c.t6,who:''}:null,
    ].filter(Boolean);
    const mx=Math.max(1,...parts.map(x=>Math.abs(x.v)));
    moneyHtml=`<div class="card money"><h2>お金で見る（バイト・契約社員の給与）</h2>
    <div class="mline"><span>使ってよいお金（予算）</span><b>${yen(c.budget)}</b></div>
    <div class="mline"><span>実際に使ったお金</span><b>${yen(c.actual)}</b></div>
    <div class="verdict ${c.diff>0?'over':'ok'}" style="margin-top:4px">${c.diff>0?`予算より ${man(c.diff).replace('+','')} 多い`:`予算より ${man(-c.diff).replace('+','')} 少ない ✓`}</div>
    <h3 style="margin-top:12px;font-size:14px">なぜ差が出た？（内訳）</h3>
    <p class="note">＋は予算より多く使った、▲は少なかった。足すと上の差になります。</p>
    ${parts.map(x=>{const w=Math.abs(x.v)/mx*50;const st=x.v>=0?`left:50%;width:${w}%;background:var(--over)`:`right:50%;width:${w}%;background:var(--act)`;
      return `<div class="mbar"><div class="lb">${x.who==='m'?'<span class="who-tag m">店長</span>':x.who==='s'?'<span class="who-tag s">SC</span>':''}${x.lb}<small>${x.sm}</small></div>

    <details><summary>予算の作り方を見る</summary>
    <table style="margin-top:6px">
      <tr><td class="k">年度予算（パート給与）</td><td>${yen(c.nendo)}</td></tr>
      <tr><td class="k">− 固定手当<br><small>予算・実績の両方から外す</small></td><td>${yens(-c.fixed)}</td></tr>
      ${s.b.yuq!==undefined?`<tr><td class="k" colspan="2"><small>年度予算の中身：バイトMH×予算時給＋MT費 ${yen(c.nendo-c.fixed-s.b.yuq-s.b.mae2h*s.b.rate-(s.b.zure||0))}（MH ${h1(s.b.mh-s.b.mae2h)}h）／有給 ${yen(s.b.yuq)}／出退勤の前後2分 ${yen(s.b.mae2h*s.b.rate)}（${h1(s.b.mae2h)}h・時間の予算に入れています）${s.b.zure?`／不足 ${yens(s.b.zure)}`:''}</small></td></tr>`:''}
      <tr><td class="k">＋ 時給のズレ<br><small>平均時給 予算 ${h1(s.b.rate)}円 → 実績 ${h1(c.rate)}円。時給が上がった分は店のせいにしない</small></td><td>${yens(c.rateGap)}</td></tr>
      ${c.adj?`<tr><td class="k">＋ 会社が入れた予算<br><small>${esc((D.adjs.find(a=>a.ab===s.ab)||{}).memo||'')}</small></td><td>${yens(c.adj)}</td></tr>`:''}
      ${c.reqOk?`<tr><td class="k">＋ 後付け予算の申告（予算に追加）<br><small>${h1(c.reqOkH)}h × 実績時給</small></td><td>${yens(c.reqOk)}</td></tr>`:''}
      ${c.gaiOk?`<tr><td class="k">＋ 店外（予算に追加）</td><td>${yens(c.gaiOk)}</td></tr>`:''}

    </table></details>
    </div>`;
  }

  // 社員（契約時間との差）
  const sh=s.shain||[];
  const shainHtml = sh.length?`<div class="card"><h2>社員の時間（契約との差）</h2>
    <table><tr><th>名前</th><th>契約</th><th>この店で<br>働いた</th><th>差</th></tr>
    ${sh.map(x=>`<tr><td class="k">${esc(x.n)}${x.g?`<br><small>応援（予算は${esc(x.g)}）</small>`:''}${x.sc&&!x.g?'<br><small>SC・店のシフト分</small>':''}${x.f?'<br><small>契約＝正社員詳細の枠</small>':''}${x.y?`<br><small>有給 ${h1(x.y)}h（店には入っていない）</small>`:''}${x.o>0?`<br><small>ほかの店で ${h1(x.o)}h</small>`:''}</td><td>${x.g?'−':h1(x.c)}</td><td>${h1(x.a)}</td><td class="${x.a-x.c>0?'pl':'mi'}">${hs(x.a-x.c)}</td></tr>`).join('')}
    <tr class="tot"><td>合計</td><td>${h1(c.shC)}</td><td>${h1(c.shA)}</td><td>${hs(c.dShain)}</td></tr></table>
    <p class="note" style="margin-top:6px">契約（休憩を除いた時間）は予算をつけている店に、働いた時間は実際に入った店に付けています。ほかの店の応援に行った分・契約より少ない分はマイナス、応援に来てもらった分はプラスになり、そのぶんバイトの時間と相殺されます。有給（出退勤データの緑の行）は店に入っていないので「働いた」に入れていません。</p></div>`
    :`<div class="card"><h2>社員の時間</h2><p class="note">この店の社員の出退勤データはありません。</p></div>`;

  // 店外（クルー・契約社員）
  let gaiHtml='';
  if((s.gai||[]).length){
    const isAdmin=ME.role==='admin';
    gaiHtml=`<div class="card"><h2>店外の時間（クルー・契約社員）</h2>
      <p class="note">MT・研修などで店の外で働いた時間です。${isAdmin?'予算に追加するかどうかを決めてください。「追加しない」は店の時間に入ります。':'予算に追加するかは神田さんが決めます。'}</p>
      ${s.gai.map(g=>{const st=judgeOf(g.id);
        return `<div class="gai"><div class="t"><b>${esc(g.d)}（${esc(g.wd)}）${esc(g.name)}</b><br>${esc(g.start)}〜${esc(g.end)}　${h1(g.h)}h${money?`（約${yen(g.h*c.rate)}）`:''}</div>
        ${isAdmin?`<div class="seg"><button class="btn sm ${st==='ok'?'on':''}" onclick="doJudge('${g.id}','${s.ab}','ok')">予算に追加</button>
          <button class="btn sm ${st==='ng'?'on ng':''}" onclick="doJudge('${g.id}','${s.ab}','ng')">追加しない</button></div>`
          :`<span class="st">${st==='ok'?'予算に追加':st==='ng'?'追加しない（店の時間）':'判断待ち'}</span>`}</div>`}).join('')}
      <p class="note" style="margin-top:6px">※店外の日の合計時間から、どのシフトかを当てはめています。</p></div>`;
  }

  // 後付け予算の追加（管理者）
  let adjHtml='';
  if(ME.role==='admin'){
    const a=D.adjs.find(x=>x.ab===ab)||{};
    adjHtml=`<div class="card"><h2>会社が入れる予算（神田さん）</h2>
      <p class="note">異動で時給の人が増えた分など、会社として最初から分かっている金額を予算に足します。店長・SCにも理由が見えます。</p>
      <label class="f">金額（円）</label><input type="number" id="adjYen" value="${a.yen||''}" placeholder="例 306747">
      <label class="f">理由</label><input type="text" id="adjMemo" value="${esc(a.memo||'')}" placeholder="例 ボガティ時給化（ネパリ正社員の代わり）">
      <div class="savebar"><button class="btn pri" onclick="saveAdj('${ab}')">保存</button><span class="msg" id="adjMsg"></span></div></div>`;
  }

  // 理由・来月やること
  const past = (D.past||[]).filter(p=>p.ab===ab).slice(0,3);
  const canMgr = ME.role==='admin'||ME.role==='mgr'||(ME.role==='sc'&&s.mgr.split('・').includes(ME.name));
  const opt = v=>`<option value="">えらぶ</option>`+REASONS.map(r=>`<option ${r===v?'selected':''}>${r}</option>`).join('');

    ${past.length?`<p class="note">前の月の理由：${past.map(p=>`${+p.ym.slice(4)}月「${esc(p.r1||'—')}」`).join('　')}</p>`:''}
    <label class="f">理由1</label><select id="r1" ${canMgr?'':'disabled'}>${opt(n.r1)}</select>
    <label class="f">理由2</label><select id="r2" ${canMgr?'':'disabled'}>${opt(n.r2)}</select>
    <label class="f">何があった？（ひと言）</label><textarea id="memo" ${canMgr?'':'disabled'} placeholder="例 10/1〜新人2人の教育で夕方を2人体制にした">${esc(n.memo||'')}</textarea>
    <label class="f">来月やること</label><textarea id="next" ${canMgr?'':'disabled'} placeholder="例 土日の夕方を1日2時間へらす">${esc(n.next||'')}</textarea>
    ${ME.role!=='mgr'?`<label class="f">SCのコメント</label><textarea id="scMemo" placeholder="店長へのアドバイス">${esc(n.scMemo||'')}</textarea>`:(n.scMemo?`<h3>SCのコメント</h3><p>${esc(n.scMemo)}</p>`:'')}
    <div class="savebar"><button class="btn pri" onclick="saveNote('${ab}',${canMgr})">保存</button><span class="msg" id="noteMsg"></span></div>
    ${n.by?`<p class="note" style="margin-top:6px">最後に保存：${esc(n.by)}</p>`:''}</div>`;

  const reqHtml = reqCard(s,c);
  const left = head + alertCard(s) + chkHtml + `<div class="card" id="dayDet">${dayDetail(s,c,pickDay(s))}</div>` + shainHtml + wdHtml + bandHtml + dayHtml;
  const right = noteHtml + reqHtml + moneyHtml + gaiHtml + adjHtml;
  document.getElementById('main').innerHTML = back + `<div class="detail"><div class="col">${left}</div><div class="col">${right}</div></div>` +
    (back?`<div style="margin-top:4px">${back}</div>`:'');
  bindTip(s);
}

// 店長・SCが「どこを調べるか」を数字から自動で出す
// ---------- 要確認（出退勤・お金）：予算の多い少ないに関係なく出す ----------
// 2026-11-06 江坂東で、別の日の出退勤を消して別の日に乗せ換えていたことが分かったため追加。
// プルーフリストには「直した印」が出ないので、手入力らしい跡とお金の入力から拾う。
const ALERT_KIND={
  round:{lb:'手入力らしい時刻',w:'ストコンで打刻すると 8:58・17:02 のように少しずれます。ちょうどの時刻が続くのは、後から手で入れた・直した可能性。ストコンの勤怠修正の記録とシフト表をくらべる'},
  split:{lb:'1日に何回も分かれた勤務',w:'本当に分けて働いたか。ほかの日の分をまとめて入れていないか'},
  overlap:{lb:'同じ時間に2か所',w:'同じ人が同じ時間に2つの店にいることはできない。どちらかが入力ミスか、乗せ換え'},
  roster:{lb:'名簿にいない人',w:'個店カルテ（名簿）に登録がない。新人の登録漏れか、だれの勤務か確認（神田さんだけに表示）'},
  kotsu:{lb:'交通費',w:'出勤した日数×往復の金額より多い／この店で働いていない。どの日の分か確認'},
  tatekae:{lb:'立替金',w:'何の立替か、レシートと理由を確認'},
  chosei:{lb:'前月調整',w:'何を調整したか（前月の打刻漏れ・時給の直し など）を確認'},
  teate:{lb:'手当',w:'有給なら有給の日数と合っているか。臨時・スキルなら、だれが決めた何の手当か確認'},
};
function alertsOf(s){return (s.alerts||[]).filter(a=>a.k!=='roster'||ME.role==='admin')}
function alertCard(s){
  const L=alertsOf(s);
  if(!L.length) return '';
  const g={}; L.forEach(a=>(g[a.k]=g[a.k]||[]).push(a));
  const body=Object.keys(ALERT_KIND).filter(k=>g[k]).map(k=>`<div class="al">
      <div class="alh">${ALERT_KIND[k].lb} <span class="note">${g[k].length}件</span></div>
      <ul>${g[k].map(a=>`<li><b>${esc(a.n)}</b>　${esc(a.t)}</li>`).join('')}</ul>
      <p class="note">→ ${ALERT_KIND[k].w}</p></div>`).join('');
  return `<div class="card alertcard"><h2>⚠ 確認してほしいこと（予算の多い少ないに関係なく）</h2>
    <p class="note">不正と決まったわけではありません。入力のあとが気になるものを機械的に拾っています。店長・SCは中身を確かめて、理由を「なぜ？ 来月どうする？」に書いてください。</p>
    ${body}</div>`;
}
function checkCard(s,c,money){
  const it=[]; const D_=D.meta;
  const diff=s.a.daily.map((v,i)=>v-s.b.daily[i]);
  // 1) 多かった日 TOP3
  const days=diff.map((d,i)=>({d,i})).filter(x=>x.d>=1).sort((a,b)=>b.d-a.d).slice(0,3);
  if(days.length) it.push({who:'m',t:`予算より多かった日：${days.map(x=>`<a href="#dayDet" onclick="showDay(${x.i});return false"><b>${D_.dates[x.i]}(${D_.wds[x.i]}) ${hs(x.d)}h</b></a>`).join('、')}`,
    w:'→ 下の「日ごとの中身」に、その日に入った人・時間ごとの人数・ふだんとの差を出しています。なぜその人数・その時間になったかを調べる'});
  // 2) 曜日のくせ
  const wk=wdStats(s).map(w=>({w:w.w,d:w.n?(w.a-w.b)/w.n:0,m:w.a-w.b})).filter(x=>x.d>=0.5).sort((a,b)=>b.d-a.d).slice(0,2);
  if(wk.length) it.push({who:'m',t:`毎週多い曜日：${wk.map(x=>`<b>${x.w}曜 1日${hs(x.d)}h</b>（月${hs(x.m)}h）`).join('、')}`,
    w:'→ この曜日の基本シフト（いつも入る人・時間）を見直す。1回だけでなく毎週なので、ここを直すと一番きく'});
  // 2-2) 時間帯
  const bst=bandStats(s,c);
  if(bst){
    const bb=bst.rows.filter(r=>r.d>=0.5).sort((a,b)=>b.d-a.d).slice(0,2);
    if(bb.length){
      const top=bb[0], j=bst.rows.indexOf(top), w2=bst.wd.slice().sort((a,b)=>b.d[j]-a.d[j])[0];
      it.push({who:'m',t:`多い時間帯：${bb.map(r=>`<b>${esc(r.nm)} 1日${hs(r.d)}h</b>`).join('、')}${w2&&w2.d[j]>=1?`（とくに${w2.w}曜 ${hs(w2.d[j])}h）`:''}`,
        w:'→ その時間に何人いたかをシフト表で見る。交代の前後の重なり・早く来る／残る人・人数の多すぎがないか'});
    }
  }
  // 3) 社員
  (s.shain||[]).filter(x=>!x.g).map(x=>({n:x.n,d:x.a-x.c,y:x.y||0})).filter(x=>Math.abs(x.d)>=8).sort((a,b)=>a.d-b.d).slice(0,3).forEach(x=>{
    it.push({who:'m',t:`社員 <b>${esc(x.n)}</b> が契約より <b>${hs(x.d)}h</b>${x.y?`（うち有給 ${h1(x.y)}h）`:''}`,
      w:x.d<0?(x.y?'→ 有給で店にいなかった時間。その穴をバイトで埋めた分がバイトの超過になっている':'→ 休み・ほかの店の応援・SC業務のどれか。足りない分をバイトで埋めたかを確認'):'→ 契約より多く入っている。バイトに回せる時間がないか確認'});
  });
  // 4) 時給・時間以外（SC）
  if(money){
    const rg=c.rate-s.b.rate;
    if(rg>=15) it.push({who:'s',t:`平均時給が予算より <b>${Math.round(rg)}円</b> 高い`,w:'→ 昇給・深夜・時給の高い人が多く入っていないか（予算は時給のズレを足してあるので、店の差には入らない）'});
    if(c.t3!==undefined&&Math.abs(c.t3)>=30000) it.push({who:'s',t:`③ 時間以外が <b>${yens(c.t3)}</b>`,w:'→ '+ntBkText(s)});
  }
  if(c.reqWait) it.push({who:'',t:`後付け予算の申告 <b>${c.reqWait}件</b> が判断待ち`,w:'→ 下の「後付け予算の申告」で神田さんが決める'});
  if(c.waitH>0) it.push({who:'',t:`店外の時間 <b>${h1(c.waitH)}h</b> が判断待ち`,w:'→ 下の「店外の時間」で神田さんが決める'});
  const goal=c.dMh>0?`<div class="goal">来月は 1日あたり ${h1(c.dMh/D_.days)}時間 へらせば 予算内</div>`:'';
  const body=it.length?`<ul class="chk">${it.map(x=>`<li>${x.who==='m'?'<span class="who-tag m">店長</span>':x.who==='s'?'<span class="who-tag s">SC</span>':''}${x.t}<span class="w">${x.w}</span></li>`).join('')}</ul>`
    :'<p class="note">大きなズレはありません。このままでOKです。</p>';
  return `<div class="card"><h2>どこを調べる？</h2>${body}${goal}
    <p class="note" style="margin-top:8px">調べたら、下の「なぜ？ 来月どうする？」に理由と来月やることを書いてください。研修・新人トレーニングなどで予算を足してほしい時は「後付け予算の申告」から申告してください。</p></div>`;
}

      <div class="t"><b>${esc(x.cat)}</b>　${esc(x.d)}${x.who?`　${esc(x.who)}`:''}　<b>${h1(+x.h)}h</b>${c.rate?`（約${yen(x.h*c.rate)}）`:''} ${stTxt(x)}

        <button class="btn sm ${x.status==='ng'?'on ng':''}" onclick="doJudgeReq('${x.id}','${s.ab}','ng')">追加しない</button></div>`:''}
      ${(isAdmin||(x.by===ME.name&&x.status!=='ok'))?`<button class="btn sm" onclick="doDelReq('${x.id}','${s.ab}')">取り消す</button>`:''}

    <label class="f">だれが</label><input type="text" id="rqWho" placeholder="例 新人 山田さん・教える人 田中さん">
    <label class="f">増えた時間（合計）</label><input type="number" id="rqH" step="0.5" min="0" inputmode="decimal" placeholder="例 6">
    <label class="f">内容（なぜ店の時間が増えたか）</label><textarea id="rqMemo" placeholder="例 新人の初日トレーニングで夕方に1人多く入れた（3h×2日）"></textarea>
    <div class="savebar"><button class="btn pri" onclick="addReq('${s.ab}')">申告する</button><span class="msg" id="rqMsg"></span></div>`:'';
  return `<div class="card"><h2>後付け予算の申告</h2>
    <p class="note">会社の決まりで店の時間が増えたものは、申告すると神田さんが確認して予算に足します。<br>
    <b>申告できる例</b>：本部・外部の研修／厨房研修／接客講座などサービス向上の研修／新人トレーニング<br>
    <b>申告できない</b>：毎月の月次ミーティング（勉強会）…最初から予算に入っています。店外の時間（下の「店外の時間」に出ているもの）も申告はいりません。</p>

// ---------- 日ごとの中身（だれが・何時に・ふだんとくらべて） ----------
let DAY_SEL=null;   // {ab, i}
const HRS=[...Array(24)].map((_,k)=>k+5);   // 5時〜翌4時
function pickDay(s){
  if(DAY_SEL&&DAY_SEL.ab===s.ab) return DAY_SEL.i;
  const d=s.a.daily.map((v,i)=>v-s.b.daily[i]); let m=0; d.forEach((v,i)=>{if(v>d[m])m=i}); return m;
}
function showDay(i){
  const s=D.stores.find(x=>x.ab===CUR); if(!s) return;
  DAY_SEL={ab:s.ab,i}; const box=document.getElementById('dayDet');
  box.innerHTML=dayDetail(s,calc(s),i); box.scrollIntoView({behavior:'smooth',block:'start'});
}
const holOf=(s,i)=>(s.hol||{})[D.meta.dates[i]]||'';
// その日に店にいた人数（店外は入れない）。休憩は時刻が分からないので引かない
function headcount(s,i){
  const sh=(s.shifts||[])[i]||[];
  return HRS.map(h=>sh.filter(r=>r[4]!=='g'&&r[5]<=h*60+30&&r[6]>h*60+30).length);
}
// ふだん＝同じ曜日のほかの日（祝日は外す）
function usualDays(s,i){return D.meta.wds.map((w,k)=>k).filter(k=>k!==i&&D.meta.wds[k]===D.meta.wds[i]&&!holOf(s,k))}
function dayDetail(s,c,i){
  if(!s.shifts) return '<h2>日ごとの中身</h2><p class="note">この月はシフトのくわしいデータがありません。</p>';
  const M=D.meta, a=s.a.daily[i], b=s.b.daily[i], d=a-b, hol=holOf(s,i);
  const diffs=s.a.daily.map((v,k)=>v-s.b.daily[k]);
  const top=diffs.map((v,k)=>({v,k})).filter(x=>x.v>=1).sort((x,y)=>y.v-x.v).slice(0,6).sort((x,y)=>x.k-y.k);
  const chips=top.map(x=>`<button class="btn ${x.k===i?'on':''}" onclick="showDay(${x.k})">${M.dates[x.k]}(${M.wds[x.k]}) ${hs(x.v)}h</button>`).join('');
  const sel=`<select onchange="showDay(+this.value)" style="max-width:240px">${M.dates.map((dt,k)=>`<option value="${k}" ${k===i?'selected':''}>${dt}（${M.wds[k]}${holOf(s,k)?'・祝':''}） ${hs(diffs[k])}h</option>`).join('')}</select>`;
  const ud=usualDays(s,i), uAvg=ud.length?sum(ud.map(k=>s.a.daily[k]))/ud.length:null;
  // その日の人（同じ人の複数行はまとめる。店外は別の行）
  const sh=s.shifts[i]||[], ppl=[];
  sh.forEach(r=>{const g=r[4]==='g'; let p=ppl.find(x=>x.n===r[0]&&(x.k==='g')===g);
    if(!p){p={n:r[0],k:r[4],t:[],h:0};ppl.push(p)} p.t.push(r[1]+'〜'+r[2]); p.h+=r[3];});
  const usualH=n=>ud.length?sum(ud.map(k=>sum(((s.shifts[k]||[]).filter(r=>r[0]===n&&r[4]!=='g')).map(r=>r[3]))))/ud.length:null;
  ppl.forEach(p=>{p.u=p.k==='g'?null:usualH(p.n)});
  const rows=ppl.map(p=>{const up=p.k==='b'&&p.u!==null&&(p.u<0.05||p.h-p.u>=2);
    return `<tr class="${up?'up':''}"><td class="k">${esc(p.n)}${p.k==='s'?'<span class="tag">社員</span>':''}${p.k==='g'?'<span class="tag">店外</span>':''}</td>
      <td class="k">${p.t.map(esc).join('<br>')}</td><td>${h1(p.h)}h</td>
      <td class="k">${p.k==='g'?'<small>店の時間に入れない</small>':p.u===null?'−':p.u<0.05?'<span class="tag o">ふだんは入らない</span>':`${h1(p.u)}h${p.k==='b'&&p.h-p.u>=2?`<span class="tag o">${hs(p.h-p.u)}h</span>`:''}`}</td></tr>`}).join('');
  // 時間ごとの人数
  const hc=headcount(s,i), hus=ud.map(k=>headcount(s,k)), hu=HRS.map((_,j)=>ud.length?sum(hus.map(x=>x[j]))/ud.length:null);
  const more=[]; HRS.forEach((h,j)=>{if(hu[j]!==null&&hc[j]-hu[j]>=0.75){const l=more[more.length-1];
    if(l&&l.e===h){l.e=h+1;l.n0=Math.min(l.n0,hc[j]);l.n1=Math.max(l.n1,hc[j]);l.u0=Math.min(l.u0,hu[j]);l.u1=Math.max(l.u1,hu[j])}
    else more.push({s:h,e:h+1,n0:hc[j],n1:hc[j],u0:hu[j],u1:hu[j]})}});
  const rg=(x,y)=>Math.round(x)===Math.round(y)?String(Math.round(x)):Math.round(x)+'〜'+Math.round(y);
  const hh=h=>(h%24)+'時';
  // 社員
  const shC1=c.shC/M.days, shA1=(s.a.dailyShain||[])[i]||0, shGap=shC1-shA1;
  const yq=(s.shain||[]).filter(x=>!x.g&&x.y>=8);
  const why=[];
  if(hol) why.push(`<b>祝日（${esc(hol)}）</b><small>ふだんの${M.wds[i]}曜とお客さんの数がちがう日。「祝日で忙しいから人をふやした」なら、売上も見てふやしすぎでないか確認</small>`);
  if(uAvg!==null) why.push(`ふだんの${M.wds[i]}曜（${ud.length}日の平均）は <b>${h1(uAvg)}h</b> → この日は <b class="${a-uAvg>0?'pl':'mi'}">${hs(a-uAvg)}h</b>`+
    `<small>${a-uAvg>=1?'この日だけ多かった分。下の「ふだんより人が多い時間」「ふだんより長い人」を見る':'この日だけ多いのではなく、ふだんの'+M.wds[i]+'曜から予算より多い（毎週のシフトの組み方を見る）'}</small>`);
  if(shC1>0&&shGap>=1) why.push(`社員が店にいたのは <b>${h1(shA1)}h</b>（契約どおりなら1日 ${h1(shC1)}h）→ <b>${h1(shGap)}h</b> 少ない`+
    `<small>${yq.length?yq.map(x=>`${esc(x.n)}：この月は有給 ${h1(x.y)}h（店に入っていない）`).join('／')+'。':''}社員がいない分をバイトでうめると、バイトの時間は予算より多くなる</small>`);
  if(more.length) why.push(`ふだんより人が多い時間：${more.map(m=>`<b>${hh(m.s)}〜${hh(m.e)} ${rg(m.n0,m.n1)}人</b>（ふだん${rg(m.u0,m.u1)}人）`).join('、')}<small>この時間に、なぜ人を多く入れたかを見る（新人の教育？納品？忙しい？交代の重なり？）</small>`);
  const longP=ppl.filter(p=>p.k==='b'&&p.u!==null&&(p.u<0.05||p.h-p.u>=2));
  if(longP.length) why.push(`ふだんより長い・ふだんは入らない人：${longP.map(p=>`<b>${esc(p.n)}</b> ${h1(p.h)}h${p.u<0.05?'（ふだんは入らない）':`（ふだん${h1(p.u)}h）`}`).join('、')}<small>だれかの代わり（欠勤・欠員）？　教育？　なぜこの時間になったかを本人・シフトを作った人に聞く</small>`);
  return `<h2>日ごとの中身（だれが・何時に）</h2>
    <p class="note">予算より多かった日（多い順に6日まで）：</p><div class="dchips">${chips||'<span class="note">なし</span>'}</div>
    <div style="margin-bottom:8px">${sel}</div>
    <h3 style="font-size:15px;color:var(--text)">${M.dates[i]}（${M.wds[i]}${hol?'・祝 '+esc(hol):''}）</h3>
    <div class="big"><div><div class="l">予算(バイト)</div><div class="v">${h1(b)}<small>h</small></div></div>
      <div><div class="l">実績(バイト)</div><div class="v">${h1(a)}<small>h</small></div></div>
      <div><div class="l">差</div><div class="v ${d>0?'pl':'mi'}">${hs(d)}<small>h</small></div></div></div>
    ${why.length?`<ul class="why">${why.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
    <h3>この日に入った人</h3>
    <table class="ppl"><tr><th>名前</th><th>時間</th><th>働いた</th><th>ふだんの${M.wds[i]}曜</th></tr>${rows||'<tr><td colspan="4" class="k">出勤なし</td></tr>'}</table>
    <p class="note" style="margin-top:4px">働いた＝休憩を引いた時間。オレンジの行＝ふだんより2h以上長い人・ふだんは入らない人。</p>
    <h3>時間ごとの人数（店にいた人・社員もふくむ）</h3>
    <div class="hrs"><table><tr><th></th>${HRS.map(h=>`<th>${h%24}</th>`).join('')}</tr>
      <tr><th>この日</th>${hc.map((v,j)=>`<td class="${hu[j]!==null&&v-hu[j]>=0.75?'up':hu[j]!==null&&hu[j]-v>=0.75?'dn':''}">${v}</td>`).join('')}</tr>
      <tr><th>ふだん</th>${hu.map(v=>`<td>${v===null?'−':h1(v)}</td>`).join('')}</tr></table></div>
    <p class="note" style="margin-top:4px">各時間の30分の時点で店にいた人数（休憩は時刻が分からないので引いていません）。オレンジ＝ふだんより多い、青＝少ない。ふだん＝同じ曜日のほかの日（祝日をのぞく）の平均。横にスクロールできます。</p>
    <p class="note" style="margin-top:8px"><b>店長・SCへ</b>：だれが・何時にいたかはこの表で分かります。<b>なぜ</b>その人数・その時間にしたのかを調べて、「なぜ？ 来月どうする？」に書いてください。</p>`;
}

function daySvg(s){
  const n=D.meta.days, W=640, H=220, L=34, R=6, T=10, B=28;
  const mx=Math.max(...s.a.daily,...s.b.daily)*1.1||1;
  const bw=(W-L-R)/n, y=v=>T+(H-T-B)*(1-v/mx);
  const step=mx>60?20:mx>30?10:5;
  let g='';
  for(let v=0;v<=mx;v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#E5E7EB"/><text x="${L-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#6B7280">${v}</text>`;
  let bars='', line='', lbl='';
  s.a.daily.forEach((v,i)=>{
    const x=L+i*bw+1, w=Math.max(2,bw-2), over=v>s.b.daily[i];
    bars+=`<path d="M${x},${y(0)}V${y(v)+3}q0,-3 3,-3h${w-6}q3,0 3,3V${y(0)}Z" fill="${over?'var(--over)':'var(--act)'}"/>`;
    bars+=`<rect class="hit" data-i="${i}" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>`;
    line+=(i?'L':'M')+(L+i*bw)+','+y(s.b.daily[i])+'H'+(L+(i+1)*bw);
    if(i%5===0||i===n-1) lbl+=`<text x="${L+i*bw+bw/2}" y="${H-10}" font-size="10" text-anchor="middle" fill="#6B7280">${D.meta.dates[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="日ごとの実績MHと予算MH">${g}${bars}<path d="${line}" fill="none" stroke="var(--ref)" stroke-width="2" stroke-dasharray="4 3"/>${lbl}</svg>`;
}
function bindTip(s){
  const box=document.getElementById('dayChart'); if(!box) return;
  const tip=document.getElementById('tip');
  const show=e=>{const t=e.target.closest('.hit'); if(!t){tip.style.display='none';return}
    const i=+t.dataset.i, r=box.getBoundingClientRect(), b=t.getBoundingClientRect();
    tip.innerHTML=`${D.meta.dates[i]}（${D.meta.wds[i]}）<br>実績 ${h1(s.a.daily[i])}h ／ 予算 ${h1(s.b.daily[i])}h<br>差 ${hs(s.a.daily[i]-s.b.daily[i])}h<br><small>押すと中身</small>`;
    tip.style.left=(b.left-r.left+b.width/2)+'px'; tip.style.top=(b.top-r.top+20)+'px'; tip.style.display='block';};
  box.addEventListener('mousemove',show); box.addEventListener('click',e=>{show(e);const t=e.target.closest('.hit');if(t)showDay(+t.dataset.i)});
  box.addEventListener('mouseleave',()=>tip.style.display='none');
}

// ---------- 保存 ----------
async function saveNote(ab,canMgr){
  const msg=document.getElementById('noteMsg'); msg.textContent='保存中…';
  const body={action:'saveNote',ym:D.meta.ym,ab};
  if(canMgr){['r1','r2','memo','next'].forEach(k=>body[k]=document.getElementById(k).value); if(ME.role==='sc') body.asMgr=true;}
  const sm=document.getElementById('scMemo'); if(sm) body.scMemo=sm.value;
  try{
    const r=await api(authBody(body));
    const i=D.notes.findIndex(x=>x.ab===ab); if(i>=0) D.notes[i]=r.note; else D.notes.push(r.note);
    msg.textContent='保存しました ✓';
  }catch(e){msg.textContent='';alert('保存できませんでした：'+e.message)}
}
async function doJudge(id,ab,status){
  const cur=judgeOf(id); if(cur===status) status='';
  try{
    await api(authBody({action:'judge',ym:D.meta.ym,id,ab,status}));
    const i=D.judges.findIndex(x=>x.id===id); if(i>=0) D.judges[i].status=status; else D.judges.push({ym:D.meta.ym,id,ab,status});
    showStore(ab);
  }catch(e){alert('保存できませんでした：'+e.message)}
}
async function saveAdj(ab){
  const msg=document.getElementById('adjMsg'); msg.textContent='保存中…';
  const yenV=Number(document.getElementById('adjYen').value)||0, memo=document.getElementById('adjMemo').value;
  try{
    await api(authBody({action:'saveAdj',ym:D.meta.ym,ab,yen:yenV,memo}));
    const i=D.adjs.findIndex(x=>x.ab===ab); if(i>=0){D.adjs[i].yen=yenV;D.adjs[i].memo=memo} else D.adjs.push({ym:D.meta.ym,ab,yen:yenV,memo});
    showStore(ab);
  }catch(e){msg.textContent='';alert('保存できませんでした：'+e.message)}
}

async function addReq(ab){
  const msg=document.getElementById('rqMsg');
  const v=k=>document.getElementById(k).value.trim();
  const body={action:'addReq',ym:D.meta.ym,ab,cat:v('rqCat'),d:v('rqD'),who:v('rqWho'),h:Number(v('rqH')),memo:v('rqMemo')};
  if(!body.cat){msg.textContent='種類をえらんでください';return}
  if(!(body.h>0)){msg.textContent='時間を入れてください';return}
  if(!body.memo){msg.textContent='内容を書いてください';return}
  msg.textContent='送信中…';
  try{
    const r=await api(authBody(body));
    (D.reqs=D.reqs||[]).push(r.req); showStore(ab);
  }catch(e){msg.textContent='送れませんでした：'+e.message}
}
async function doJudgeReq(id,ab,status){
  const x=(D.reqs||[]).find(r=>r.id===id); if(!x) return;
  if(x.status===status) status='';
  const reply=(document.getElementById('rr_'+id)||{}).value||'';
  try{
    await api(authBody({action:'judgeReq',id,status,reply}));
    x.status=status; x.reply=reply; showStore(ab);
  }catch(e){alert('保存できませんでした：'+e.message)}
}
async function doDelReq(id,ab){
  try{
    await api(authBody({action:'delReq',id}));
    D.reqs=(D.reqs||[]).filter(r=>r.id!==id); showStore(ab);
  }catch(e){alert('取り消せませんでした：'+e.message)}
}

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3つの徹底チェック｜出来栄え基準</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
:root{
  --blue:#0068b7; --blue-d:#00529a; --bg:#eef2f7; --card:#fff;
  --text:#16212c; --muted:#6b7a89; --line:#dde5ee;
  --ok:#12a150; --ng:#e0344a; --na:#8a97a4; --warn:#e8871a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;padding-bottom:96px;}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit;}

/* ── ヘッダー ── */
header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--blue),var(--blue-d));
  color:#fff;padding:10px 12px calc(10px + env(safe-area-inset-top,0)) ;padding-top:calc(10px + env(safe-area-inset-top,0));}
.hdr-top{display:flex;align-items:center;gap:8px;}
.hdr-top h1{font-size:.95rem;font-weight:700;letter-spacing:.02em;flex:1;}
.hdr-top input{flex:0 0 104px;min-width:0;padding:6px 9px;border:none;border-radius:7px;
  background:rgba(255,255,255,.92);font-size:.76rem;font-weight:600;}
.hdr-sel{display:flex;gap:6px;margin-top:8px;}
.hdr-sel select,.hdr-sel input{flex:1;min-width:0;padding:9px 10px;border:none;border-radius:9px;
  background:rgba(255,255,255,.95);font-size:.88rem;font-weight:600;}
.hdr-sel input{flex:0 0 34%;font-weight:500;}
.scorebar{display:flex;align-items:baseline;gap:8px;margin-top:9px;font-size:.75rem;}
.scorebar .big{font-size:1.5rem;font-weight:800;line-height:1;}
.scorebar .prog{flex:1;height:7px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;}
.scorebar .prog i{display:block;height:100%;background:#ffdf5e;width:0;transition:width .3s;}

/* ── タブ ── */
nav.tabs{position:sticky;top:0;z-index:40;display:flex;background:var(--card);
  box-shadow:0 2px 6px rgba(0,0,0,.07);overflow-x:auto;scrollbar-width:none;}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{flex:1 0 auto;padding:11px 12px;border:none;background:none;font-size:.82rem;
  font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;}
nav.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);}
nav.tabs button .cnt{display:inline-block;min-width:17px;margin-left:4px;padding:0 4px;border-radius:9px;
  background:var(--line);color:var(--muted);font-size:.64rem;font-weight:700;vertical-align:1px;}
nav.tabs button.on .cnt{background:var(--blue);color:#fff;}

main{max-width:720px;margin:0 auto;padding:12px 10px 0;}
.view{display:none;} .view.on{display:block;}

/* ── 項目カード ── */
.cat-head{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;}
.cat-head h2{font-size:.9rem;color:var(--blue-d);font-weight:800;}
.cat-head .sc{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--muted);}
.cat-head .allok{padding:5px 10px;border:1px solid var(--ok);border-radius:20px;background:#fff;
  color:var(--ok);font-size:.7rem;font-weight:700;}

.item{background:var(--card);border-radius:13px;margin-bottom:9px;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.07);border-left:5px solid var(--line);}
.item.v-ok{border-left-color:var(--ok);}
.item.v-ng{border-left-color:var(--ng);}
.item.v-na{border-left-color:var(--na);}
.item.v-mid{border-left-color:var(--warn);}
.it-head{padding:11px 12px 9px;}
.it-title{display:flex;align-items:flex-start;gap:7px;}
.it-no{flex:0 0 auto;min-width:23px;height:23px;border-radius:6px;background:var(--blue);color:#fff;
  font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.it-name{font-weight:800;font-size:.95rem;flex:1;}
.it-pt{font-size:.72rem;color:var(--muted);font-weight:700;white-space:nowrap;}
.it-check{font-size:.79rem;color:#4a5b6c;margin:6px 0 0;padding-left:30px;}
.badge-prev{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;background:#ffe9ec;
  color:var(--ng);font-size:.63rem;font-weight:800;}
.badge-fix{background:#e4f7ec;color:var(--ok);}

.judge{display:flex;gap:6px;padding:0 12px 11px;}
.judge button{flex:1;padding:11px 4px;border:1.5px solid var(--line);border-radius:10px;background:#fff;
  font-size:.86rem;font-weight:800;color:var(--muted);}
.judge button small{display:block;font-size:.6rem;font-weight:600;opacity:.85;margin-top:1px;}
.judge button[data-v="ok"].on{background:var(--ok);border-color:var(--ok);color:#fff;}
.judge button[data-v="ng"].on{background:var(--ng);border-color:var(--ng);color:#fff;}
.judge button[data-v="na"].on{background:var(--na);border-color:var(--na);color:#fff;}
.judge button[data-v="r80"].on{background:var(--ok);border-color:var(--ok);color:#fff;}
.judge button[data-v="r50"].on{background:var(--warn);border-color:var(--warn);color:#fff;}
.judge button[data-v="r0"].on{background:var(--ng);border-color:var(--ng);color:#fff;}

.detail{border-top:1px dashed var(--line);padding:10px 12px 12px;background:#fbfcfe;}
.detail.hide{display:none;}
.detail h4{font-size:.72rem;color:var(--muted);font-weight:800;margin:0 0 6px;}
.crit{display:block;padding:8px 9px;margin-bottom:5px;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-size:.79rem;line-height:1.45;}
.crit.bad{border-color:var(--ng);background:#fff5f6;}
.crit input{display:none;}
.crit .mk{display:inline-block;width:19px;height:19px;border-radius:5px;border:1.5px solid var(--line);
  margin-right:6px;vertical-align:-4px;text-align:center;line-height:16px;font-size:.75rem;font-weight:800;color:transparent;}
.crit.bad .mk{background:var(--ng);border-color:var(--ng);color:#fff;}
.memo{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:.82rem;
  resize:vertical;min-height:52px;margin-top:6px;background:#fff;}
.tips{margin-top:8px;font-size:.72rem;color:var(--muted);}
.tips summary{cursor:pointer;font-weight:700;}
.tips ul{margin:5px 0 0 16px;} .tips li{margin-bottom:2px;}

/* ── 写真 ── */
.photos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.ph{position:relative;width:70px;height:70px;border-radius:8px;overflow:hidden;background:#e6ecf3;}
.ph img{width:100%;height:100%;object-fit:cover;display:block;}
.ph button{position:absolute;top:1px;right:1px;width:20px;height:20px;border:none;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:.7rem;line-height:20px;padding:0;}
.addph{width:70px;height:70px;border:1.5px dashed var(--blue);border-radius:8px;background:#f2f8ff;
  color:var(--blue);font-size:.66rem;font-weight:700;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;}
.addph span{font-size:1.2rem;line-height:1;}

/* ── 一覧・レポート ── */
.panel{background:var(--card);border-radius:13px;padding:13px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.panel h3{font-size:.88rem;font-weight:800;margin-bottom:9px;color:var(--blue-d);}
.storelist{display:grid;grid-template-columns:1fr;gap:6px;}
.srow{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);
  border-radius:10px;background:#fff;text-align:left;}
.srow .nm{flex:1;font-size:.85rem;font-weight:700;}
.srow .st{font-size:.72rem;color:var(--muted);font-weight:700;}
.srow .sp{font-size:1rem;font-weight:800;}
.srow.done{border-color:#bfe6cd;background:#f5fdf8;}
.srow.part{border-color:#ffe0b8;background:#fffbf4;}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:11px;background:var(--blue);
  color:#fff;font-size:.92rem;font-weight:800;margin-top:8px;}
.btn.sub{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
.btn.gray{background:#eef2f7;color:#425464;border:1.5px solid var(--line);}
.btn.red{background:#fff;color:var(--ng);border:1.5px solid var(--ng);}
.btn:disabled{opacity:.45;}
.rep{font-size:.8rem;white-space:pre-wrap;background:#f7f9fc;border:1px solid var(--line);
  border-radius:9px;padding:11px;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.6;
  max-height:340px;overflow:auto;}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dotted var(--line);font-size:.82rem;}
.kv b{font-weight:800;}
.mini{font-size:.72rem;color:var(--muted);margin-top:6px;line-height:1.5;}
.repph{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.repph img{width:62px;height:62px;object-fit:cover;border-radius:7px;}

/* ── フッター操作 ── */
.fab{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0));
  display:flex;gap:7px;backdrop-filter:blur(6px);}
.fab button{flex:1;padding:12px 4px;border:none;border-radius:10px;font-size:.84rem;font-weight:800;}
.fab .prev,.fab .next{background:#eef2f7;color:#42566a;flex:0 0 68px;}
.fab .save{background:var(--blue);color:#fff;}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:99;background:rgba(20,30,40,.93);
  color:#fff;padding:11px 18px;border-radius:22px;font-size:.83rem;font-weight:700;opacity:0;
  transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center;}
.toast.on{opacity:1;}
canvas#repcv{max-width:100%;border-radius:9px;border:1px solid var(--line);margin-top:8px;}
</style>
</head>
<body>

<header>
  <div class="hdr-top">
    <h1>3つの徹底チェック / 出来栄え基準</h1>
    <input id="selInsp" placeholder="実施者名" autocomplete="name">
  </div>
  <div class="hdr-sel">
    <select id="selStore"></select>
    <input type="date" id="selDate">
  </div>
  <div class="scorebar">
    <span class="big" id="scNum">–</span>
    <span id="scDen">/100点</span>
    <span class="prog"><i id="scBar"></i></span>
    <span id="scDone">0/33</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main>
  <div class="view on" id="v-check"></div>
  <div class="view" id="v-list"></div>
  <div class="view" id="v-report"></div>
</main>

<div class="fab">
  <button class="prev" id="btnPrev">◀</button>
  <button class="save" id="btnSave">保存して次のカテゴリへ</button>
  <button class="next" id="btnNext">▶</button>
</div>
<div class="toast" id="toast"></div>

/* type:'all'  … 全て満たせば満点／1項目でもダメなら0点

const ITEMS = [

const TOTAL_PT = ITEMS.reduce((s,i)=>s+i.pt,0);   // = 100
const byNo = {}; ITEMS.forEach(i=>byNo[i.no]=i);

/* ================================================================
   IndexedDB（端末内保存）
   checks : {id:'storeId_YYYY-MM-DD', storeId, storeName, date, inspector,
             results:{ no: {v,failed[],memo,photos[pid]} }, updatedAt}
   photos : {pid, blob, w, h}
   ================================================================ */
let DB=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('dekibae',1);
    r.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('checks')) db.createObjectStore('checks',{keyPath:'id'});
      if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos',{keyPath:'pid'});
    };
    r.onsuccess=e=>{DB=e.target.result;res(DB);};
    r.onerror=e=>rej(e.target.error);
  });
}
function tx(store,mode){return DB.transaction(store,mode).objectStore(store);}
function idbPut(store,val){return new Promise((res,rej)=>{const q=tx(store,'readwrite').put(val);q.onsuccess=()=>res(val);q.onerror=()=>rej(q.error);});}
function idbGet(store,key){return new Promise((res,rej)=>{const q=tx(store,'readonly').get(key);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);});}
function idbAll(store){return new Promise((res,rej)=>{const q=tx(store,'readonly').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});}
function idbDel(store,key){return new Promise((res,rej)=>{const q=tx(store,'readwrite').delete(key);q.onsuccess=()=>res();q.onerror=()=>rej(q.error);});}

function todayStr(){

  return d.toISOString().slice(0,10);
}
function keyOf(storeId,date){return storeId+'_'+date;}
function storeName(id){const s=STORES.find(s=>s.id==id);return s?s.name:'';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg,ms){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),ms||1800);}

function blankRec(storeId,date){

          date:date,inspector:localStorage.getItem('dekibae_inspector')||'',results:{},updatedAt:''};

function resOf(no){

  return S.rec.results[no];
}

/* ================================================================
   採点
   all  : ok=満点 / ng=0点 / na=対象外（分母から除外）
   staff: r80=満点 / r50=2点 / r0=0点 / na=対象外
   ================================================================ */
function itemScore(it,r){
  if(!r||!r.v||r.v==='na') return null;
  if(it.type==='staff'){ return r.v==='r80'?it.pt : r.v==='r50'?2 : 0; }
  return r.v==='ok'?it.pt:0;
}
function calcScore(rec){
  let got=0,den=0,done=0,na=0;
  ITEMS.forEach(it=>{
    const r=rec.results[it.no];
    if(!r||!r.v){return;}
    done++;
    if(r.v==='na'){na++;return;}
    den+=it.pt; got+=itemScore(it,r);
  });
  const denAll = TOTAL_PT - ITEMS.filter(it=>{const r=rec.results[it.no];return r&&r.v==='na';})
                                 .reduce((s,it)=>s+it.pt,0);
  return {got,den,done,na,denAll,
          pct: denAll>0 ? Math.round(got/denAll*1000)/10 : 0,
          conv: denAll>0 ? Math.round(got/denAll*100) : 0};
}
function catScore(rec,cat){
  let got=0,full=0,done=0,n=0;
  ITEMS.filter(i=>i.cat===cat).forEach(it=>{
    n++;
    const r=rec.results[it.no];
    if(r&&r.v){done++; if(r.v!=='na'){full+=it.pt;got+=itemScore(it,r);} }
    else full+=it.pt;
  });
  return {got,full,done,n};
}

/* ================================================================
   写真（項目別・複数枚）
   撮影した写真は長辺1280pxのJPEGに圧縮してIndexedDBへ保存する
   ================================================================ */
function compress(file,max,q){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let{width:w,height:h}=img;
        const sc=Math.min(1,max/Math.max(w,h));
        w=Math.round(w*sc); h=Math.round(h*sc);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        cv.toBlob(b=>b?res({blob:b,w,h}):rej(new Error('画像変換に失敗')),'image/jpeg',q);
      };
      img.onerror=()=>rej(new Error('画像を読み込めません'));
      img.src=fr.result;
    };
    fr.onerror=()=>rej(new Error('ファイルを読み込めません'));
    fr.readAsDataURL(file);
  });
}
function phUrl(pid,blob){
  if(!S.urls[pid]) S.urls[pid]=URL.createObjectURL(blob);
  return S.urls[pid];
}
async function renderPhotos(box,no){
  const r=resOf(no);
  box.innerHTML='';
  for(const pid of r.photos){
    const p=await idbGet('photos',pid);
    const d=document.createElement('div'); d.className='ph';
    if(p){ const im=new Image(); im.src=phUrl(pid,p.blob); im.loading='lazy'; d.appendChild(im); }
    const x=document.createElement('button'); x.textContent='✕';
    x.onclick=async()=>{
      r.photos=r.photos.filter(v=>v!==pid);
      await idbDel('photos',pid); await save(); renderPhotos(box,no);
    };
    d.appendChild(x); box.appendChild(d);
  }
  const add=document.createElement('button'); add.className='addph';
  add.innerHTML='<span>📷</span>写真を追加';
  add.onclick=()=>{
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.multiple=true;
    inp.onchange=async()=>{
      const files=[...inp.files];
      if(!files.length) return;
      toast('写真を保存中…',6000);
      for(const f of files){
        try{
          const{blob,w,h}=await compress(f,1280,.72);
          const pid='P'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
          await idbPut('photos',{pid,blob,w,h});
          r.photos.push(pid);
        }catch(e){ toast('保存できない写真がありました'); }
      }
      await save(); renderPhotos(box,no); render();
      toast(files.length+'枚追加しました');
    };
    inp.click();
  };
  box.appendChild(add);
}

let saveTimer=null;
async function save(){
  S.rec.updatedAt=new Date().toISOString();
  S.rec.storeName=storeName(S.rec.storeId);
  const insp=S.rec.inspector||localStorage.getItem('dekibae_inspector')||'';
  S.rec.inspector=insp;
  await idbPut('checks',JSON.parse(JSON.stringify(S.rec)));
  clearTimeout(saveTimer); saveTimer=setTimeout(refreshAll,120);
}
async function refreshAll(){ S.allRecs=await idbAll('checks'); }
async function loadRec(){
  const id=keyOf(S.storeId,S.date);
  S.rec = await idbGet('checks',id) || blankRec(S.storeId,S.date);
  if(!S.rec.results) S.rec.results={};
  await refreshAll();
  // 同一店舗の直近（今回より前）の記録を改善確認用に持つ
  S.prev = S.allRecs.filter(r=>r.storeId==S.storeId && r.date < S.date)
                    .sort((a,b)=>b.date.localeCompare(a.date))[0] || null;
}

async function backup(){
  toast('書き出し中…',8000);
  const checks=await idbAll('checks');
  const photos=await idbAll('photos');
  const ph=[];
  for(const p of photos){
    ph.push({pid:p.pid,w:p.w,h:p.h,data:await blobToDataUrl(p.blob)});
  }
  const json=JSON.stringify({app:'dekibae',ver:APP_VER,exportedAt:new Date().toISOString(),checks,photos:ph});
  dl(new Blob([json],{type:'application/json'}),`出来栄えチェック_backup_${S.date}.json`);
  toast('バックアップを書き出しました');
}
function restore(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    try{
      const o=JSON.parse(await f.text());
      if(o.app!=='dekibae') throw new Error('このアプリのバックアップではありません');
      if(!confirm(`検査${(o.checks||[]).length}件・写真${(o.photos||[]).length}枚を読み込みます。\n同じ店舗・同じ日付の記録は上書きされます。よろしいですか？`)) return;
      for(const c of (o.checks||[])) await idbPut('checks',c);
      for(const p of (o.photos||[])) await idbPut('photos',{pid:p.pid,w:p.w,h:p.h,blob:dataUrlToBlob(p.data)});
      await loadRec(); render(); toast('読み込みました');
    }catch(e){ alert('読み込めませんでした：'+e.message); }
  };
  inp.click();
}
function blobToDataUrl(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});}
function dataUrlToBlob(u){
  const[m,b64]=u.split(',');const mime=m.match(/:(.*?);/)[1];const bin=atob(b64);
  const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function dl(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
/* ================================================================
   店長フィードバック
   ================================================================ */
function ngItems(rec){
  return ITEMS.filter(it=>{
    const r=rec.results[it.no];
    return r&&r.v&&r.v!=='na'&&itemScore(it,r)<it.pt;
  });
}
function wd(ds){return['日','月','火','水','木','金','土'][new Date(ds+'T00:00:00').getDay()];}

function buildText(rec){
  const sc=calcScore(rec);
  const L=[];
  L.push('━━━━━━━━━━━━━━');
  L.push('【3つの徹底チェック】');
  L.push(`${rec.storeName}店  ${rec.date.slice(5).replace('-','/')}(${wd(rec.date)})`);
  L.push(`合計 ${sc.got} / ${sc.denAll}点${sc.denAll!==100?`（100点換算 ${sc.conv}点）`:''}`);
  if(sc.done<ITEMS.length) L.push(`※未入力が${ITEMS.length-sc.done}項目あります（暫定）`);
  L.push('━━━━━━━━━━━━━━');
  CATS.forEach(c=>{
    const cs=catScore(rec,c.key);
    const bad=cs.got<cs.full?' ▼':'';
    L.push(`${c.label.padEnd(5,'　')} ${cs.got}/${cs.full}${bad}`);
  });
  const ngs=ngItems(rec);
  if(!ngs.length){
    L.push('');L.push('■ 全項目クリア。この状態を維持してください。');
  }else{
    L.push('');L.push(`■ 要改善 ${ngs.length}件`);
    ngs.forEach(it=>{
      const r=rec.results[it.no];
      const s=itemScore(it,r);
      L.push('');
      L.push(`【${it.no}】${it.name}  ${s}/${it.pt}点`);
      if(it.type==='staff'){
        L.push(`  ・${r.v==='r50'?'半分以上':'半分未満'}の従業員しかできていません`);
      }
      (r.failed||[]).forEach(i=>L.push(`  ・${it.cr[i]}`));
      if(r.memo) L.push(`  → ${r.memo}`);
      if(r.photos.length) L.push(`  📷 写真${r.photos.length}枚あり`);
    });
  }
  const fixed=fixedItems(rec);
  if(fixed.length){
    L.push('');L.push('■ 前回から改善できた項目 ✓');
    fixed.forEach(it=>L.push(`  ・${it.name}`));
  }
  L.push('');
  L.push(`実施者：${rec.inspector||'—'}`);
  return L.join('\n');
}
function fixedItems(rec){
  const prev=S.allRecs.filter(r=>r.storeId==rec.storeId&&r.date<rec.date)
                      .sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!prev) return [];
  return ITEMS.filter(it=>{
    const p=prev.results[it.no],r=rec.results[it.no];
    if(!p||!r||!p.v||!r.v||p.v==='na'||r.v==='na') return false;
    return itemScore(it,p)<it.pt && itemScore(it,r)===it.pt;
  });
}

function renderReport(){
  const rec=S.rec, sc=calcScore(rec);
  if(!sc.done) return `<div class="panel"><h3>店長フィードバック</h3>
    <p class="mini">まだこの店舗・この日付のチェックが入力されていません。上のタブから入力してください。</p></div>`;
  const ngs=ngItems(rec);
  const nPh=ITEMS.reduce((s,it)=>s+((rec.results[it.no]||{}).photos||[]).length,0);
  let h=`<div class="panel">
    <h3>${esc(rec.storeName)}店　${esc(rec.date)}（${wd(rec.date)}）</h3>
    <div class="kv"><span>合計点</span><b style="font-size:1.15rem">${sc.got} / ${sc.denAll}点</b></div>`;
  CATS.forEach(c=>{const cs=catScore(rec,c.key);
    h+=`<div class="kv"><span>${esc(c.full)}</span><b style="color:${cs.got<cs.full?'var(--ng)':'var(--ok)'}">${cs.got}/${cs.full}点</b></div>`;});
  h+=`<div class="kv"><span>要改善項目</span><b>${ngs.length}件</b></div>
      <div class="kv"><span>添付写真</span><b>${nPh}枚</b></div>
      <div class="kv"><span>未入力</span><b>${ITEMS.length-sc.done}項目</b></div>
    </div>

    <div class="panel"><h3>① LINEに貼り付けるテキスト</h3>
      <div class="rep" id="repText">${esc(buildText(rec))}</div>
      <button class="btn" id="btnCopy">📋 コピーする</button>
      <p class="mini">コピーしてLINEの店長トークに貼り付けてください。</p>
    </div>

    <div class="panel"><h3>② 改善箇所の写真（${nPh}枚）</h3>`;
  if(!nPh){ h+=`<p class="mini">写真はありません。</p>`; }
  else{
    ngs.concat(ITEMS.filter(it=>!ngs.includes(it)&&((rec.results[it.no]||{}).photos||[]).length))
       .forEach(it=>{
      const r=rec.results[it.no]||{};
      if(!r.photos||!r.photos.length) return;
      h+=`<div style="margin-bottom:10px"><b style="font-size:.82rem">【${it.no}】${esc(it.name)}</b>
        <div class="repph" data-rp="${it.no}"></div></div>`;
    });
    h+=`<button class="btn sub" id="btnShare">📤 写真をまとめて送る／保存</button>
        <p class="mini">Androidは「共有」からLINEを選べます。表示されない端末では写真が個別にダウンロードされます。</p>`;
  }
  h+=`</div>

    <div class="panel"><h3>③ レポート画像（1枚）</h3>
      <button class="btn sub" id="btnPng">🖼 スコアカードを画像で書き出す</button>
      <canvas id="repcv" style="display:none"></canvas>
      <p class="mini">LINEに1枚貼るだけで点数と要改善点が伝わります。</p>
    </div>`;
  return h;
}

async function bindReport(root){
  root.querySelectorAll('[data-rp]').forEach(async box=>{
    const r=S.rec.results[Number(box.dataset.rp)];
    for(const pid of r.photos){
      const p=await idbGet('photos',pid); if(!p) continue;
      const im=new Image(); im.src=phUrl(pid,p.blob); im.loading='lazy'; box.appendChild(im);
    }
  });
  const c=root.querySelector('#btnCopy');
  if(c) c.onclick=async()=>{
    const t=buildText(S.rec);
    try{ await navigator.clipboard.writeText(t); toast('コピーしました'); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove(); toast('コピーしました');
    }
  };
  const sh=root.querySelector('#btnShare');
  if(sh) sh.onclick=sharePhotos;
  const pg=root.querySelector('#btnPng');
  if(pg) pg.onclick=()=>drawReport(S.rec);
}

async function sharePhotos(){
  const rec=S.rec, files=[];
  for(const it of ITEMS){
    const r=rec.results[it.no]; if(!r||!r.photos) continue;
    let n=0;
    for(const pid of r.photos){
      const p=await idbGet('photos',pid); if(!p) continue;
      n++;
      files.push(new File([p.blob],`${rec.storeName}_${it.no}_${it.name}_${n}.jpg`,{type:'image/jpeg'}));
    }
  }
  if(!files.length) return toast('写真がありません');
  if(navigator.canShare&&navigator.canShare({files})){
    try{ await navigator.share({files,title:`${rec.storeName}店 出来栄えチェック`,text:buildText(rec)}); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  files.forEach((f,i)=>setTimeout(()=>dl(f,f.name),i*350));
  toast(files.length+'枚を保存しました');
}

/* ── スコアカードPNG ─────────────────────────────── */
function drawReport(rec){
  const sc=calcScore(rec), ngs=ngItems(rec), fx=fixedItems(rec);
  const W=760, pad=30;
  const lines=[];
  ngs.forEach(it=>{
    const r=rec.results[it.no];
    lines.push({t:`【${it.no}】${it.name}　${itemScore(it,r)}/${it.pt}点`,b:true});
    if(it.type==='staff') lines.push({t:`・${r.v==='r50'?'半分以上':'半分未満'}の従業員しかできていない`});
    (r.failed||[]).forEach(i=>lines.push({t:'・'+it.cr[i]}));
    if(r.memo) lines.push({t:'→ '+r.memo,em:true});
  });
  if(fx.length){ lines.push({t:'',b:false}); lines.push({t:`✓ 前回から改善：${fx.map(i=>i.name).join('、')}`,ok:true}); }

  const wrap=[];
  const cv=document.getElementById('repcv'), g=cv.getContext('2d');
  g.font='15px sans-serif';
  lines.forEach(l=>{
    if(!l.t){wrap.push(l);return;}
    let cur='';
    for(const ch of l.t){
      if(g.measureText(cur+ch).width > W-pad*2-14){ wrap.push({...l,t:cur}); cur='　'+ch; }
      else cur+=ch;
    }
    wrap.push({...l,t:cur});
  });

  const headH=200, catH=CATS.length*30+16, bodyH=wrap.length*24+50;
  const H=headH+catH+bodyH+40;
  cv.width=W; cv.height=H;
  const x=g;
  x.fillStyle='#fff'; x.fillRect(0,0,W,H);
  // ヘッダー
  const grd=x.createLinearGradient(0,0,W,headH); grd.addColorStop(0,'#0068b7'); grd.addColorStop(1,'#00529a');
  x.fillStyle=grd; x.fillRect(0,0,W,headH);
  x.fillStyle='#fff';
  x.font='bold 20px sans-serif'; x.fillText('3つの徹底チェック / 出来栄え基準',pad,44);
  x.font='bold 30px sans-serif'; x.fillText(rec.storeName+'店',pad,88);
  x.font='15px sans-serif';
  x.fillText(`${rec.date}（${wd(rec.date)}）　実施者：${rec.inspector||'—'}`,pad,116);
  x.font='bold 62px sans-serif'; x.textAlign='right';
  x.fillText(String(sc.got),W-pad-92,110);
  x.font='bold 22px sans-serif'; x.fillText(`/ ${sc.denAll}点`,W-pad,110);
  x.textAlign='left';
  // 全体バー
  x.fillStyle='rgba(255,255,255,.28)'; x.fillRect(pad,144,W-pad*2,16);
  x.fillStyle='#ffdf5e'; x.fillRect(pad,144,(W-pad*2)*(sc.denAll?sc.got/sc.denAll:0),16);
  x.fillStyle='#fff'; x.font='13px sans-serif';
  x.fillText(`入力 ${sc.done}/${ITEMS.length}項目　要改善 ${ngs.length}件`,pad,180);

  // カテゴリ別
  let y=headH+30;
  CATS.forEach(c=>{
    const cs=catScore(rec,c.key), ratio=cs.full?cs.got/cs.full:0;
    x.fillStyle='#16212c'; x.font='bold 15px sans-serif';
    x.fillText(c.full,pad,y);
    x.fillStyle='#e6ecf3'; x.fillRect(pad+180,y-13,340,16);
    x.fillStyle= ratio===1?'#12a150' : ratio>=.8?'#e8871a' : '#e0344a';
    x.fillRect(pad+180,y-13,340*ratio,16);
    x.fillStyle='#16212c'; x.font='bold 15px sans-serif'; x.textAlign='right';
    x.fillText(`${cs.got}/${cs.full}`,W-pad,y); x.textAlign='left';
    y+=30;
  });

  // 要改善
  y+=22;
  x.fillStyle='#00529a'; x.font='bold 16px sans-serif';
  x.fillText(ngs.length?`■ 要改善項目（${ngs.length}件）`:'■ 全項目クリア。この状態を維持してください。',pad,y);
  y+=26;
  wrap.forEach(l=>{
    if(!l.t){y+=12;return;}
    x.font=(l.b?'bold ':'')+'15px sans-serif';
    x.fillStyle= l.ok?'#12a150' : l.b?'#e0344a' : l.em?'#00529a' : '#3c4b5a';
    x.fillText(l.t,pad+(l.b?0:8),y);
    y+=24;
  });
  x.fillStyle='#8a97a4'; x.font='12px sans-serif';
  x.fillText('有限会社阪口商店　26年度 3つの徹底チェック出来栄え基準書に基づく',pad,H-16);

  cv.style.display='block';
  cv.toBlob(b=>{ dl(b,`出来栄えチェック_${rec.storeName}_${rec.date}.png`); toast('画像を保存しました'); },'image/png');
}

/* ================================================================
   描画・起動
   ================================================================ */
function render(){
  renderTabs(); renderScore();
  const vc=document.getElementById('v-check'),
        vl=document.getElementById('v-list'),
        vr=document.getElementById('v-report');
  [vc,vl,vr].forEach(v=>v.classList.remove('on'));
  const fab=document.querySelector('.fab');
  if(S.tab==='list'){ vl.classList.add('on'); vl.innerHTML=renderList(); bindList(vl); fab.style.display='none'; }
  else if(S.tab==='report'){ vr.classList.add('on'); vr.innerHTML=renderReport(); bindReport(vr); fab.style.display='none'; }
  else{ vc.classList.add('on'); vc.innerHTML=renderCheck(); bindCheck(vc); fab.style.display='flex'; }
}

function moveCat(dir){
  const keys=CATS.map(c=>c.key);
  let i=keys.indexOf(S.tab);
  if(i<0){S.tab=keys[0];render();window.scrollTo(0,0);return;}
  i+=dir;
  if(i<0){S.tab='list';}
  else if(i>=keys.length){S.tab='report';}
  else S.tab=keys[i];
  render(); window.scrollTo(0,0);
}

async function init(){
  await openDB();
  initHeader();
  await loadRec();
  if(!S.rec.inspector){
    const saved=localStorage.getItem('dekibae_inspector');
    if(saved) S.rec.inspector=saved;
  }
  document.getElementById('btnPrev').onclick=()=>moveCat(-1);
  document.getElementById('btnNext').onclick=()=>moveCat(1);
  document.getElementById('btnSave').onclick=async()=>{
    await save();
    const sc=calcScore(S.rec);
    if(sc.done===ITEMS.length){ S.tab='report'; render(); window.scrollTo(0,0); toast('全項目入力完了。店長FBを作成できます'); }
    else { toast(`保存しました（${sc.done}/${ITEMS.length}項目）`); moveCat(1); }
  };
  render();
}
window.addEventListener('beforeunload',()=>{Object.values(S.urls).forEach(u=>URL.revokeObjectURL(u));});
init().catch(e=>{
  document.querySelector('main').innerHTML=
    `<div class="panel"><h3>起動できませんでした</h3><p class="mini">${esc(e.message||e)}<br>
     プライベートブラウズを解除するか、別のブラウザ（Chrome / Safari）でお試しください。</p></div>`;
});
</script>

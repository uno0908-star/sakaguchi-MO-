<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>定性評価の入力（26年10月度）</title>
<script src="ls-guard.js?v=20261024"></script>
<style>
  :root { --bg:#f2f4f7; --card:#fff; --ink:#18212f; --mut:#6b7686; --line:#dde2ea; --accent:#0b4ea2; --ok:#16a34a; --mid:#e08a00; --ng:#dc2626; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Yu Gothic UI","Hiragino Sans","Meiryo UI",sans-serif; font-size:16px; line-height:1.5; padding-bottom:96px; }
  .top { position:sticky; top:0; z-index:6; background:var(--accent); color:#fff; padding:10px 12px 0; }
  .top .in { max-width:980px; margin:0 auto; }
  .ttl { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .ttl h1 { font-size:18px; margin:0; }
  .legend { display:flex; gap:6px; font-size:12.5px; font-weight:700; }
  .legend span { background:#fff; border-radius:999px; padding:2px 9px; }
  .legend .o { color:var(--ok); } .legend .t { color:var(--mid); } .legend .x { color:var(--ng); }
  .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
  .tabs button { min-height:54px; border:none; border-radius:12px 12px 0 0; background:rgba(255,255,255,.16); color:#fff; font-size:15px; font-weight:700; padding:6px 4px 0; display:flex; flex-direction:column; align-items:center; gap:5px; font-family:inherit; }
  .tabs button.on { background:var(--bg); color:var(--accent); }
  .tabs .mini { width:76%; height:6px; border-radius:4px; background:rgba(255,255,255,.35); overflow:hidden; }
  .tabs button.on .mini { background:#d5dbe5; }
  .tabs .mini i { display:block; height:100%; background:#7ee2a0; width:0; }
  .tabs button.on .mini i { background:var(--ok); }
  .wrap { max-width:980px; margin:0 auto; padding:0 10px; }
  .who { display:flex; align-items:center; gap:10px; margin:18px 4px 8px; }
  .who .av { width:40px; height:40px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; flex:none; }
  .who h2 { margin:0; font-size:18px; flex:1; }
  .who .cnt { font-size:13px; color:var(--mut); font-weight:700; }
  .who .cnt.full { color:var(--ok); }
  .cards { display:grid; gap:10px; grid-template-columns:1fr; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:16px; padding:12px; }
  .card.done { border-color:#9fd9b2; }
  .card.ex { background:#eceff3; border-style:dashed; border-color:#b8c0cc; }
  .card h3 .st { display:flex; flex-direction:column; line-height:1.3; }
  .card h3 .nm { font-size:14px; font-weight:700; color:var(--accent); }
  .card.ex h3 .nm { color:var(--mut); }
  .card.ex h3 .ck { background:#98a2b3; }
  .exbox { display:flex; align-items:center; gap:10px; }
  .exbox b { background:#6b7686; color:#fff; border-radius:999px; padding:6px 14px; font-size:15px; flex:none; }
  .exwhy { flex:1; min-height:46px; border:2px solid var(--line); border-radius:12px; padding:9px 12px; font-size:16px; font-family:inherit; resize:vertical; background:#fff; }
  .ixbtn { margin-top:8px; min-height:44px; width:100%; border:1.5px dashed #b8c0cc; border-radius:12px; background:transparent; color:var(--mut); font-size:13.5px; font-family:inherit; }
  .item.exi { background:#eceff3; border:1.5px dashed #b8c0cc; border-radius:12px; padding:10px; }
  .item.exi .exwhy { display:block; width:100%; margin-top:8px; }
  .exb { background:#6b7686; color:#fff; border-radius:999px; padding:6px 14px; font-size:15px; flex:none; }
  .item + .item { margin-top:14px; }
  #inText { width:100%; min-height:120px; border:2px solid var(--line); border-radius:12px; padding:9px 12px; font-size:14px; font-family:inherit; margin-top:8px; }
  .foot { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .card h3 { margin:0 0 10px; font-size:17px; display:flex; align-items:center; gap:8px; }
  .card h3 .ck { margin-left:auto; width:26px; height:26px; border-radius:50%; background:#e8ecf2; color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
  .card.done h3 .ck { background:var(--ok); }
  .item { margin-top:10px; }
  .item:first-of-type { margin-top:0; }
  .line { display:flex; align-items:center; gap:8px; }
  .lab { flex:1; font-size:15.5px; font-weight:700; }
  .marks { display:flex; gap:8px; }
  .marks button { width:54px; height:54px; border-radius:50%; border:2.5px solid var(--line); background:#fff; font-size:26px; font-weight:700; color:#b3bcc9; font-family:"Yu Gothic","Hiragino Sans",sans-serif; line-height:1; padding:0; }
  .marks button.on[data-m="○"] { background:var(--ok); border-color:var(--ok); color:#fff; }
  .marks button.on[data-m="△"] { background:var(--mid); border-color:var(--mid); color:#fff; }
  .marks button.on[data-m="×"] { background:var(--ng); border-color:var(--ng); color:#fff; }
  .memo { width:44px; height:44px; border-radius:12px; border:none; background:#eef1f6; color:var(--mut); font-size:18px; flex:none; }
  .memo.has { background:#dbe9fb; color:var(--accent); }
  .why { display:none; width:100%; margin-top:8px; min-height:46px; border:2px solid var(--line); border-radius:12px; padding:9px 12px; font-size:16px; font-family:inherit; resize:vertical; }
  .item.open .why { display:block; }
  .why:focus { outline:none; border-color:var(--accent); }
  .item.need .why { border-color:var(--ng); background:#fff7f7; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); z-index:10; }
  .bar .in { max-width:980px; margin:0 auto; display:flex; gap:12px; align-items:center; }
  .prog { flex:1; }
  .prog .n { font-size:13px; color:var(--mut); } .prog .n b { font-size:20px; color:var(--ink); }
  .meter { height:10px; background:#e6e9ef; border-radius:6px; overflow:hidden; margin-top:3px; }
  .meter i { display:block; height:100%; background:var(--ok); width:0; transition:width .2s; }
  .send { min-height:54px; padding:0 22px; border:none; border-radius:14px; background:var(--accent); color:#fff; font-size:17px; font-weight:700; font-family:inherit; }
  dialog { border:none; border-radius:18px; padding:0; width:min(520px,94vw); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dl { padding:18px; }
  .dl h2 { margin:0 0 4px; font-size:19px; }
  .stat { display:flex; gap:8px; margin:10px 0; }
  .stat div { flex:1; border-radius:12px; padding:8px 4px; text-align:center; font-weight:700; color:#fff; font-size:13px; }
  .stat b { display:block; font-size:22px; }
  .stat .o { background:var(--ok); } .stat .t { background:var(--mid); } .stat .x { background:var(--ng); } .stat .e { background:#98a2b3; }
  .warn { color:var(--ng); font-size:14px; font-weight:700; margin:6px 0; }
  .acts { display:grid; gap:8px; margin-top:10px; }
  .acts button { min-height:52px; border-radius:14px; border:2px solid var(--line); background:#fff; font-size:16.5px; font-weight:700; font-family:inherit; }
  .acts button.pri { background:var(--accent); color:#fff; border-color:var(--accent); }
  #dlText { position:absolute; left:-9999px; width:10px; height:10px; }
  .toast { position:fixed; left:50%; bottom:108px; transform:translateX(-50%); background:#18212f; color:#fff; padding:10px 16px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; max-width:92vw; text-align:center; }
  .toast.on { opacity:.95; }
  .foot { text-align:center; margin:22px 0 0; }
  .foot button { min-height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--mut); font-size:13px; font-family:inherit; }
  @media (min-width:760px) { .cards { grid-template-columns:1fr 1fr; } .ttl h1 { font-size:20px; } }
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="ttl"><h1>定性評価　10月度</h1>
    <div class="legend"><span class="o">○ 20点</span><span class="t">△ 10点</span><span class="x">× 0点</span></div></div>
  <div class="tabs" id="tabs"></div>
</div></div>

<div class="wrap">
  <div id="list"></div>
  <div class="foot"><button type="button" id="inBtn">前に送った内容を読みこむ</button><button type="button" id="resetBtn">ぜんぶ消してやり直す</button></div>
</div>

<div class="bar"><div class="in">
  <div class="prog"><div class="n"><b id="pn">0</b> ／ <span id="pt">0</span></div><div class="meter"><i id="pm"></i></div></div>
  <button type="button" class="send" id="sendBtn">送る</button>
</div></div>

<dialog id="dlg"><div class="dl">
  <h2>神田へ送る</h2>
  <div class="stat" id="dlStat"></div>
  <div class="warn" id="dlWarn"></div>
  <div class="acts">
    <button type="button" class="pri" id="shareBtn">LINEなどで送る</button>
    <button type="button" id="fileBtn">ファイルで保存</button>
    <button type="button" id="copyBtn">文字をコピー</button>
    <button type="button" id="closeBtn">とじる</button>
  </div>
  <textarea id="dlText" readonly aria-hidden="true" tabindex="-1"></textarea>
</div></dialog>
<dialog id="inDlg"><div class="dl">
  <h2>前に送った内容を読みこむ</h2>
  <div style="font-size:14px;color:var(--mut)">前に送った文字（【定性評価 …】で始まる文字）を、下に貼ってください。いま入っている所は変えません。空の所だけ入ります。</div>
  <textarea id="inText" aria-label="前に送った文字"></textarea>
  <div class="acts">
    <button type="button" class="pri" id="inGo">読みこむ</button>
    <button type="button" id="inClose">とじる</button>
  </div>
</div></dialog>
<div class="toast" id="toast"></div>

<script>
// ===== 対象（評価スプレッドシート 入力(26.10) の行と同じ。r＝行番号・ab＝B列の店名） =====
const MONTH = '26.10';
const ROWS = [{"r":3,"name":"吹田垂水三丁目","sc":"フィ","motr":"五島","tencho":false,"keiyaku":0,"ab":"垂水三","tn":[],"kn":[]},{"r":4,"name":"江坂東","sc":"ダハル","motr":"五島","tencho":true,"keiyaku":2,"ab":"江坂東","tn":["ジティシュ"],"kn":["中村","山田"]},{"r":5,"name":"江坂駅南口","sc":"トゥアン","motr":"五島","tencho":true,"keiyaku":0,"ab":"江坂南","tn":["ビカス"],"kn":[]},{"r":6,"name":"吹田警察署前","sc":"ダハル","motr":"髙橋","tencho":true,"keiyaku":1,"ab":"吹警察","tn":["ヘムラジ"],"kn":["速水"]},{"r":7,"name":"豊中原田南一丁目","sc":"スラズ","motr":"五島","tencho":true,"keiyaku":2,"ab":"原田南","tn":["ナレス"],"kn":["林","北川"]},{"r":8,"name":"南金田二丁目","sc":"スラズ","motr":"五島","tencho":true,"keiyaku":0,"ab":"南金田","tn":["三國"],"kn":[]},{"r":9,"name":"吹田豊津中学校前","sc":"ビスワス","motr":"五島","tencho":true,"keiyaku":0,"ab":"豊津中","tn":["マノズ"],"kn":[]},{"r":10,"name":"新御堂筋上新田","sc":"ビスワス","motr":"髙橋","tencho":true,"keiyaku":0,"ab":"上新田","tn":["ネパリ"],"kn":[]},{"r":11,"name":"東淀川大道南","sc":"フィ","motr":"髙橋","tencho":false,"keiyaku":1,"ab":"東淀川","tn":[],"kn":["原田友"]},{"r":12,"name":"豊中服部西町三丁目","sc":"フィ","motr":"五島","tencho":true,"keiyaku":0,"ab":"服部三","tn":["ズン"],"kn":[]},{"r":13,"name":"大道南一丁目","sc":"ダハル","motr":"髙橋","tencho":false,"keiyaku":1,"ab":"大道南","tn":[],"kn":["本間"]},{"r":14,"name":"豊里六丁目","sc":"フィ","motr":"髙橋","tencho":true,"keiyaku":1,"ab":"豊里六","tn":["ラジト"],"kn":["南田"]},{"r":15,"name":"吹田青山台三丁目","sc":"ビスワス","motr":"髙橋","tencho":true,"keiyaku":2,"ab":"青山台","tn":["マヘンドラ"],"kn":["清水","岡平"]},{"r":16,"name":"豊中利倉東一丁目","sc":"スラズ","motr":"五島","tencho":true,"keiyaku":0,"ab":"利倉東","tn":["プラディープ"],"kn":[]},{"r":17,"name":"五月ケ丘東","sc":null,"motr":"五島","tencho":true,"keiyaku":0,"ab":"五月東","tn":["ゴレ"],"kn":[]},{"r":18,"name":"豊中服部元町一丁目","sc":"ビスワス","motr":"五島","tencho":true,"keiyaku":0,"ab":"元町一","tn":["ビシャル"],"kn":[]},{"r":19,"name":"吹田朝日町","sc":"レサム","motr":"髙橋","tencho":true,"keiyaku":1,"ab":"朝日町","tn":["レサム"],"kn":["本間"]},{"r":20,"name":"東淀川豊里五丁目","sc":"ダハル","motr":"髙橋","tencho":true,"keiyaku":2,"ab":"豊里五","tn":["レグミ"],"kn":["南田","原田友"]},{"r":21,"name":"池田市役所前","sc":null,"motr":"髙橋","tencho":false,"keiyaku":1,"ab":"池田市","tn":[],"kn":["原田陽"]},{"r":22,"name":"箕面白島二丁目","sc":"スラズ","motr":"髙橋","tencho":true,"keiyaku":0,"ab":"白島二","tn":["カマル"],"kn":[]}];
// 役職ごとの項目（先頭＝スプレッドシートの列）
const ROLES = [
  {key:'SC',   label:'SC',      who:r => r.sc,   grp:r => r.sc + ' SC',     names:r => [r.sc],   items:[['BA','課題解決'],['BB','店長育成']]},
  {key:'MOTR', label:'MOTR',    who:r => r.motr, grp:r => r.motr + ' MOTR', names:r => [r.motr], items:[['BI','課題解決'],['BJ','店長育成']]},
  {key:'TEN',  label:'店長',    who:r => r.tencho ? '店長' : null, grp:() => '店長', names:r => r.tn, items:[['BR','課題解決'],['BS','クルー育成']]},
  {key:'KEI',  label:'契約社員', who:r => r.keiyaku ? '契約社員' : null, grp:() => '契約社員', names:r => r.kn, items:[['CJ','課題解決'],['CK','売場力']]},
];
const MARKS = ['○','△','×'];
// 最初から分かっている対象外（役職:行 → 理由）。その役職の項目を全部 対象外にしておく。オーナーが画面で 項目ごとに 入・切できる
const PRESET_EX = {"TEN:4": "帰国（9/16〜10/26）", "TEN:5": "退職", "TEN:20": "帰国（10/1〜11/30）"};
const KEY = 'teisei_input_' + MONTH;
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let D = {};            // {'BA4': {m:'○', w:'理由'}}
let X = {};            // 前の版の対象外 {'TEN:4': {on:true, w:'帰国…'}}（役職:行）。消さずに残す（XI へ引きつぐ元）
let XI = {};           // 対象外（項目ごと） {'BR4': {on:true, w:'帰国…', u:1}}　u＝人が入れた（初期値ではない）
let XS = {};           // X のうち XI へ引きつぎ済みの分の写し（前の版の画面が あとから X を変えたら 気づけるように）
const XKEY = KEY + '_xi';   // 項目ごとの対象外は 別の場所に保存する（前の版の画面が KEY を上書きしても 消えない）
let TAB = 'SC';
const OPEN = {};       // 理由の欄を開いているセル
try { const s = JSON.parse(localStorage.getItem(KEY) || '{}'); if (s && typeof s === 'object') { D = s.d || {}; X = s.x || {}; TAB = s.tab || 'SC'; } } catch (e) {}
try { const s = JSON.parse(localStorage.getItem(XKEY) || '{}'); if (s && typeof s === 'object') { XI = s.xi || {}; XS = s.xs || {}; } } catch (e) {}
// KEY は前の版と同じ形のまま（d・x・tab）。うまく保存できたら true
function save() {
  try { localStorage.setItem(XKEY, JSON.stringify({xi: XI, xs: XS, at: Date.now()})); localStorage.setItem(KEY, JSON.stringify({d: D, x: X, tab: TAB, at: Date.now()})); return true; }
  catch (e) { toast('この端末に保存できませんでした。先に「送る」で控えを取ってください'); return false; }
}
function cellsOfKey(k) { const a = String(k).split(':'), role = ROLES.find(x => x.key === a[0]); return role ? role.items.map(it => it[0] + a[1]) : []; }
// 前の版（役職ごとの対象外）で入れた内容を、項目ごとへ引きつぐ。○△×と理由（D）は さわらない
function migrate() {
  Object.keys(X).forEach(k => {
    const o = X[k] || {}, sig = JSON.stringify([!!o.on, o.w || '']);
    if (XS[k] === sig) return;                                   // もう引きついだ（その後 変わっていない）
    cellsOfKey(k).forEach(c => { XI[c] = {on: !!o.on, w: o.w || '', u: 1}; });
    XS[k] = sig;
  });
  Object.keys(PRESET_EX).forEach(k => cellsOfKey(k).forEach(c => { if (XI[c] === undefined) XI[c] = {on: true, w: PRESET_EX[k]}; }));   // まだ触っていない所だけ 初期値を入れる
}

const rowsOf = role => ROWS.filter(r => role.who(r));
const isExC = c => !!(XI[c] && XI[c].on);                                                    // その項目が対象外か
const isEx = (role, r) => role.items.every(it => isExC(it[0] + r.r));                         // その店・役職の項目が 全部 対象外か
const cellsOf = role => rowsOf(role).flatMap(r => role.items.map(it => it[0] + r.r)).filter(c => !isExC(c));   // 対象外の項目は数えない
const allCells = () => ROLES.flatMap(cellsOf);
const isSet = c => !!(D[c] && D[c].m);
const hasWhy = c => !!(D[c] && (D[c].w || '').trim());
const needWhy = c => isSet(c) && D[c].m !== '○' && !hasWhy(c);
const isOpen = c => !!OPEN[c] || hasWhy(c) || (isSet(c) && D[c].m !== '○');

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }

function renderTabs() {
  $('#tabs').innerHTML = ROLES.map(role => {
    const cs = cellsOf(role), n = cs.filter(isSet).length;
    return `<button type="button" data-tab="${role.key}" class="${role.key === TAB ? 'on' : ''}" aria-label="${esc(role.label)} ${n}／${cs.length}">${esc(role.label)}${n === cs.length ? ' ✓' : ''}<span class="mini"><i style="width:${cs.length ? n / cs.length * 100 : 100}%"></i></span></button>`;
  }).join('');
}
function renderProg() {
  const n = allCells().filter(isSet).length;
  $('#pn').textContent = n; $('#pt').textContent = allCells().length; $('#pm').style.width = (allCells().length ? n / allCells().length * 100 : 0) + '%';
}
function itemHtml(r, it) {
  const c = it[0] + r.r, v = D[c] || {};
  if (isExC(c)) return `<div class="item exi" data-cell="${c}">
    <div class="line"><div class="lab">${esc(it[1])}</div><b class="exb">対象外</b></div>
    <textarea class="exwhy" rows="1" placeholder="理由（例：帰国）" aria-label="${esc(r.name)} ${esc(it[1])} 対象外の理由">${esc((XI[c] && XI[c].w) || '')}</textarea>
    <button type="button" class="ixbtn" data-ix="${c}">対象外をやめる（評価する）</button>
  </div>`;
  return `<div class="item ${isOpen(c) ? 'open' : ''} ${needWhy(c) ? 'need' : ''}" data-cell="${c}">
    <div class="line"><div class="lab">${esc(it[1])}</div>
      <div class="marks">${MARKS.map(m => `<button type="button" data-m="${m}" class="${v.m === m ? 'on' : ''}" aria-pressed="${v.m === m}" aria-label="${esc(it[1])} ${m}">${m}</button>`).join('')}</div>
      <button type="button" class="memo ${hasWhy(c) ? 'has' : ''}" aria-label="理由を書く">✎</button></div>
    <textarea class="why" rows="1" placeholder="理由" aria-label="${esc(r.name)} ${esc(it[1])} の理由">${esc(v.w || '')}</textarea>
    <button type="button" class="ixbtn" data-ix="${c}">「${esc(it[1])}」を対象外にする</button>
  </div>`;
}
function cardDone(role, r) { return role.items.every(it => isExC(it[0] + r.r) || isSet(it[0] + r.r)); }
function cardHtml(role, r) {
  const ex = isEx(role, r), nm = role.names(r).join('・');
  return `<div class="card ${ex ? 'ex' : cardDone(role, r) ? 'done' : ''}" data-r="${r.r}">
    <h3><span class="st">${esc(r.name)}<span class="nm">${esc(nm)}</span></span><span class="ck">${ex ? '－' : '✓'}</span></h3>
    ${role.items.map(it => itemHtml(r, it)).join('')}
  </div>`;
}
function renderList() {
  const role = ROLES.find(x => x.key === TAB), rows = rowsOf(role);
  const groups = []; rows.forEach(r => { const g = role.grp(r); let o = groups.find(x => x.g === g); if (!o) groups.push(o = {g, rows: []}); o.rows.push(r); });
  $('#list').innerHTML = groups.map(o => {
    const dn = o.rows.filter(r => cardDone(role, r)).length;
    return `<div class="who"><div class="av">${esc(o.g.charAt(0))}</div><h2>${esc(o.g)}</h2><div class="cnt ${dn === o.rows.length ? 'full' : ''}" data-cnt>${dn}／${o.rows.length}店</div></div>
    <div class="cards">${o.rows.map(r => cardHtml(role, r)).join('')}</div>`;
  }).join('');
}
const list = $('#list');
function renderAll() { renderTabs(); renderList(); renderProg(); }
function refreshCard(card) {
  const role = ROLES.find(x => x.key === TAB), r = ROWS.find(x => x.r === +card.dataset.r);
  card.classList.toggle('done', !isEx(role, r) && cardDone(role, r));
  const cards = card.parentElement, cnt = cards.previousElementSibling.querySelector('[data-cnt]');
  const all = [...cards.children], dn = all.filter(x => x.classList.contains('done') || x.classList.contains('ex')).length;
  cnt.textContent = dn + '／' + all.length + '店'; cnt.classList.toggle('full', dn === all.length);
}

$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (!b) return; TAB = b.dataset.tab; save(); renderAll(); window.scrollTo({top: 0}); });
list.addEventListener('click', e => {
  const xb = e.target.closest('.ixbtn');
  if (xb) { const k = xb.dataset.ix; XI[k] = Object.assign({w: ''}, XI[k], {on: !isExC(k), u: 1}); save(); renderAll(); toast(XI[k].on ? 'この項目を 対象外にしました' : '評価する項目に もどしました'); return; }   // ○△×と理由は消さない（もどすと出てくる）
  const mb = e.target.closest('.memo');
  if (mb) { const it = mb.closest('.item'), c = it.dataset.cell; OPEN[c] = !it.classList.contains('open'); it.classList.toggle('open', OPEN[c] || isOpen(c)); if (it.classList.contains('open')) it.querySelector('.why').focus(); return; }
  const b = e.target.closest('.marks button'); if (!b) return;
  const it = b.closest('.item'), c = it.dataset.cell;
  D[c] = Object.assign({}, D[c], {m: (D[c] && D[c].m === b.dataset.m) ? '' : b.dataset.m});
  it.querySelectorAll('.marks button').forEach(x => { const on = x.dataset.m === D[c].m; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
  it.classList.toggle('open', isOpen(c)); it.classList.toggle('need', needWhy(c));
  save(); refreshCard(it.closest('.card')); renderTabs(); renderProg();
});
list.addEventListener('input', e => {
  const xw = e.target.closest('.exwhy');
  if (xw) { const k = xw.closest('.item').dataset.cell; XI[k] = Object.assign({on: true}, XI[k], {w: xw.value, u: 1}); save(); return; }
  const t = e.target.closest('.why'); if (!t) return;
  const it = t.closest('.item'), c = it.dataset.cell;
  D[c] = Object.assign({}, D[c], {w: t.value});
  it.classList.toggle('need', needWhy(c)); it.querySelector('.memo').classList.toggle('has', hasWhy(c));
  save();
});

function payload() {
  const cells = {}; allCells().forEach(c => { if (isSet(c)) cells[c] = {m: D[c].m, w: (D[c].w || '').trim()}; });
  const stores = {}; ROWS.forEach(r => { stores[r.r] = r.ab; });   // 行番号 → 店（取り込みの時に行ずれを見つけるため）
  const unset = allCells().filter(c => !isSet(c));
  // 対象外は 項目ごとに1件（cells は1つ）。取り込み側は cells の数に関係なく読める
  const excluded = []; ROLES.forEach(role => rowsOf(role).forEach(r => role.items.forEach(it => { const c = it[0] + r.r; if (isExC(c)) excluded.push({role: role.key, r: r.r, store: r.ab, names: role.names(r), item: it[1], cells: [c], w: ((XI[c] || {}).w || '').trim()}); })));
  return {app: 'teisei-input', v: 2, month: MONTH, at: new Date().toISOString(), total: allCells().length, stores, cells, unset, excluded};
}
function payloadText() { return '【定性評価 ' + MONTH + '】' + JSON.stringify(payload()); }
$('#sendBtn').addEventListener('click', () => {
  const cnt = m => allCells().filter(c => isSet(c) && D[c].m === m).length, left = allCells().filter(c => !isSet(c)).length, noWhy = allCells().filter(needWhy).length;
  $('#dlStat').innerHTML = `<div class="o">○<b>${cnt('○')}</b></div><div class="t">△<b>${cnt('△')}</b></div><div class="x">×<b>${cnt('×')}</b></div><div class="e">まだ<b>${left}</b></div>`;
  const nEx = payload().excluded.length;
  $('#dlWarn').textContent = (left ? `まだ ${left}こ 入っていません。` : '') + (noWhy ? `△・× の理由が ${noWhy}こ 空です。` : '') + (nEx ? `対象外 ${nEx}こ。` : '');
  $('#dlText').value = payloadText();
  $('#shareBtn').style.display = navigator.share ? '' : 'none';
  $('#dlg').showModal();
});
$('#closeBtn').addEventListener('click', () => $('#dlg').close());
$('#shareBtn').addEventListener('click', async () => {
  try { await navigator.share({title: '定性評価 ' + MONTH, text: payloadText()}); toast('送る画面を開きました'); }
  catch (e) { if (!e || e.name !== 'AbortError') toast('共有できませんでした。「ファイルで保存」か「文字をコピー」を使ってください'); }
});
$('#copyBtn').addEventListener('click', async () => {
  const t = $('#dlText'); let ok = false;
  try { await navigator.clipboard.writeText(t.value); ok = true; } catch (e) { t.select(); try { ok = document.execCommand('copy'); } catch (e2) {} }
  toast(ok ? 'コピーしました。LINEやメールに貼って送ってください' : 'コピーできませんでした。「ファイルで保存」を使ってください');
});
$('#fileBtn').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload(), null, 1)], {type: 'application/json'}));
  a.download = '定性評価_' + MONTH + '.json'; document.body.appendChild(a); a.click(); a.remove();
  toast('ファイルの保存を始めました。保存できたら神田へ送ってください');
});
let resetArmed = 0;
$('#resetBtn').addEventListener('click', e => {
  if (Date.now() - resetArmed < 4000) { D = {}; X = {}; XI = {}; XS = {}; migrate(); Object.keys(OPEN).forEach(k => delete OPEN[k]); save(); renderAll(); resetArmed = 0; e.target.textContent = 'ぜんぶ消してやり直す'; toast('ぜんぶ消しました'); return; }
  resetArmed = Date.now(); e.target.textContent = 'ほんとうに消す時は、もう一度押す'; setTimeout(() => { if (resetArmed) { resetArmed = 0; e.target.textContent = 'ぜんぶ消してやり直す'; } }, 4000);
});
window.addEventListener('storage', e => {
  if (!e.newValue) return;
  try {
    const s = JSON.parse(e.newValue);
    if (e.key === XKEY && s && s.xi) { XI = s.xi; XS = s.xs || XS; renderAll(); return; }
    if (e.key !== KEY || !s || !s.d) return;
    D = s.d; X = s.x || X;
    const before = JSON.stringify(XS); migrate();                  // 前の版の画面が 対象外を変えていたら 項目ごとへ写す
    if (JSON.stringify(XS) !== before) { try { localStorage.setItem(XKEY, JSON.stringify({xi: XI, xs: XS, at: Date.now()})); } catch (err) {} }
    renderAll(); toast('ほかの画面で入れた内容を読みこみました');
  } catch (err) {}
});
// 前に送った文字を読みこむ（端末の中身が消えた時の もどし用）。いま入っている所は変えない
$('#inBtn').addEventListener('click', () => { $('#inText').value = ''; $('#inDlg').showModal(); });
$('#inClose').addEventListener('click', () => $('#inDlg').close());
function importText(t) {
  try {
    t = String(t || '');
    const i = t.indexOf('{"app"'), j = t.lastIndexOf('}');
    let p = null; try { if (i >= 0 && j > i) p = JSON.parse(t.slice(i, j + 1)); } catch (e) {}
    if (!p || typeof p !== 'object' || p.app !== 'teisei-input' || !p.cells || typeof p.cells !== 'object') return '読めませんでした。文字が とちゅうで切れていないか 見てください';
    if (p.month !== MONTH) return '月がちがいます。読みこみません';
    const ok = new Set(ROLES.flatMap(role => rowsOf(role).flatMap(r => role.items.map(it => it[0] + r.r))));
    const str = x => typeof x === 'string' ? x : '';
    const preset = {}; Object.keys(PRESET_EX).forEach(k => cellsOfKey(k).forEach(c => { preset[c] = PRESET_EX[k]; }));
    const touched = c => !!(D[c] && (D[c].m || (D[c].w || '').trim()));                                  // ○△×か理由が もう入っている
    const exFree = c => XI[c] === undefined || (!XI[c].u && XI[c].on && preset[c] !== undefined);   // まだ触っていない（初期値のまま）
    // ① 先に全部を確かめる（ここでは何も変えない）
    const addD = [], addX = [];
    Object.keys(p.cells).forEach(c => { const v = p.cells[c]; if (!ok.has(c) || !v || typeof v !== 'object' || MARKS.indexOf(v.m) < 0 || touched(c) || isExC(c) && !exFree(c)) return; addD.push([c, {m: v.m, w: str(v.w)}]); });
    (Array.isArray(p.excluded) ? p.excluded : []).forEach(e => { if (!e || typeof e !== 'object' || !Array.isArray(e.cells)) return; e.cells.forEach(c => { if (typeof c !== 'string' || !ok.has(c) || touched(c) || !exFree(c)) return; addX.push([c, {on: true, w: str(e.w), u: 1}]); }); });
    // ② まとめて入れる
    const inD = new Set(addD.map(x => x[0]));
    addD.forEach(x => { D[x[0]] = x[1]; if (XI[x[0]] && XI[x[0]].on) XI[x[0]] = {on: false, w: XI[x[0]].w || '', u: 1}; });   // 送った時に評価していた項目は、初期値の対象外を外す
    let b = 0; addX.forEach(x => { if (inD.has(x[0])) return; XI[x[0]] = x[1]; b++; });
    const saved = save(); renderAll();
    return saved ? '読みこみました（○△× ' + addD.length + 'こ・対象外 ' + b + 'こ）' : '画面には入りましたが、この端末に保存できませんでした。先に「送る」で控えを取ってください';
  } catch (err) { return '読めませんでした。何も変えていません'; }
}
$('#inGo').addEventListener('click', () => { const msg = importText($('#inText').value); toast(msg); if (msg.indexOf('読みこみました') === 0) $('#inDlg').close(); });
migrate();
if (!ROLES.some(x => x.key === TAB)) TAB = 'SC';
renderAll();
</script>
</body>
</html>
